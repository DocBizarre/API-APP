          const montantStade = e._base !== null ? e._base * (parseFloat(e.pourcentage) || 0) / 100 : null;
          const paye = parseFloat(String(e.montant_paye||'').replace(',','.')) || 0;
          const reste = montantStade !== null ? montantStade - paye : null;
          const resteColor = reste === null ? '' : reste <= 0 ? 'color:#059669;font-weight:600' : 'color:#dc2626;font-weight:600';
          const modaliteStr = fmtModalite(e);
          const bonGenere = !!e.bon_genere;
          const estPaye = reste !== null && reste <= 0.005;
          const rowBg = estPaye ? 'background:#d1fae5;' : bonGenere ? 'background:#fef9c3;' : '';
          const bonArgs = `'${a.id}',${e._idx}${e._lotId ? `,'${e._lotId}'` : ''}`;
          const btnId = `bon-hdr-${a.id}-${e._lotId || 'g'}-${e._idx}`;
          const bonCell = bonGenere
            ? `<button id="${btnId}" onclick="generateBonFacturation(${bonArgs})" title="Cliquer pour re-télécharger le bon" style="background:#fef3c7;color:#d97706;border:none;border-radius:10px;padding:2px 7px;font-size:11px;font-weight:600;white-space:nowrap;cursor:pointer">${escHtml(e.bon_genere)}</button>`
            : `<button id="${btnId}" onclick="generateBonFacturation(${bonArgs})" style="background:#2563eb;color:#fff;border:none;border-radius:5px;padding:3px 8px;font-size:11px;cursor:pointer;white-space:nowrap">Bon</button>`;
          return `<tr style="${rowBg}">
            ${hasLots ? `<td style="padding:6px 10px;font-size:12px;color:var(--text-muted)">${escHtml(e._lotLibelle||'—')}</td>` : ''}
            <td style="padding:6px 10px;font-weight:500">${escHtml(e.stade||'—')}</td>
            <td style="padding:6px 10px;text-align:center">${parseFloat(e.pourcentage)||0} %</td>
            <td style="padding:6px 10px;text-align:right">${montantStade !== null ? fmtEur(montantStade) : '—'}</td>
            <td style="padding:6px 10px;text-align:right">${paye ? fmtEur(paye) : '—'}</td>
            <td style="padding:6px 10px;text-align:right;${resteColor}">${reste !== null ? fmtEur(reste) : '—'}</td>
            <td style="padding:6px 10px;font-size:12px;color:var(--text-muted)">${escHtml(modaliteStr)}</td>
            <td style="padding:6px 10px;font-size:12px;color:var(--text-muted)">${escHtml(e.date_prevue||'—')}</td>
            <td style="padding:6px 10px;text-align:center">${bonCell}</td>
          </tr>`;
        }).join('');
        const totalPct   = echs.reduce((s,e) => s + (parseFloat(e.pourcentage)||0), 0);
        const totalPaye  = echs.reduce((s,e) => s + (parseFloat(String(e.montant_paye||'').replace(',','.'))||0), 0);
        const totalStade = echs.reduce((s,e) => s + (e._base !== null ? e._base * (parseFloat(e.pourcentage)||0) / 100 : 0), 0);
        const totalReste = totalStade - totalPaye;
        return `
        <div style="margin-top:16px;border:1px solid var(--border);border-radius:8px;overflow:hidden">
          <div style="background:var(--surface);padding:8px 12px;font-size:12px;font-weight:600;color:var(--text-muted);letter-spacing:.3px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px">
            Échéances de facturation${hasLots ? ' (par lot)' : ''}
          </div>
          <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead>
              <tr style="background:var(--gray-bg);font-size:11px;color:var(--text-muted)">
                ${hasLots ? '<th style="padding:5px 10px;text-align:left;font-weight:600">Lot</th>' : ''}
                <th style="padding:5px 10px;text-align:left;font-weight:600">Stade</th>
                <th style="padding:5px 10px;text-align:center;font-weight:600">%</th>
                <th style="padding:5px 10px;text-align:right;font-weight:600">Montant ${colLabel}</th>
                <th style="padding:5px 10px;text-align:right;font-weight:600">Payé</th>
                <th style="padding:5px 10px;text-align:right;font-weight:600">Reste ${colLabel}</th>
                <th style="padding:5px 10px;text-align:left;font-weight:600">Modalité</th>
                <th style="padding:5px 10px;text-align:left;font-weight:600">Date prévue</th>
                <th style="padding:5px 10px;text-align:center;font-weight:600">Bon</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
            <tfoot>
              <tr style="background:var(--gray-bg);font-size:12px;font-weight:600;border-top:2px solid var(--border)">
                <td style="padding:6px 10px" colspan="${hasLots ? 2 : 1}">Total</td>
                <td style="padding:6px 10px;text-align:center">${hasLots ? '—' : totalPct.toFixed(0) + ' %'}</td>
                <td style="padding:6px 10px;text-align:right">${fmtEur(totalStade)}</td>
                <td style="padding:6px 10px;text-align:right">${fmtEur(totalPaye)}</td>
                <td style="padding:6px 10px;text-align:right;${totalReste <= 0 ? 'color:#059669' : 'color:#dc2626'}">${fmtEur(totalReste)}</td>
                <td></td>
                <td></td>
                <td></td>
              </tr>
            </tfoot>
          </table>
        </div>`;
      })()}
      ${items.length ? `
      <div style="margin-top:14px">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:6px">
          <span>Avancement global — ${doneCount}/${items.length} chapitres terminés</span>
          <span style="font-weight:600">${pct}%</span>
        </div>
        <div class="progress-bar" style="height:8px"><div class="progress-bar-fill ${pct===100?'full':''}" style="width:${pct}%"></div></div>
      </div>` : ''}
      ${a.conditions_reglement ? `
      <div style="margin-top:14px;border:1px solid var(--border);border-radius:8px;overflow:hidden">
        <div style="background:var(--surface);padding:8px 12px;font-size:12px;font-weight:600;color:var(--text-muted);letter-spacing:.3px;border-bottom:1px solid var(--border)">Conditions de règlement</div>
        <div style="padding:10px 12px;font-size:13px;white-space:pre-wrap;line-height:1.5">${escHtml(a.conditions_reglement)}</div>
      </div>` : ''}
      ${a.garanties ? `
      <div style="margin-top:10px;border:1px solid var(--border);border-radius:8px;overflow:hidden">
        <div style="background:var(--surface);padding:8px 12px;font-size:12px;font-weight:600;color:var(--text-muted);letter-spacing:.3px;border-bottom:1px solid var(--border)">Garanties</div>
        <div style="padding:10px 12px;font-size:13px;white-space:pre-wrap;line-height:1.5">${escHtml(a.garanties)}</div>
      </div>` : ''}
    </div>
  </div>

  <!-- Tabs -->
  <div class="detail-grid">
    <div id="left-col">
      <div class="tabs no-print">
        <div class="tab ${state.activeTab==='chapitres'?'active':''}" data-tab="chapitres" onclick="switchTab('chapitres')">Chapitres <span style="font-size:11px;background:var(--gray-bg);padding:1px 7px;border-radius:10px;margin-left:4px">${items.length}</span></div>
        <div class="tab ${state.activeTab==='moteurs'?'active':''}" data-tab="moteurs" onclick="switchTab('moteurs')">Moteurs liés <span style="font-size:11px;background:var(--gray-bg);padding:1px 7px;border-radius:10px;margin-left:4px">${state.currentMoteurs.length}</span></div>
        <div class="tab ${state.activeTab==='interventions'?'active':''}" data-tab="interventions" onclick="switchTab('interventions')">Interventions <span style="font-size:11px;background:var(--gray-bg);padding:1px 7px;border-radius:10px;margin-left:4px">${state.currentIntervs.length}</span></div>
        <div class="tab ${state.activeTab==='documents'?'active':''}" data-tab="documents" onclick="switchTab('documents')">Documents</div>
        <div class="tab ${state.activeTab==='facturation'?'active':''}" data-tab="facturation" onclick="switchTab('facturation')">Facturation</div>
        <div class="tab ${state.activeTab==='bilan'?'active':''}" data-tab="bilan" onclick="switchTab('bilan')">Bilan</div>
        <div class="tab ${state.activeTab==='whiteboard'?'active':''}" data-tab="whiteboard" onclick="switchTab('whiteboard')">Tableau blanc</div>
      </div>
      <div id="tab-content"></div>
    </div>
    <div id="right-col">
      <div class="panel" style="margin-bottom:12px">
        <div class="panel-header"><span class="panel-title">Commentaires</span></div>
        <div class="panel-body">
          <textarea id="comments-box" rows="5" class="form-control" placeholder="Notes et commentaires…" style="font-size:13px">${escHtml(a.commentaires||'')}</textarea>
          <button class="btn btn-primary btn-sm no-print" style="margin-top:8px" onclick="saveComments()">Enregistrer</button>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header"><span class="panel-title">Récapitulatif</span></div>
        <div class="panel-body">
          ${renderRecap(items)}
        </div>
      </div>
    </div>
  </div>`;

  switchTab(state.activeTab);
}

function renderRecap(items) {
  if (!items.length) return '<p style="color:var(--text-muted);font-size:13px">Aucun chapitre.</p>';
  const byStatus = {};
  items.forEach(i => { byStatus[i.statut] = (byStatus[i.statut]||0)+1; });
  return Object.entries(byStatus).map(([s,c]) =>
    `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      ${statusBadge(s)}
      <span style="font-weight:600">${c}</span>
    </div>`
  ).join('') + `<div class="divider"></div>
  <div style="display:flex;justify-content:space-between;font-size:13px">
    <span style="color:var(--text-muted)">Total chapitres</span>
    <strong>${items.length}</strong>
  </div>`;
}

async function quickStatus(val) {
  try {
    await PUT(`/affaires/${state.currentAffaire.id}`, { statut: val });
    state.currentAffaire.statut = val;
    // Update in list
    const idx = state.affaires.findIndex(a => a.id === state.currentAffaire.id);
    if (idx >= 0) state.affaires[idx].statut = val;
    toast('Statut mis à jour', 'success');
  } catch(e) { toast(e.message,'error'); }
}

/* ═══════════════════════════════════════════════
   TABS
═══════════════════════════════════════════════ */
function switchTab(tab) {
  state.activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', (t.dataset.tab || t.textContent.toLowerCase()) === tab
      || (!t.dataset.tab && t.textContent.toLowerCase().includes(tab)));
  });
  const el = document.getElementById('tab-content');
  if (!el) return;
  if (tab === 'chapitres') el.innerHTML = renderChapters();
  else if (tab === 'moteurs') el.innerHTML = renderMoteursTab();
  else if (tab === 'interventions') el.innerHTML = renderIntervTab();
  else if (tab === 'documents') renderDocumentsTab();
  else if (tab === 'facturation') el.innerHTML = renderFacturationDashboard();
  else if (tab === 'bilan') el.innerHTML = renderBilanTab();
  else if (tab === 'whiteboard') renderWhiteboardTab();
}

/* ═══════════════════════════════════════════════
   CHAPTERS
═══════════════════════════════════════════════ */
function renderChapters() {
  const items = state.currentItems;
  return `
    <div class="no-print" style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px">
      <button class="btn btn-secondary btn-sm" onclick="openTemplateManager()" title="Gérer les modèles de types">⚙️ Modèles</button>
      <button class="btn btn-primary btn-sm" onclick="openAddChapter()">+ Ajouter un chapitre</button>
    </div>
    <div class="chapters-list" id="chapters-list">
      ${items.length ? items.map((it,i) => chapterCard(it,i)).join('') :
        '<div class="empty-state"><h3>Aucun chapitre</h3><p>Ajoutez des chapitres pour structurer cette affaire.</p></div>'}
    </div>`;
}

/* ═══════════════════════════════════════════════
   TABLEAU DE BORD FACTURATION
═══════════════════════════════════════════════ */
function renderFacturationDashboard() {
  const a = state.currentAffaire;
  if (!a) return '<div class="empty-state"><h3>Aucune affaire</h3></div>';

  const ht  = parseHT(a.prix_ht);
  const exo = a.exonere_tva == 1;
  const tva = (ht && !exo) ? ht * 0.20 : 0;
  const ttc = ht ? (exo ? ht : ht * 1.20) : null;
  const label = exo ? 'HT' : 'TTC';

  const echeances = getEffectiveEcheances(a);
  const hasEch  = echeances.length > 0;
  const hasLots = hasLotsVendus(a);

  const totalPaye     = echeances.reduce((s,e) => s + (parseFloat(e.montant_paye)||0), 0);
  const totalPct      = echeances.reduce((s,e) => s + (parseFloat(e.pourcentage)||0), 0);
  const totalPlanifie = echeances.reduce((s,e) => s + (e._base !== null ? e._base * (parseFloat(e.pourcentage)||0) / 100 : 0), 0); // montant couvert par l'échéancier
  const totalReste    = ttc !== null ? ttc - totalPaye : null;       // reste réel = TTC − encaissé
  const avancement    = (ttc && ttc > 0) ? Math.min(100, totalPaye / ttc * 100) : 0;
  const soldee        = totalReste !== null && totalReste <= 0.005;

  // ── Donut chart SVG (2 couches : fond = reste, arc = payé) ──
  const R = 58;
  const circ = 2 * Math.PI * R;
  const frac = (ttc && ttc > 0) ? Math.min(1, totalPaye / ttc) : 0;
  const dashPaye = frac * circ;
  const bgColor  = soldee ? '#d1fae5' : (totalPaye > 0 ? '#fca5a5' : '#e2e8f0');
  const fgColor  = soldee ? '#059669' : '#2563eb';
  const donutSvg = `
    <svg width="160" height="160" viewBox="0 0 160 160" style="display:block;margin:0 auto">
      <circle cx="80" cy="80" r="${R}" fill="none" stroke="${bgColor}" stroke-width="18"/>
      ${dashPaye > 0 ? `<circle cx="80" cy="80" r="${R}" fill="none"
        stroke="${fgColor}" stroke-width="18"
        stroke-dasharray="${dashPaye.toFixed(2)} ${(circ - dashPaye).toFixed(2)}"
        stroke-dashoffset="${(circ * 0.25).toFixed(2)}"
        stroke-linecap="round"/>` : ''}
      <text x="80" y="76" text-anchor="middle" font-size="20" font-weight="700" fill="${soldee?'#059669':'#1e3a5f'}">${avancement.toFixed(0)}%</text>
      <text x="80" y="93" text-anchor="middle" font-size="11" fill="#6b7280">encaissé</text>
    </svg>`;

  // ── KPI cards ──
  const kpiCards = [
    { label: 'Prix HT',  value: ht ? fmtEur(ht) : '—',  color: '#1e3a5f', bg: '#eff6ff' },
    { label: `TVA (20%)${exo?' — exonéré':''}`, value: exo ? 'Exonéré' : (ht ? fmtEur(tva) : '—'), color: '#0891b2', bg: '#cffafe' },
    { label: `Total ${label}`, value: ttc ? fmtEur(ttc) : '—', color: '#2563eb', bg: '#dbeafe' },
    { label: 'Encaissé', value: fmtEur(totalPaye), color: '#059669', bg: '#d1fae5' },
    { label: `Reste à payer`, value: totalReste !== null ? fmtEur(Math.max(0, totalReste)) : '—', color: soldee ? '#059669' : '#dc2626', bg: soldee ? '#d1fae5' : '#fee2e2' },
  ].map(k => `
    <div style="background:${k.bg};border:1px solid ${k.color}22;border-radius:10px;padding:14px 16px;flex:1;min-width:120px">
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px">${k.label}</div>
      <div style="font-size:17px;font-weight:700;color:${k.color}">${k.value}</div>
    </div>`).join('');

  // ── Barre globale ──
  const barreGlobale = `
    <div style="margin:0 0 6px;display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted)">
      <span>Encaissement global</span>
      <span style="font-weight:600;color:${soldee?'#059669':'#dc2626'}">${avancement.toFixed(1)} %</span>
    </div>
    <div style="background:#e2e8f0;border-radius:20px;height:14px;overflow:hidden">
      <div style="background:${soldee?'#059669':'linear-gradient(90deg,#2563eb,#059669)'};height:100%;width:${avancement.toFixed(1)}%;border-radius:20px;transition:width .6s"></div>
    </div>`;

  // ── Tableau des échéances ──
  const echRows = echeances.map((e) => {
    const montEch   = e._base !== null ? e._base * (parseFloat(e.pourcentage)||0) / 100 : null;
    const paye      = parseFloat(e.montant_paye) || 0;
    const reste     = montEch !== null ? montEch - paye : null;
    const pct_enc   = (montEch && montEch > 0) ? Math.min(100, paye / montEch * 100) : 0;
    const statut    = reste === null ? null : reste <= 0.005 ? 'soldé' : paye > 0 ? 'partiel' : 'attente';
    const statuBadge = statut === 'soldé'
      ? '<span style="background:#d1fae5;color:#059669;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600">✔ Soldé</span>'
      : statut === 'partiel'
      ? '<span style="background:#fef3c7;color:#d97706;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600">◐ Partiel</span>'
      : statut === 'attente'
      ? '<span style="background:#fee2e2;color:#dc2626;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600">⏳ En attente</span>'
      : '<span style="color:var(--text-muted);font-size:11px">—</span>';
    const modaliteStr = e.modalite === 'comptant' ? 'Comptant'
      : e.modalite === 'jours' ? `${e.jours||'?'} jours`
      : e.modalite === 'jours_fm' ? `${e.jours||'?'} j. fin mois`
      : '—';
    const barW = pct_enc.toFixed(1);
    const bonGenere = !!e.bon_genere;
    const rowBg = statut === 'soldé' ? 'background:#d1fae5;' : bonGenere ? 'background:#fef9c3;' : '';
    const bonArgs = `'${a.id}',${e._idx}${e._lotId ? `,'${e._lotId}'` : ''}`;
    const btnId = `bon-dash-${a.id}-${e._lotId || 'g'}-${e._idx}`;
    const bonCell = bonGenere
      ? `<button id="${btnId}" onclick="generateBonFacturation(${bonArgs})" title="Cliquer pour re-télécharger le bon" style="background:#fef3c7;color:#d97706;border:none;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:600;white-space:nowrap;cursor:pointer">${escHtml(e.bon_genere)}</button>`
      : `<button id="${btnId}" onclick="generateBonFacturation(${bonArgs})" style="background:#2563eb;color:#fff;border:none;border-radius:5px;padding:4px 10px;font-size:11px;cursor:pointer;white-space:nowrap">Bon</button>`;
    return `
      <tr style="${rowBg}border-bottom:1px solid var(--border)">
        ${hasLots ? `<td style="padding:10px 8px;font-size:12px;color:var(--text-muted)">${escHtml(e._lotLibelle||'—')}</td>` : ''}
        <td style="padding:10px 8px;font-weight:500">${escHtml(e.stade||'—')}</td>
        <td style="padding:10px 8px;text-align:center;color:var(--text-muted)">${(parseFloat(e.pourcentage)||0).toFixed(1)} %</td>
        <td style="padding:10px 8px;text-align:right;font-weight:500">${montEch !== null ? fmtEur(montEch) : '—'}</td>
        <td style="padding:10px 8px;text-align:right;color:#059669;font-weight:600">${fmtEur(paye)}</td>
        <td style="padding:10px 8px;text-align:right;font-weight:600;color:${reste===null?'var(--text-muted)':reste<=0?'#059669':'#dc2626'}">${reste !== null ? fmtEur(Math.max(0,reste)) : '—'}</td>
        <td style="padding:10px 8px">
          <div style="background:#e2e8f0;border-radius:10px;height:8px;overflow:hidden;min-width:80px">
            <div style="background:${pct_enc>=100?'#059669':'#2563eb'};height:100%;width:${barW}%;border-radius:10px"></div>
          </div>
        </td>
        <td style="padding:10px 8px">${statuBadge}</td>
        <td style="padding:10px 8px;font-size:12px;color:var(--text-muted)">${modaliteStr}</td>
        <td style="padding:10px 8px;font-size:12px;color:var(--text-muted)">${escHtml(e.date_prevue||'—')}</td>
        <td style="padding:10px 8px;text-align:center">${bonCell}</td>
      </tr>`;
  }).join('');

  const echTable = hasEch ? `
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead>
          <tr style="background:var(--gray-bg);border-bottom:2px solid var(--border)">
            ${hasLots ? '<th style="padding:8px;text-align:left;font-weight:600;color:var(--text-muted)">Lot</th>' : ''}
            <th style="padding:8px;text-align:left;font-weight:600;color:var(--text-muted)">Stade</th>
            <th style="padding:8px;text-align:center;font-weight:600;color:var(--text-muted)">%</th>
            <th style="padding:8px;text-align:right;font-weight:600;color:var(--text-muted)">Montant ${label}</th>
            <th style="padding:8px;text-align:right;font-weight:600;color:var(--text-muted)">Encaissé</th>
            <th style="padding:8px;text-align:right;font-weight:600;color:var(--text-muted)">Reste</th>
            <th style="padding:8px;font-weight:600;color:var(--text-muted)">Progression</th>
            <th style="padding:8px;font-weight:600;color:var(--text-muted)">Statut</th>
            <th style="padding:8px;font-weight:600;color:var(--text-muted)">Modalité</th>
            <th style="padding:8px;font-weight:600;color:var(--text-muted)">Date prévue</th>
            <th style="padding:8px;text-align:center;font-weight:600;color:var(--text-muted)">Bon</th>
          </tr>
        </thead>
        <tbody>${echRows}</tbody>
        <tfoot>
          <tr style="background:var(--gray-bg);font-weight:700;border-top:2px solid var(--border)">
            <td style="padding:10px 8px" colspan="${hasLots ? 2 : 1}">Total</td>
            <td style="padding:10px 8px;text-align:center${!hasLots && totalPct > 100 ? ';color:#dc2626' : ''}">
              ${hasLots ? '—' : `${totalPct.toFixed(1)} %${totalPct>100?' ⚠️':''}`}
              ${!hasLots && totalPct < 99.5 && ttc ? `<div style="font-size:10px;color:#d97706;font-weight:400">⚠ Échéancier partiel</div>` : ''}
            </td>
            <td style="padding:10px 8px;text-align:right">
              ${fmtEur(totalPlanifie)}
              ${ttc !== null && Math.abs(totalPlanifie - ttc) > 0.01 ? `<div style="font-size:10px;color:var(--text-muted);font-weight:400">Prix ${label} : ${fmtEur(ttc)}</div>` : ''}
            </td>
            <td style="padding:10px 8px;text-align:right;color:#059669">${fmtEur(totalPaye)}</td>
            <td style="padding:10px 8px;text-align:right;color:${soldee?'#059669':'#dc2626'};font-size:14px">${totalReste !== null ? fmtEur(Math.max(0,totalReste)) : '—'}</td>
            <td colspan="4" style="padding:10px 8px;font-size:12px;color:var(--text-muted)">${soldee ? 'Entièrement soldé' : `${avancement.toFixed(1)} % encaissé sur prix ${label}`}</td>
          </tr>
        </tfoot>
      </table>
    </div>` : `<div class="empty-state" style="padding:32px 0"><h3>Aucune échéance définie</h3><p>Ajoutez des échéances depuis le formulaire de modification de l'affaire.</p></div>`;

  // ── Infos complémentaires ──
  const infoCompl = [
    a.etablissement_financier ? `<div style="display:flex;gap:8px;align-items:center"><span style="font-size:13px;color:var(--text-muted)">Établissement financier :</span><strong style="font-size:13px">${escHtml(a.etablissement_financier)}</strong></div>` : '',
    a.date_achat ? `<div style="display:flex;gap:8px;align-items:center"><span style="font-size:13px;color:var(--text-muted)">Date d'achat :</span><strong style="font-size:13px">${escHtml(a.date_achat)}</strong></div>` : '',
    a.fournisseur ? `<div style="display:flex;gap:8px;align-items:center"><span style="font-size:13px;color:var(--text-muted)">Fournisseur :</span><strong style="font-size:13px">${escHtml(a.fournisseur)}</strong></div>` : '',
    a.reference_fournisseur ? `<div style="display:flex;gap:8px;align-items:center"><span style="font-size:13px;color:var(--text-muted)">Référence fournisseur :</span><strong style="font-size:13px">${escHtml(a.reference_fournisseur)}</strong></div>` : '',
    exo ? `<div style="display:flex;gap:8px;align-items:center"><span style="background:#fef3c7;color:#d97706;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600">⚠️ TVA exonérée — justificatif requis</span></div>` : '',
  ].filter(Boolean).join('');

  return `
    <div style="padding:16px 0;display:flex;flex-direction:column;gap:20px">

      <!-- KPI Cards -->
      <div style="display:flex;flex-wrap:wrap;gap:10px">${kpiCards}</div>

      <!-- Graphique + barre globale -->
      <div class="grid-donut" style="align-items:center">
        <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center">
          ${donutSvg}
          <div style="font-size:12px;color:var(--text-muted);margin-top:6px">
            <span style="display:inline-flex;align-items:center;gap:4px;margin-right:8px"><span style="width:10px;height:10px;background:${fgColor};border-radius:50%;display:inline-block"></span>Encaissé</span>
            <span style="display:inline-flex;align-items:center;gap:4px"><span style="width:10px;height:10px;background:${bgColor};border-radius:50%;display:inline-block"></span>Reste</span>
          </div>
        </div>
        <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px">
          <div>${barreGlobale}</div>
          ${hasEch ? echeances.map((e,i) => {
            const montEch = e._base !== null ? e._base * (parseFloat(e.pourcentage)||0) / 100 : null;
            const paye    = parseFloat(e.montant_paye)||0;
            const pct     = (montEch && montEch > 0) ? Math.min(100, paye/montEch*100) : 0;
            const stageLabel = (e._lotLibelle ? `${e._lotLibelle} — ` : '') + (e.stade || 'Étape '+(i+1));
            return `<div>
              <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
                <span style="color:var(--text-muted)">${escHtml(stageLabel)}</span>
                <span style="font-weight:600">${pct.toFixed(0)} %</span>
              </div>
              <div style="background:#e2e8f0;border-radius:10px;height:8px;overflow:hidden">
                <div style="background:${pct>=100?'#059669':'#2563eb'};height:100%;width:${pct.toFixed(1)}%;border-radius:10px"></div>
              </div>
            </div>`;
          }).join('') : ''}
          ${infoCompl ? `<div style="border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:6px">${infoCompl}</div>` : ''}
        </div>
      </div>

      <!-- Tableau des échéances -->
      <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden">
        <div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
          <span style="font-weight:600;font-size:14px">Échéances de facturation${hasLots ? ' (par lot)' : ''}</span>
          <button class="btn btn-secondary btn-sm" onclick="openAffaireModal(state.currentAffaire)">✏️ Modifier</button>
        </div>
        ${echTable}
      </div>

    </div>`;
}

/* ═══════════════════════════════════════════════
   BILAN (coûts prévus au devis vs coûts réels)
═══════════════════════════════════════════════ */
const COUT_CHAPITRES = [
  "ACHAT DE MATÉRIELS SÉRIALISÉS",
  "FRAIS TRANSPORT/DOUANE",
  "ACHAT DE PIÈCES & COMPOSANTS PAR MOTEUR",
  "TEMPS & MAIN D'ŒUVRE",
  "TAXES SUR VENTE",
];
const COUT_STADES = [
  { v: 'P1', label: 'P1 — Prévisionnel', color: '#2563eb', bg: '#dbeafe' },
  { v: 'P2', label: 'P2 — Coût réel',    color: '#0891b2', bg: '#cffafe' },
];
function coutStadeInfo(v) { return COUT_STADES.find(s => s.v === v) || COUT_STADES[0]; }
let editingCoutId = null;

function renderBilanTab() {
  const a = state.currentAffaire;
  const couts = state.currentCouts || [];
  const ht = parseHT(a.prix_ht) || 0;

  const totalPrevu = couts.reduce((s,c) => s + (parseFloat(c.cout_prevu)||0), 0);
  const totalReel  = couts.reduce((s,c) => s + (parseFloat(c.cout_reel)||0), 0);
  const nbChiffre  = couts.filter(c => (parseFloat(c.cout_reel)||0) !== 0).length;
  const hasReel    = nbChiffre > 0;
  const complet    = couts.length > 0 && nbChiffre === couts.length;
  const partielNote = (hasReel && !complet) ? `${nbChiffre}/${couts.length} poste${couts.length>1?'s':''} chiffré${nbChiffre>1?'s':''}` : '';

  const margePrevue = ht - totalPrevu;
  const margeReelle = ht - totalReel;
  const pctPrevu = ht > 0 ? margePrevue / ht * 100 : null;
  const pctReel  = ht > 0 ? margeReelle / ht * 100 : null;
  const ecart    = totalReel - totalPrevu;

  const kpiCards = [
    { label: 'Prix de vente (devis)', value: ht ? fmtEur(ht) : '—', color:'#1e3a5f', bg:'#eff6ff' },
    { label: 'Coûts prévus (devis)',  value: fmtEur(totalPrevu), color:'#2563eb', bg:'#dbeafe' },
    { label: complet ? 'Coûts réels' : 'Coûts réels (partiel)',
      value: hasReel ? fmtEur(totalReel) : '—', color:'#0891b2', bg:'#cffafe', sub: partielNote },
    { label: 'Marge prévue',
      value: ht ? fmtEur(margePrevue) + (pctPrevu!==null?` (${pctPrevu.toFixed(1)}%)`:'') : '—',
      color: !ht ? '#6b7280' : margePrevue>=0?'#059669':'#dc2626',
      bg: !ht ? 'var(--gray-bg)' : margePrevue>=0?'#d1fae5':'#fee2e2' },
    { label: complet ? 'Marge réelle' : 'Marge réelle (partielle)',
      value: (ht && hasReel) ? fmtEur(margeReelle) + (pctReel!==null?` (${pctReel.toFixed(1)}%)`:'') : '—',
      color: (!ht || !hasReel) ? '#6b7280' : margeReelle>=0?'#059669':'#dc2626',
      bg: (!ht || !hasReel) ? 'var(--gray-bg)' : margeReelle>=0?'#d1fae5':'#fee2e2', sub: partielNote },
  ].map(k => `
    <div style="background:${k.bg};border:1px solid ${k.color}22;border-radius:10px;padding:14px 16px;flex:1;min-width:150px">
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px">${k.label}</div>
      <div style="font-size:17px;font-weight:700;color:${k.color}">${k.value}</div>
      ${k.sub ? `<div style="font-size:10px;color:#d97706;font-weight:600;margin-top:2px">⚠ ${k.sub} — total indicatif</div>` : ''}
    </div>`).join('');

  const NON_AFFECTE = 'Non affecté';
  const chapOf = c => COUT_CHAPITRES.includes(c.categorie) ? c.categorie : NON_AFFECTE;
  const chapitresPresents = COUT_CHAPITRES.concat(
    couts.some(c => !COUT_CHAPITRES.includes(c.categorie)) ? [NON_AFFECTE] : []
  );

  const libelleCellHtml = c => {
    const isBc = !!c.bon_commande_id;
    return `${escHtml(c.libelle||'—')}${isBc ? ' <span style="font-size:11px;color:var(--text-muted)">(lié à un BC)</span>' : ''}${c.commentaire ? `<div style="font-size:11px;color:var(--text-muted);font-weight:400;margin-top:2px">${escHtml(c.commentaire)}</div>` : ''}`;
  };
  const posteActionsHtml = c => {
    const isBc = !!c.bon_commande_id;
    const editDel = isBc
      ? `<button class="btn-icon" onclick="viewLinkedBc('${c.bon_commande_id}')" title="Voir le bon de commande" style="font-size:11px;font-weight:600">BC</button>`
      : `<button class="btn-icon" onclick="openCoutModal('${c.id}')" title="Modifier">✏️</button>
         <button class="btn-icon red" onclick="deleteCout('${c.id}')" title="Supprimer">🗑</button>`;
    const associer = (c.stade||'P1')==='P2' ? `<button class="btn-icon" onclick="openLinkPosteModal('${c.id}')" title="Associer à un prévisionnel" style="font-size:11px">Associer</button>` : '';
    return editDel + associer;
  };

  // Poste isolé (P1 sans P2 associé, ou P2 sans P1 associé) : sur sa propre ligne.
  const posteRowHtml = c => {
    const stade = coutStadeInfo(c.stade||'P1');
    const montant = stade.v === 'P2' ? (parseFloat(c.cout_reel)||0) : (parseFloat(c.cout_prevu)||0);
    return `
      <tr style="border-bottom:1px solid var(--border)">
        <td style="padding:8px 8px 8px 24px;font-weight:500">${stade.v==='P1' ? libelleCellHtml(c) : ''}</td>
        <td style="padding:8px 8px;text-align:right">${stade.v==='P1' ? fmtEur(montant) : '—'}</td>
        <td style="padding:8px 8px 8px 24px;font-weight:500">${stade.v==='P2' ? libelleCellHtml(c) : ''}</td>
        <td style="padding:8px 8px;text-align:right">${stade.v==='P2' ? fmtEur(montant) : '—'}</td>
        <td style="padding:8px 8px;text-align:right;color:var(--text-muted)">—</td>
        <td style="padding:8px 8px;text-align:center;white-space:nowrap" class="no-print">${posteActionsHtml(c)}</td>
      </tr>`;
  };

  // Paire P1 ↔ P2 associée : les deux libellés/montants sur la même ligne, avec écart calculé.
  const pairedRowHtml = (p1c, p2c) => {
    const m1 = parseFloat(p1c.cout_prevu)||0;
    const m2 = parseFloat(p2c.cout_reel)||0;
    const ec = m2 - m1;
    return `
      <tr style="border-bottom:1px solid var(--border);background:#f0fdf4">
        <td style="padding:8px 8px 8px 24px;font-weight:500">${libelleCellHtml(p1c)}</td>
        <td style="padding:8px 8px;text-align:right">${fmtEur(m1)}</td>
        <td style="padding:8px 8px 8px 24px;font-weight:500">${libelleCellHtml(p2c)}</td>
        <td style="padding:8px 8px;text-align:right">${fmtEur(m2)}</td>
        <td style="padding:8px 8px;text-align:right;color:${ec<=0?'#059669':'#dc2626'}">${(ec>0?'+':'')+fmtEur(ec)}</td>
        <td style="padding:8px 8px;text-align:center;white-space:nowrap" class="no-print">${posteActionsHtml(p1c)}${posteActionsHtml(p2c)}<button class="btn-icon" onclick="unlinkPoste('${p2c.id}')" title="Dissocier">✕</button></td>
      </tr>`;
  };

  const groups = chapitresPresents.map(chap => {
    const inChap = couts.filter(c => chapOf(c) === chap);
    const p1List = inChap.filter(c => (c.stade||'P1')==='P1');
    const p2List = inChap.filter(c => (c.stade||'P1')==='P2');
    const p1 = p1List.reduce((s,c)=>s+(parseFloat(c.cout_prevu)||0),0);
    const p2 = p2List.reduce((s,c)=>s+(parseFloat(c.cout_reel)||0),0);
    const hasP2 = p2List.length > 0;
    const ec = p2 - p1;

    const pairedP2Ids = new Set();
    const rowsHtml = [];
    p1List.forEach(p1c => {
      const p2c = p2List.find(x => x.poste_lie_id === p1c.id);
      if (p2c) { pairedP2Ids.add(p2c.id); rowsHtml.push(pairedRowHtml(p1c, p2c)); }
      else rowsHtml.push(posteRowHtml(p1c));
    });
    p2List.filter(p2c => !pairedP2Ids.has(p2c.id)).forEach(p2c => rowsHtml.push(posteRowHtml(p2c)));

    const isNonAffecte = chap === NON_AFFECTE;
    const posteRows = rowsHtml.length
      ? rowsHtml.join('')
      : `<tr><td colspan="5" style="padding:6px 8px 6px 24px;font-size:12px;color:var(--text-muted);font-style:italic">Aucun poste</td><td class="no-print"></td></tr>`;
    return `
      <tr style="background:${isNonAffecte?'#fffbeb':'var(--gray-bg)'}">
        <td colspan="5" style="padding:8px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:${isNonAffecte?'#b45309':'inherit'}">${escHtml(chap)}${isNonAffecte ? ' <span style="font-weight:400;text-transform:none;font-size:11px">— achats à affecter à un poste</span>' : ''}</td>
        <td class="no-print"></td>
      </tr>
      ${posteRows}
      <tr style="border-bottom:2px solid var(--border);font-weight:700;font-size:12px">
        <td style="padding:6px 8px 6px 24px;color:var(--text-muted);font-weight:600">Sous-total ${escHtml(chap)}</td>
        <td style="padding:6px 8px;text-align:right">${fmtEur(p1)}</td>
        <td></td>
        <td style="padding:6px 8px;text-align:right">${hasP2 ? fmtEur(p2) : '—'}</td>
        <td style="padding:6px 8px;text-align:right;color:${!hasP2?'var(--text-muted)':ec<=0?'#059669':'#dc2626'}">${hasP2 ? (ec>0?'+':'')+fmtEur(ec) : '—'}</td>
        <td class="no-print"></td>
      </tr>`;
  }).join('');

  const table = `
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead>
          <tr style="background:var(--gray-bg);border-bottom:2px solid var(--border)">
            <th style="padding:8px;text-align:left;font-weight:600;color:var(--text-muted)">Libellé P1</th>
            <th style="padding:8px;text-align:right;font-weight:600;color:var(--text-muted)">P1 (prévisionnel)</th>
            <th style="padding:8px;text-align:left;font-weight:600;color:var(--text-muted)">Libellé P2</th>
            <th style="padding:8px;text-align:right;font-weight:600;color:var(--text-muted)">P2 (réel)</th>
            <th style="padding:8px;text-align:right;font-weight:600;color:var(--text-muted)">Écart</th>
            <th style="padding:8px;text-align:center;font-weight:600;color:var(--text-muted)" class="no-print">Actions</th>
          </tr>
        </thead>
        <tbody>${groups}</tbody>
        <tfoot>
          <tr style="background:var(--gray-bg);font-weight:700;border-top:2px solid var(--border)">
            <td style="padding:10px 8px">Total général</td>
            <td style="padding:10px 8px;text-align:right">${fmtEur(totalPrevu)}</td>
            <td></td>
            <td style="padding:10px 8px;text-align:right">${hasReel ? fmtEur(totalReel) : '—'}</td>
            <td style="padding:10px 8px;text-align:right;color:${!hasReel?'var(--text-muted)':ecart<=0?'#059669':'#dc2626'}">${hasReel ? (ecart>0?'+':'')+fmtEur(ecart) : '—'}</td>
            <td class="no-print"></td>
          </tr>
          <tr style="font-weight:700;border-top:1px solid var(--border)">
            <td style="padding:8px">Marge (vs prix de vente HT)</td>
            <td style="padding:8px;text-align:right;color:${!ht?'var(--text-muted)':margePrevue>=0?'#059669':'#dc2626'}">${ht ? fmtEur(margePrevue) + (pctPrevu!==null?` (${pctPrevu.toFixed(1)}%)`:'') : '—'}</td>
            <td></td>
            <td style="padding:8px;text-align:right;color:${(!ht||!hasReel)?'var(--text-muted)':margeReelle>=0?'#059669':'#dc2626'}">${(ht && hasReel) ? fmtEur(margeReelle) + (pctReel!==null?` (${pctReel.toFixed(1)}%)`:'') : '—'}</td>
            <td></td>
            <td class="no-print"></td>
          </tr>
        </tfoot>
      </table>
    </div>`;

  return `
    <div style="padding:16px 0;display:flex;flex-direction:column;gap:20px">
      <div style="display:flex;flex-wrap:wrap;gap:10px">${kpiCards}</div>
      <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden">
        <div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
          <span style="font-weight:600;font-size:14px">Postes de coûts par chapitre — P1 (prévisionnel) / P2 (réel)</span>
          <button class="btn btn-primary btn-sm no-print" onclick="openCoutModal(null)">+ Ajouter un poste</button>
        </div>
        ${table}
      </div>
    </div>`;
}

async function viewLinkedBc(bcId) {
  if (!state.bonsCommande) state.bonsCommande = [];
  if (!state.bonsCommande.find(b => b.id === bcId)) {
    try {
      const bc = await GET(`/bons-commande/${bcId}`);
      state.bonsCommande.push(bc);
    } catch(e) { toast(e.message, 'error'); return; }
  }
  openBcModal(bcId);
}

function openCoutModal(id) {
  const existing = id ? (state.currentCouts.find(x => x.id === id) || {}) : {};
  if (existing.bon_commande_id) {
    toast('Ce poste est lié à un bon de commande — modifiez-le depuis le bon de commande.', 'warning');
    return;
  }
  editingCoutId = id;
  const c = existing;
  const stade = c.stade || 'P1';
  const montant = stade === 'P2' ? (c.cout_reel||'') : (c.cout_prevu||'');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
  <div class="modal" style="max-width:480px">
    <div class="modal-header">
      <h2>${id ? '✏️ Modifier le poste' : '+ Nouveau poste de coût'}</h2>
      <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row single">
        <div>
          <label class="form-label">Chapitre de coût *</label>
          <select class="form-control" id="cout-chapitre">
            <option value="">— Choisir un chapitre —</option>
            ${COUT_CHAPITRES.map(cc=>`<option value="${escHtml(cc)}" ${c.categorie===cc?'selected':''}>${escHtml(cc)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-row">
        <div>
          <label class="form-label">Stade *</label>
          <select class="form-control" id="cout-stade" onchange="refreshPosteLieSelect()">
            ${COUT_STADES.map(s=>`<option value="${s.v}" ${stade===s.v?'selected':''}>${s.label}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="form-label">Montant €</label>
          <input class="form-control" id="cout-montant" type="number" min="0" step="0.01" value="${montant}">
        </div>
      </div>
      <div class="form-row single" id="cout-poste-lie-wrap" style="display:none">
        <div>
          <label class="form-label">Associer au prévisionnel (P1) <span style="font-weight:400;color:var(--text-muted)">— pour l'aligner sur la même ligne du bilan</span></label>
          <select class="form-control" id="cout-poste-lie"></select>
        </div>
      </div>
      <div class="form-row single">
        <div>
          <label class="form-label">Libellé *</label>
          <input class="form-control" id="cout-libelle" value="${escHtml(c.libelle||'')}" placeholder="Ex : Fourniture pompe hydraulique">
        </div>
      </div>
      <div class="form-row single">
        <div>
          <label class="form-label">Commentaire</label>
          <textarea class="form-control" id="cout-commentaire" rows="2" placeholder="Notes, justification de l'écart…">${escHtml(c.commentaire||'')}</textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" style="margin-right:auto" onclick="this.closest('.modal-overlay').remove()">Annuler</button>
      <button class="btn btn-primary" onclick="saveCout()">Enregistrer</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
  document.getElementById('cout-chapitre').onchange = () => refreshPosteLieSelect();
  refreshPosteLieSelect();
  document.getElementById('cout-libelle')?.focus();
}

function refreshPosteLieSelect() {
  const wrap = document.getElementById('cout-poste-lie-wrap');
  const stadeSel = document.getElementById('cout-stade');
  const chapSel = document.getElementById('cout-chapitre');
  if (!wrap || !stadeSel || !chapSel) return;
  if (stadeSel.value !== 'P2') { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  const chap = chapSel.value;
  const currentLink = (state.currentCouts.find(x => x.id === editingCoutId) || {}).poste_lie_id || '';
  const linkedIds = new Set(state.currentCouts.filter(c => c.poste_lie_id && c.id !== editingCoutId).map(c => c.poste_lie_id));
  const candidates = state.currentCouts.filter(c => (c.stade||'P1')==='P1' && c.categorie===chap && (!linkedIds.has(c.id) || c.id===currentLink));
  const sel = document.getElementById('cout-poste-lie');
  sel.innerHTML = '<option value="">— Aucun —</option>' +
    candidates.map(c=>`<option value="${c.id}" ${currentLink===c.id?'selected':''}>${escHtml(c.libelle)} (${fmtEur(c.cout_prevu)})</option>`).join('');
}

async function saveCout() {
  const chapitre = document.getElementById('cout-chapitre').value;
  if (!chapitre) { toast('Le chapitre est requis', 'warning'); return; }
  const libelle = document.getElementById('cout-libelle').value.trim();
  if (!libelle) { toast('Le libellé est requis', 'warning'); document.getElementById('cout-libelle')?.focus(); return; }
  const stade   = document.getElementById('cout-stade').value;
  const montant = parseFloat(document.getElementById('cout-montant').value) || 0;
  const posteLieEl = document.getElementById('cout-poste-lie');
  const body = {
    categorie:   chapitre,
    stade,
    libelle,
    cout_prevu:  stade === 'P1' ? montant : 0,
    cout_reel:   stade === 'P2' ? montant : 0,
    poste_lie_id: (stade === 'P2' && posteLieEl && posteLieEl.value) ? posteLieEl.value : null,
    commentaire: document.getElementById('cout-commentaire').value.trim(),
  };
  try {
    let saved;
    if (editingCoutId) {
      saved = await PUT(`/affaires/${state.currentAffaire.id}/couts/${editingCoutId}`, body);
      const idx = state.currentCouts.findIndex(x => x.id === editingCoutId);
      if (idx >= 0) state.currentCouts[idx] = saved;
    } else {
      body.ordre = state.currentCouts.length;
      saved = await POST(`/affaires/${state.currentAffaire.id}/couts`, body);
      state.currentCouts.push(saved);
    }
    document.querySelector('.modal-overlay')?.remove();
    switchTab('bilan');
    toast(editingCoutId ? 'Poste mis à jour' : 'Poste ajouté', 'success');
  } catch(e) { toast(e.message,'error'); }
}

async function deleteCout(id) {
  const c = state.currentCouts.find(x => x.id === id);
  if (c && c.bon_commande_id) {
    toast('Ce poste est lié à un bon de commande — supprimez-le depuis le bon de commande.', 'warning');
    return;
  }
  const ok = await confirm('Supprimer ce poste ?','Cette action est irréversible.');
  if (!ok) return;
  try {
    await DEL(`/affaires/${state.currentAffaire.id}/couts/${id}`);
    state.currentCouts = state.currentCouts.filter(x => x.id !== id);
    switchTab('bilan');
    toast('Poste supprimé','success');
  } catch(e) { toast(e.message,'error'); }
}

function openLinkPosteModal(p2Id) {
  const p2c = state.currentCouts.find(x => x.id === p2Id);
  if (!p2c) return;
  const linkedIds = new Set(state.currentCouts.filter(c => c.poste_lie_id).map(c => c.poste_lie_id));
  const candidates = state.currentCouts.filter(c => (c.stade||'P1')==='P1' && c.categorie===p2c.categorie && !linkedIds.has(c.id));
  if (!candidates.length) { toast('Aucun poste prévisionnel (P1) disponible dans ce chapitre à associer.', 'warning'); return; }
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <h2>Associer à un prévisionnel</h2>
      <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
    </div>
    <div class="modal-body">
      <label class="form-label">Poste P1 du chapitre « ${escHtml(p2c.categorie)} »</label>
      <select class="form-control" id="link-poste-select">
        ${candidates.map(c=>`<option value="${c.id}">${escHtml(c.libelle)} (${fmtEur(c.cout_prevu)})</option>`).join('')}
      </select>

async function confirmLinkPoste(p2Id) {
  const val = document.getElementById('link-poste-select').value;
  if (!val) return;
  try {
    const saved = await PUT(`/affaires/${state.currentAffaire.id}/couts/${p2Id}`, { poste_lie_id: val });
    const idx = state.currentCouts.findIndex(x => x.id === p2Id);
    if (idx >= 0) state.currentCouts[idx] = saved;
    document.querySelector('.modal-overlay')?.remove();
    switchTab('bilan');
    toast('Postes associés', 'success');
  } catch(e) { toast(e.message, 'error'); }
}

async function unlinkPoste(p2Id) {
  try {
    const saved = await PUT(`/affaires/${state.currentAffaire.id}/couts/${p2Id}`, { poste_lie_id: null });
    const idx = state.currentCouts.findIndex(x => x.id === p2Id);
    if (idx >= 0) state.currentCouts[idx] = saved;
    switchTab('bilan');
    toast('Postes dissociés', 'success');

}

function toggleChapter(id) {

/* ── Drag & Drop chapters ── */
function dragStart(e, idx) {
  state.draggingIndex = idx;
  e.dataTransfer.effectAllowed = 'move';
}
function dragOver(e, idx) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}
function dragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
async function dragDrop(e, idx) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const from = state.draggingIndex;
  if (from === null || from === idx) return;
  const items = [...state.currentItems];
  const [moved] = items.splice(from, 1);
  items.splice(idx, 0, moved);
  state.currentItems = items;
  state.draggingIndex = null;
  // Update ordre for each item
  try {
    await Promise.all(items.map((it,i) =>
      PUT(`/affaires/${state.currentAffaire.id}/items/${it.id}`, { ordre: i })
    ));
    switchTab('chapitres');
  } catch(e) { toast('Erreur réorganisation','error'); }
}

/* ─── Modèles liés aux types (en base : state.chapterTemplates) ─── */
function getTypeTemplates() {
  // Defaults from _TYPE_FIELD_DEFAULTS, overrideable per type via l'API (partagé entre postes)
  const defaults = {};
  Object.entries(_TYPE_FIELD_DEFAULTS).forEach(([t, fArr]) => {
    defaults[t] = fArr.map(([l, v, u]) => ({libelle: l, valeur: v || '', unite: u || ''}));
  });
  return Object.assign({}, defaults, state.chapterTemplates || {});
}
function getTemplateForType(typeName) {
  if (!typeName || typeName === '__new__') return null;
  return getTypeTemplates()[typeName] || null;
}

/* ── Gestion du type de chapitre ── */
async function onChTypeChange(val, sel) {
  const customInput  = document.getElementById('ch-type-custom');
  const motorSection = document.getElementById('moteur-picker-section');

  customInput.style.display = val === '__new__' ? 'block' : 'none';
  if (val === '__new__') { customInput.value = ''; customInput.focus(); return; }

  if (motorSection) motorSection.style.display = isMotorType(val) ? 'block' : 'none';

  const tpl = val ? getTemplateForType(val) : null;

  // Si des champs sont déjà remplis, demander confirmation avant d'écraser
  if (tpl && tpl.length && _chHasFilledFields()) {
    const ok = await confirm(
      'Changer de type ?',
      `Le modèle "${val}" va remplacer les champs actuels. Continuer ?`
    );
    if (!ok) {
      if (sel) sel.value = sel.dataset.prevVal || '';
      return;
    }
  }
  if (sel) sel.dataset.prevVal = val;

  const container = document.getElementById('ch-fields-list');
  if (!container) return;
  if (tpl && tpl.length) {
    applyChapterTemplate(val);
  } else {
    container.innerHTML = '<div id="ch-fields-empty" style="padding:6px 4px;font-size:12px;color:var(--text-muted)">Sélectionnez un type pour charger un modèle, ou ajoutez des champs manuellement.</div>';
  }
}

function onCustomTypeBlur(val) {
  // Quand l'utilisateur a saisi un nom et quitte le champ, on l'ajoute à la liste
  val = val.trim();
  if (!val) return;
  const sel = document.getElementById('ch-type');
  // Chercher si déjà dans la liste
  const exists = [...sel.options].some(o => o.value === val);
  if (!exists) {
    const opt = new Option(val, val);
    sel.insertBefore(opt, sel.querySelector('option[value="__new__"]'));
  }
  sel.value = val;
  document.getElementById('ch-type-custom').style.display = 'none';
  onChTypeChange(val);
}

/* ── Gestion du type dans le modal sous-ensemble ── */
function onSeTypeChange(val) {
  const customInput = document.getElementById('se-type-custom');
  customInput.style.display = val === '__new__' ? 'block' : 'none';
  if (val === '__new__') { customInput.value = ''; customInput.focus(); }
}

function onSeTypeCustomBlur(val) {
  val = val.trim();
  if (!val) return;
  const sel = document.getElementById('se-type');
  const exists = [...sel.options].some(o => o.value === val);
  if (!exists) {
    const opt = new Option(val, val);
    sel.insertBefore(opt, sel.querySelector('option[value="__new__"]'));
    saveCustomType(val);
  }
  sel.value = val;
  document.getElementById('se-type-custom').style.display = 'none';
}

/* ── Champs de chapitre (liste unifiée) ── */
function chFieldRowHtml(style, libelle, valeur, unite) {
  style = style || 'text'; libelle = libelle || ''; valeur = valeur || ''; unite = unite || '';
  let inputHtml;
  if (style === 'date') {
    inputHtml = `<input type="date" class="ch-field-val form-control" value="${escHtml(valeur)}" style="flex:1;font-size:13px">`;
  } else if (style === 'check') {
    const checked = valeur === 'true' ? 'checked' : '';
    inputHtml = `<label style="display:flex;align-items:center;gap:8px;flex:1;cursor:pointer;padding:6px 0">
      <input type="checkbox" class="ch-field-val" ${checked}
        onchange="this.nextElementSibling.textContent=this.checked?'Oui':'Non'"
        style="width:16px;height:16px;cursor:pointer;flex-shrink:0">
      <span style="font-size:13px;color:var(--text-muted)">${valeur === 'true' ? 'Oui' : 'Non'}</span>
    </label>`;
  } else if (style === 'measure') {
    inputHtml = `<input type="text" class="ch-field-val form-control" placeholder="Valeur" value="${escHtml(valeur)}" style="flex:1;font-size:13px;min-width:60px">
      <input type="text" class="ch-field-unit form-control" placeholder="Unité" value="${escHtml(unite)}" style="flex:none;width:76px;font-size:13px">`;
  } else if (style === 'select') {
    const opts = parseSelectOpts(unite);
    const selVals = valeur.split('|').map(s=>s.trim()).filter(Boolean);
    inputHtml = `<div style="flex:1;display:flex;flex-direction:column;gap:6px">
      <select class="ch-field-val form-control" multiple size="${Math.min(Math.max(opts.length,2),5)}"
        style="font-size:13px;height:auto" title="Ctrl+clic pour sélection multiple">
        ${opts.map(o => `<option${selVals.includes(o)?' selected':''}>${escHtml(o)}</option>`).join('')}
      </select>
      <div style="font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px;margin-top:2px">Options disponibles :</div>
      ${buildOptsEditor(unite, 'ch-field-unit')}
    </div>`;
  } else if (style === 'document') {
    inputHtml = `<div style="flex:1;display:flex;flex-direction:column;gap:3px">
      <div style="display:flex;align-items:center;gap:5px">
        <input type="text" class="ch-field-val form-control" value="${escHtml(valeur)}"
          placeholder="Aucun fichier sélectionné" readonly
          style="flex:1;font-size:13px;background:#fafbfc;cursor:default" title="${escHtml(valeur)||'Nom du fichier'}">
        <label class="btn btn-secondary btn-xs" style="cursor:pointer;margin:0;flex-shrink:0;white-space:nowrap" title="Choisir un fichier à joindre">
          Parcourir
          <input type="file" style="display:none" onchange="chDocFieldSelect(this)">
        </label>
      </div>
      <div class="ch-doc-hint" style="font-size:11px;color:var(--text-muted)">${valeur ? '' : 'Le fichier sera déposé dans le dossier du chapitre à l\'enregistrement.'}</div>
    </div>`;
  } else {
    inputHtml = `<textarea class="ch-field-val form-control" rows="2" placeholder="Contenu…"
      style="flex:1;font-size:13px;resize:vertical">${escHtml(valeur)}</textarea>`;
  }
  return `<div class="ch-field-row" data-style="${escHtml(style)}"
    style="display:flex;align-items:flex-start;gap:6px;margin-bottom:8px">
    <select class="form-control ch-field-type" style="width:108px;flex-shrink:0;font-size:12px;padding:5px 6px;align-self:flex-start"
      onchange="onChFieldTypeChange(this)">
      <option value="text"    ${style==='text'   ?'selected':''}>Texte</option>
      <option value="date"    ${style==='date'   ?'selected':''}>Date</option>
      <option value="measure" ${style==='measure'?'selected':''}>Mesure</option>
      <option value="check"   ${style==='check'  ?'selected':''}>Coche</option>
      <option value="select"    ${style==='select'   ?'selected':''}>Liste</option>
      <option value="document"  ${style==='document' ?'selected':''}>Document</option>
    </select>
    <input class="ch-field-label form-control" placeholder="Libellé" value="${escHtml(libelle)}"
      style="width:150px;flex-shrink:0;align-self:flex-start;font-size:13px">
    ${inputHtml}
    <button class="btn-rm-detail" onclick="this.closest('.ch-field-row').remove()"
      style="align-self:flex-start;margin-top:3px">✕</button>
  </div>`;
}

function onChFieldTypeChange(sel) {
  const row = sel.closest('.ch-field-row');
  if (!row) return;
  const label = row.querySelector('.ch-field-label')?.value || '';
  const div = document.createElement('div');
  div.innerHTML = chFieldRowHtml(sel.value, label, '', '');
  row.replaceWith(div.firstElementChild);
}

function addChField(style) {
  const container = document.getElementById('ch-fields-list');
  if (!container) return;
  document.getElementById('ch-fields-empty')?.remove();
  container.insertAdjacentHTML('beforeend', chFieldRowHtml(style || 'text', '', '', ''));
  container.querySelectorAll('.ch-field-row:last-child .ch-field-label')[0]?.focus();
}

function _chHasFilledFields() {
  for (const row of document.querySelectorAll('#ch-fields-list .ch-field-row')) {
    if (row.dataset.style === 'check') continue;
    const val = row.querySelector('.ch-field-val');
    if (val && val.value && val.value.trim()) return true;
  }
  return false;
}

function applyChapterTemplate(typeName) {
  const container = document.getElementById('ch-fields-list');
  if (!container) return;
  const fields = getTemplateForType(typeName);
  if (!fields || !fields.length) return;
  container.innerHTML = '';
  fields.forEach(f => {
    if (!f.libelle) return;
    container.insertAdjacentHTML('beforeend', chFieldRowHtml(fieldStyle(f), f.libelle, f.valeur || '', f.unite || ''));
  });
}

function pickSearchedMoteur(m) {

function parseSelectOpts(str) {
  return (str || '').split('|').map(s => s.trim()).filter(Boolean);
}

/* ── Éditeur d'options (tag chips) ── */
function buildOptsEditor(optsStr, hiddenClass) {
  const opts = parseSelectOpts(optsStr);
  const chipsHtml = opts.map(o =>
    `<span class="opts-chip" data-val="${escHtml(o)}">${escHtml(o)}<button type="button" onclick="_removeOpt(this)" title="Supprimer">✕</button></span>`
  ).join('');
  return `<div class="opts-editor">
    <div class="opts-chips" onclick="this.nextElementSibling.querySelector('.opts-add-input').focus()">${chipsHtml}</div>
    <div class="opts-add-row">
      <input class="opts-add-input" placeholder="Nouvelle option…"
        onkeydown="if(event.key==='Enter'){event.preventDefault();_addOpt(this)}">
      <button type="button" class="opts-add-btn" onclick="_addOpt(this.previousElementSibling)">+ Ajouter</button>
    </div>
    <input type="hidden" class="${hiddenClass}" value="${escHtml(opts.join(' | '))}">
  </div>`;
}

function _addOpt(input) {
  const val = input.value.trim();
  if (!val) return;
  const editor = input.closest('.opts-editor');
  if (!editor) return;
  const existing = Array.from(editor.querySelectorAll('.opts-chip')).map(c => c.dataset.val);
  if (existing.includes(val)) { input.value = ''; return; }
  const chip = document.createElement('span');
  chip.className = 'opts-chip';
  chip.dataset.val = val;
  chip.innerHTML = `${escHtml(val)}<button type="button" onclick="_removeOpt(this)" title="Supprimer">✕</button>`;
  editor.querySelector('.opts-chips').appendChild(chip);
  _syncOptsHidden(editor);
  input.value = '';
  input.focus();
  // Refresh la liste du select si présent dans le même ch-field-row
  const row = editor.closest('.ch-field-row');
  if (row) _refreshChSelectFromEditor(row);
}

function _removeOpt(btn) {
  const chip = btn.closest('.opts-chip');
  const editor = chip?.closest('.opts-editor');
  chip?.remove();
  if (editor) {
    _syncOptsHidden(editor);
    const row = editor.closest('.ch-field-row');
    if (row) _refreshChSelectFromEditor(row);
  }
}

function _syncOptsHidden(editor) {
  const vals = Array.from(editor.querySelectorAll('.opts-chip')).map(c => c.dataset.val);
  const hidden = editor.querySelector('input[type="hidden"]');
  if (hidden) hidden.value = vals.join(' | ');
}

function _refreshChSelectFromEditor(row) {
  const editor = row.querySelector('.opts-editor');
  const sel = row.querySelector('.ch-field-val');
  if (!editor || !sel || sel.tagName !== 'SELECT') return;
  const prevSelected = Array.from(sel.selectedOptions).map(o => o.value);
  const opts = Array.from(editor.querySelectorAll('.opts-chip')).map(c => c.dataset.val);
  sel.innerHTML = opts.map(o => `<option${prevSelected.includes(o)?' selected':''}>${escHtml(o)}</option>`).join('');
  sel.size = Math.min(Math.max(opts.length, 2), 5);
}

function refreshChSelectOpts(input) {
  // Legacy : plus utilisé mais conservé pour compatibilité
  const row = input.closest('.ch-field-row');
  if (row) _refreshChSelectFromEditor(row);
}

function parseDetails(json) {
  try {
    const parsed = JSON.parse(json || '[]');
    if (Array.isArray(parsed)) return parsed;
    // Ancien format {clé: valeur} → conversion
    return Object.entries(parsed).map(([k, v]) => ({libelle: k, valeur: v, unite: ''}));
  } catch(e) { return []; }
}

function fieldStyle(d) {
  if (d.style) return d.style;
  if (d.type === 'main') return 'text';
  if (d.type === 'aux')  return 'measure';
  return (d.unite && d.unite !== '') ? 'measure' : 'text';
}

async function saveChapter() {
  let type_item = document.getElementById('ch-type').value;
  if (type_item === '__new__') {
    type_item = document.getElementById('ch-type-custom').value.trim();
    if (!type_item) { toast('Entrez un nom pour la nouvelle catégorie','warning'); return; }
    saveCustomType(type_item);
  }
  const statut    = document.getElementById('ch-statut').value;
  const libelle   = document.getElementById('ch-libelle').value.trim();
  if (!libelle) { toast('Le titre du chapitre est requis', 'warning'); document.getElementById('ch-libelle')?.focus(); return; }
  const num_serie = document.getElementById('ch-serie')?.value.trim() || '';
  const details   = [];
  const _pendingDocUploads = [];
  document.querySelectorAll('#ch-fields-list .ch-field-row').forEach(row => {
    const style = row.dataset.style || 'text';
    const l = row.querySelector('.ch-field-label')?.value.trim();
    if (!l) return;
    let v = '', u = '';
    if (style === 'check') {
      v = row.querySelector('.ch-field-val')?.checked ? 'true' : 'false';
    } else if (style === 'select') {
      const selEl = row.querySelector('.ch-field-val');
      if (selEl) v = Array.from(selEl.selectedOptions).map(o => o.value).filter(Boolean).join(' | ');
      // Lire depuis le hidden input du tag editor (class ch-field-unit)
      u = row.querySelector('.ch-field-unit')?.value?.trim() || '';
    } else if (style === 'measure') {
      v = row.querySelector('.ch-field-val')?.value?.trim() || '';
      u = row.querySelector('.ch-field-unit')?.value?.trim() || '';
    } else if (style === 'document') {
      v = row.querySelector('.ch-field-val')?.value?.trim() || '';
      if (row._pendingFile) {
        _pendingDocUploads.push({ label: l, file: row._pendingFile });
        v = ''; // sera mis à jour après upload
      }
    } else {
      v = row.querySelector('.ch-field-val')?.value?.trim() || '';
    }
    details.push({style, libelle: l, valeur: v, unite: u});
  });
  const body = { type_item, statut, libelle, num_serie,
                 details_json: JSON.stringify(details),
                 ordre: editingChapterId ? undefined : state.currentItems.length };
  try {
    let saved;
    if (editingChapterId) {
      saved = await PUT(`/affaires/${state.currentAffaire.id}/items/${editingChapterId}`, body);
      const idx = state.currentItems.findIndex(x => x.id === editingChapterId);
      if (idx >= 0) state.currentItems[idx] = saved;
    } else {
      saved = await POST(`/affaires/${state.currentAffaire.id}/items`, body);
      state.currentItems.push(saved);
    }

    // Upload des fichiers document en attente
    if (_pendingDocUploads.length > 0) {
      let savedDetails = [...details];
      for (const doc of _pendingDocUploads) {
        try {
          const fd = new FormData();
          fd.append('file', doc.file, doc.file.name);
          const resp = await fetch(`${API_BASE}/affaires/${state.currentAffaire.id}/items/${saved.id}/files`, {method:'POST', body:fd});
          if (!resp.ok) throw new Error(await resp.text());
          const result = await resp.json();
          let docFileName = result.name;
          const suggested = computeNormalizedDocName(
            state.currentAffaire, {libelle, type_item}, doc.label, docFileName
          );
          const finalName = await renameDialog(docFileName, suggested);
          if (finalName && finalName !== docFileName) {
            try {
              const r = await api('POST',
                `/affaires/${state.currentAffaire.id}/items/${saved.id}/files/${encodeURIComponent(docFileName)}/rename`,
                {new_name: finalName});
              docFileName = r.name;
            } catch(_) {}
          }
          for (let i = 0; i < savedDetails.length; i++) {
            if (savedDetails[i].style === 'document' && savedDetails[i].libelle === doc.label && savedDetails[i].valeur === '') {
              savedDetails[i] = {...savedDetails[i], valeur: docFileName};
              break;
            }
          }
        } catch(e) { toast('Erreur upload « ' + doc.file.name + ' » : ' + e.message, 'error'); }
      }
      try {
        const updated = await PUT(`/affaires/${state.currentAffaire.id}/items/${saved.id}`,
          {details_json: JSON.stringify(savedDetails)});
        const idx2 = state.currentItems.findIndex(x => x.id === saved.id);
        if (idx2 >= 0) state.currentItems[idx2] = updated;
      } catch(_) {}
    }

    document.querySelector('.modal-overlay')?.remove();
    switchTab('chapitres');
    updateSidebarProgress();
    toast(editingChapterId ? 'Chapitre mis à jour' : 'Chapitre ajouté', 'success');
  } catch(e) { toast(e.message,'error'); }
}

/* ── Documents par chapitre ── */
async function loadChapterFiles(itemId) {
  const listEl = document.getElementById(`ch-file-list-${itemId}`);
  if (!listEl) return;
  listEl.innerHTML = '<div style="font-size:12px;color:var(--text-muted)">Chargement…</div>';
  try {
    const files = await GET(`/affaires/${state.currentAffaire.id}/items/${itemId}/files`);
    if (!files.length) {
      listEl.innerHTML = '<div style="font-size:12px;color:var(--text-muted);font-style:italic">Aucun document</div>';
      return;
    }
    listEl.innerHTML = files.map(f => {
      const size = f.size > 1048576 ? (f.size/1048576).toFixed(1)+' Mo'
                 : f.size > 1024   ? (f.size/1024).toFixed(0)+' Ko'
                 : f.size + ' o';
      return `<div style="display:flex;align-items:center;gap:7px;padding:4px 0;border-bottom:1px solid #f1f5f9">
        <span style="flex:1;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escHtml(f.name)}">${escHtml(f.name)}</span>
        <span style="font-size:11px;color:var(--text-muted);white-space:nowrap;flex-shrink:0">${size}</span>
        <a href="${API_BASE}/affaires/${state.currentAffaire.id}/items/${itemId}/files/${encodeURIComponent(f.name)}"
           download="${escHtml(f.name)}" class="btn-icon" title="Télécharger" style="text-decoration:none;font-size:14px">⬇</a>
        <button class="btn-icon red no-print" onclick="chDeleteFile('${itemId}', ${JSON.stringify(f.name)})" title="Supprimer" style="font-size:12px">✕</button>
      </div>`;
    }).join('');
  } catch(e) {
    listEl.innerHTML = `<div style="font-size:12px;color:var(--danger)">Erreur : ${escHtml(e.message)}</div>`;
  }
}

async function chUploadFiles(itemId, input) {
  const files = [...input.files];
  input.value = '';
  if (!files.length) return;
  const listEl = document.getElementById(`ch-file-list-${itemId}`);
  if (listEl) listEl.innerHTML = '<div style="font-size:12px;color:var(--text-muted)">Envoi…</div>';
  let done = 0;
  for (const file of files) {
    try {
      const fd = new FormData();
      fd.append('file', file);
      const resp = await fetch(`${API_BASE}/affaires/${state.currentAffaire.id}/items/${itemId}/files`, {method:'POST', body: fd});
      if (!resp.ok) throw new Error(await resp.text());
      done++;
    } catch(e) { toast('Erreur upload ' + file.name + ' : ' + e.message, 'error'); }
  }
  await loadChapterFiles(itemId);
  if (done) toast(done + ' fichier' + (done > 1 ? 's' : '') + ' ajouté' + (done > 1 ? 's' : ''), 'success');
}

async function chDeleteFile(itemId, filename) {
  if (!window.confirm(`Supprimer "${filename}" ?`)) return;
  try {
    await fetch(`${API_BASE}/affaires/${state.currentAffaire.id}/items/${itemId}/files/${encodeURIComponent(filename)}`, {method:'DELETE'});
    await loadChapterFiles(itemId);
  } catch(e) { toast('Erreur suppression', 'error'); }
}

async function openChapterDossier(itemId) {
  try {
    if (!LOCAL_PORT) { toast('Serveur local non disponible', 'error'); return; }
    const item = (state.currentAffaire?.items || []).find(it => it.id === itemId);
    const serverPath = item?.dossier_path || '';
    const clientPath = serverPath ? _toClientPath(serverPath) : '';
    if (!clientPath) { toast('Dossier non défini pour ce chapitre', 'warning'); return; }
    await fetch('http://127.0.0.1:' + LOCAL_PORT + '/open-folder?path=' + encodeURIComponent(clientPath), {mode:'no-cors'});
    toast('Dossier ouvert dans l\'explorateur', 'success', 2000);
  } catch(e) { toast('Impossible d\'ouvrir le dossier', 'error'); }
}

/* ── Champ Document : helpers ── */

function chDocFieldSelect(input) {
  const file = input.files[0];
  if (!file) return;
  const row = input.closest('.ch-field-row');
  if (!row) return;
  const valInput = row.querySelector('.ch-field-val');
  if (valInput) valInput.value = file.name;
  row._pendingFile = file;
  const hint = row.querySelector('.ch-doc-hint');
  if (hint) hint.textContent = '⏳ Fichier prêt — sera déposé dans le dossier du chapitre à l\'enregistrement.';
  input.value = '';
}

function computeNormalizedDocName(affaire, chapter, fieldLabel, originalName) {
  const dotIdx = originalName.lastIndexOf('.');
  const ext = dotIdx >= 0 ? originalName.slice(dotIdx).toLowerCase() : '';
  const date = new Date().toISOString().slice(0, 10).replace(/-/g, '');
  const slugify = s => (s || '')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 28);
  return [
    slugify(affaire.num_affaire),
    slugify(chapter.libelle || chapter.type_item || 'chapitre'),
    slugify(fieldLabel || 'document'),
    date
  ].filter(Boolean).join('_') + ext;
}

function renameDialog(currentName, suggestedName) {
  return new Promise(res => {
    const el = document.createElement('div');
    el.className = 'confirm-overlay';
    el.style.zIndex = '300';
    el.innerHTML = `
      <div class="confirm-box" style="max-width:500px;text-align:left">
        <h3 style="margin-bottom:8px">Nommer le document</h3>
        <p style="font-size:12px;color:var(--text-muted);margin-bottom:10px">
          Fichier déposé : <code style="background:#f3f4f6;padding:1px 6px;border-radius:3px;font-size:12px">${escHtml(currentName)}</code>
        </p>
        <label class="form-label" style="margin-bottom:4px;display:block">Nom normalisé proposé — modifiable :</label>
        <input class="form-control" id="rn-input" value="${escHtml(suggestedName)}" style="margin-bottom:16px;font-size:13px">
        <div class="actions">
          <button class="btn btn-secondary" id="rn-skip">Garder le nom d'origine</button>
          <button class="btn btn-primary" id="rn-ok">✓ Renommer</button>
        </div>
      </div>`;
    document.body.appendChild(el);
    const finish = v => { el.remove(); res(v); };
    el.querySelector('#rn-ok').onclick = () => finish(el.querySelector('#rn-input').value.trim() || null);
    el.querySelector('#rn-skip').onclick = () => finish(null);
  });
}

async function openChDocRename(itemId, filename, chapterLibelle, fieldLabel) {
  const suggested = computeNormalizedDocName(
    state.currentAffaire, {libelle: chapterLibelle}, fieldLabel, filename
  );
  const finalName = await renameDialog(filename, suggested);
  if (!finalName || finalName === filename) return;
  try {
    const r = await api('POST',
      `/affaires/${state.currentAffaire.id}/items/${itemId}/files/${encodeURIComponent(filename)}/rename`,
      {new_name: finalName});
    const item = state.currentItems.find(x => x.id === itemId);
    if (item) {
      const details = parseDetails(item.details_json).map(d =>
        (d.style === 'document' && d.valeur === filename && d.libelle === fieldLabel)
          ? {...d, valeur: r.name} : d
      );
      const updated = await PUT(`/affaires/${state.currentAffaire.id}/items/${itemId}`,
        {details_json: JSON.stringify(details)});
      const idx = state.currentItems.findIndex(x => x.id === itemId);
      if (idx >= 0) state.currentItems[idx] = updated;
      switchTab('chapitres');
    }
    toast('Fichier renommé en « ' + r.name + ' »', 'success');
  } catch(e) { toast(e.message, 'error'); }
}

async function deleteChapter(id) {
  const ok = await confirm('Supprimer ce chapitre ?','Cette action est irréversible.');
  if(!ok) return;
  try {
    await DEL(`/affaires/${state.currentAffaire.id}/items/${id}`);
    state.currentItems = state.currentItems.filter(x => x.id !== id);
    switchTab('chapitres');
    updateSidebarProgress();
    toast('Chapitre supprimé','success');
  } catch(e) { toast(e.message,'error'); }
}

let moteurSearchResults = [];
function openLinkMoteur() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
  <div class="modal modal-moteur">
    <div class="modal-header">
      <h2>Lier un moteur</h2>
      <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
    </div>
    <div class="modal-body" style="flex:1;overflow-y:auto">
      <label class="form-label" style="margin-bottom:6px;display:block">Rechercher un moteur</label>
      <p style="font-size:12px;color:var(--text-muted);margin-bottom:10px">N° série, marque, navire, client… (min. 2 caractères)</p>
      <div class="search-dropdown" id="moteur-dd">
        <input class="form-control" id="moteur-search-input"
          placeholder="Ex : VTP12345, Volvo Penta, Atlantic…"
          oninput="searchMoteurs(this.value)" autocomplete="off">
        <div class="search-results" id="moteur-search-results"></div>
      </div>
      <div id="selected-moteur-preview" style="margin-top:14px"></div>

    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Annuler</button>
      <button class="btn btn-primary" id="btn-confirm-link" disabled onclick="confirmLinkMoteur()">Lier ce moteur</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
  moteurSearchResults = [];
  window._selectedMoteur = null;
}
async function searchMoteurs(q) {
  if(q.length < 2) {
    document.getElementById('moteur-search-results').innerHTML = '';
    document.getElementById('moteur-dd').classList.remove('open');
    return;
  }
  try {
    const res = await GET(`/moteurs?search=${encodeURIComponent(q)}`);
    moteurSearchResults = res;
    const el = document.getElementById('moteur-search-results');
    if(!res.length) {
      el.innerHTML = '<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:13px">Aucun moteur trouvé</div>';
    } else {
      el.innerHTML = res.map(m => `
        <div class="moteur-search-result" onclick="selectMoteur('${m.id}')">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:700;color:var(--text)">${escHtml(m.num_serie)}</div>
            <div style="font-size:12px;color:var(--text-muted);margin-top:1px">
              ${[m.marque, m.type_moteur, m.navire, m.machine].filter(Boolean).map(escHtml).join(' · ')}
            </div>
            ${m.client_nom ? `<div style="font-size:11px;color:var(--accent);margin-top:2px">${escHtml(m.client_nom)}</div>` : ''}
          </div>
          ${m.affaire_liee ? `<span style="font-size:11px;background:var(--warning-bg);color:var(--warning);padding:2px 7px;border-radius:10px;font-weight:600;flex-shrink:0">Lié: ${escHtml(m.code_affaire)}</span>` : ''}
        </div>`).join('');
    }
    document.getElementById('moteur-dd').classList.add('open');
  } catch(e) {}
}
function selectMoteur(id) {
  const m = moteurSearchResults.find(x => x.id === id);
  if(!m) return;
  window._selectedMoteur = m;
  document.getElementById('moteur-dd').classList.remove('open');
  document.getElementById('moteur-search-input').value = `${m.num_serie} — ${m.marque}`;
  const affCode = codeAffaireFromNum(state.currentAffaire.num_affaire);
  const dejaLie = m.affaire_liee && m.code_affaire !== affCode;
  const warning = dejaLie
    ? `<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--warning-bg);color:var(--warning);border-radius:6px;font-size:12px;font-weight:600;margin-bottom:10px">⚠ Ce moteur est déjà lié à l'affaire ${escHtml(m.code_affaire)}. Le lier ici le déliera de cette affaire.</div>`
    : '';
  document.getElementById('selected-moteur-preview').innerHTML = warning + moteurCard(m, true);
  document.getElementById('btn-confirm-link').disabled = false;
}
async function confirmLinkMoteur() {
  const m = window._selectedMoteur;
  if(!m) return;
  const affCode = codeAffaireFromNum(state.currentAffaire.num_affaire);
  if (m.affaire_liee && m.code_affaire !== affCode) {
    const ok = await confirm(
      'Moteur déjà lié',
      `Ce moteur (${m.num_serie}) est déjà lié à l'affaire ${m.code_affaire}. Voulez-vous le délier de cette affaire et le lier à ${state.currentAffaire.num_affaire} ?`
    );
    if (!ok) return;
  }
  try {
    await PUT(`/moteurs/${m.id}`, { code_affaire: affCode });
    m.code_affaire = affCode;
    state.currentMoteurs.push(m);
    document.querySelector('.modal-overlay')?.remove();
    switchTab('moteurs');
    toast('Moteur lié avec succès', 'success');
    const ok = await confirm(
      `Créer un chapitre pour ${m.num_serie} ?`,
      `Voulez-vous créer un chapitre affaire pour ${m.num_serie}${m.marque ? ' ('+m.marque+')' : ''} ?`
    );
    if (ok) {
      editingChapterId = null;
      openChapterModal({
        libelle: [m.marque, m.type_moteur].filter(Boolean).join(' ') || m.num_serie,
        type_item: 'Moteur principal',
        marque: m.marque || '',
        reference: m.ref_constructeur || '',
        num_serie: m.num_serie,
      });
    }
  } catch(e) { toast(e.message,'error'); }
}
async function unlinkMoteur(id) {
  const ok = await confirm('Délier ce moteur ?','Le moteur ne sera plus associé à cette affaire.');
  if(!ok) return;
  try {
    await PUT(`/moteurs/${id}`, { code_affaire: '' });
    state.currentMoteurs = state.currentMoteurs.filter(m => m.id !== id);
    switchTab('moteurs');
    toast('Moteur délié','success');
  } catch(e) { toast(e.message,'error'); }
}
