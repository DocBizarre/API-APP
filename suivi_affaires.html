function _seEtatClass(etat) {
  if (!etat) return 'se-etat-default';
  const e = etat.toLowerCase();
  if (e === 'neuf') return 'se-etat-neuf';
  if (e.startsWith('bon')) return 'se-etat-bon';
  if (e.startsWith('usag')) return 'se-etat-usage';
  if (e === 'hors service') return 'se-etat-hs';
  return 'se-etat-default';
}

function renderSousEnsemblesList(moteurId, items) {
  const listEl = document.getElementById(`se-list-${moteurId}`);

  const mObj = state.currentMoteurs.find(x => x.id === moteurId);
  const linkedChs = mObj
    ? state.currentItems.filter(it => it.num_serie && it.num_serie === mObj.num_serie)
    : [];

  const seHtml = !items.length
    ? '<div style="font-size:12px;color:var(--text-muted);padding:4px 0;font-style:italic">Aucun sous-ensemble enregistré</div>'
    : items.map(se => `

async function saveSousEnsemble(moteurId, seId) {
  const libelle = document.getElementById('se-libelle').value.trim();
  if (!libelle) { toast('Le libellé est obligatoire','error'); return; }
  const data = {
    libelle,
    type:      (() => { const v = document.getElementById('se-type').value; return v === '__new__' ? document.getElementById('se-type-custom').value.trim() : v; })(),
    reference: document.getElementById('se-reference').value.trim(),
    marque:    document.getElementById('se-marque').value.trim(),
    num_serie: document.getElementById('se-num-serie').value.trim(),
    etat:      document.getElementById('se-etat').value,
    notes:     document.getElementById('se-notes').value.trim(),
  };
  try {
    if (seId) {
      await PUT(`/moteurs/${moteurId}/sous-ensembles/${seId}`, data);
    } else {
      await POST(`/moteurs/${moteurId}/sous-ensembles`, data);
    }
    document.querySelector('.modal-overlay')?.remove();
    await loadSousEnsembles(moteurId);
    toast(seId ? 'Sous-ensemble modifié' : 'Sous-ensemble ajouté', 'success');
    // Proposer la création d'un chapitre uniquement pour un nouveau sous-ensemble
    if (!seId) {
      const mObj = state.currentMoteurs.find(x => x.id === moteurId);
      const ok = await confirm(
        `Créer un chapitre pour "${data.libelle}" ?`,
        `Voulez-vous ajouter un chapitre à cette affaire pour ce sous-ensemble ?`
      );
      if (ok) {
        editingChapterId = null;
        openChapterModal({
          libelle:   data.libelle,
          type_item: data.type || '',
          num_serie: mObj?.num_serie || '',
        });
      }
    }
  } catch(e) { toast(e.message, 'error'); }
}

async function deleteSousEnsemble(moteurId, seId) {
  const ok = await confirm('Supprimer ce sous-ensemble ?', 'Cette action est irréversible.');
  if (!ok) return;
  try {
    await DEL(`/moteurs/${moteurId}/sous-ensembles/${seId}`);
    await loadSousEnsembles(moteurId);
    toast('Sous-ensemble supprimé', 'success');
  } catch(e) { toast(e.message, 'error'); }
}

// Convertit JJ/MM/AAAA ou YYYY-MM-DD → YYYY-MM-DD (pour type="date")
function toInputDate(s) {
  if (!s) return '';
  const m1 = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (m1) return `${m1[3]}-${m1[2]}-${m1[1]}`;
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  return '';
}
// Convertit YYYY-MM-DD → JJ/MM/AAAA (pour la sauvegarde)
function fromInputDate(s) {
  if (!s) return '';
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return `${m[3]}/${m[2]}/${m[1]}`;
  return s;
}

function onTvaExonereChange(checked) {

}
function updateTTC() {
  const ht = parseHT(document.getElementById('af-prix-ht')?.value);
  const tvaEl = document.getElementById('af-tva-amount');

}

// ── Gestion des échéances de facturation ──
let _echeances = [];

function initEcheances(jsonStr) {
  try { _echeances = JSON.parse(jsonStr || '[]'); } catch(e) { _echeances = []; }
  renderEcheances();
}

function fmtModalite(e) {
  if (!e || !e.modalite) return '';
  if (e.modalite === 'comptant') return 'Comptant';
  if (e.modalite === 'jours')    return `${e.jours || '?'} jours`;
  if (e.modalite === 'jours_fm') return `${e.jours || '?'} jours fin de mois`;
  return e.modalite;
}

function renderEcheances() {
  const list = document.getElementById('echeances-list');
  if (!list) return;
  const ht  = parseHT(document.getElementById('af-prix-ht')?.value);
  const exo = document.getElementById('af-exonere-tva')?.checked;
  const base = ht ? (exo ? ht : ht * 1.20) : null;
  list.innerHTML = _echeances.map((e, i) => {
    const montantStade = base !== null ? base * (parseFloat(e.pourcentage) || 0) / 100 : null;
    const paye = parseFloat(e.montant_paye) || 0;
    const reste = montantStade !== null ? montantStade - paye : null;
    const resteColor = reste === null ? 'color:var(--text-muted)' : reste <= 0 ? 'color:#059669;font-weight:600' : 'color:#dc2626;font-weight:600';
    const showJours = e.modalite === 'jours' || e.modalite === 'jours_fm';
    const joursLabel = e.modalite === 'jours_fm' ? 'jours fin de mois' : 'jours';
    return `
    <div style="background:var(--gray-bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:7px">
      <div class="ech-row-main">
        <input class="form-control" style="font-size:13px" placeholder="Nom du stade (ex : Acompte, Livraison…)"
          value="${escHtml(e.stade||'')}" oninput="_echeances[${i}].stade=this.value">
        <div style="position:relative">
          <input class="form-control" style="font-size:13px;padding-right:22px" type="number" min="0" max="100" step="0.1"
            placeholder="%" value="${e.pourcentage||''}"
            oninput="_echeances[${i}].pourcentage=this.value;updateEcheanceReste(${i});updateEcheancesTotal()">
          <span style="position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text-muted);pointer-events:none">%</span>
        </div>
        <div style="position:relative">
          <input class="form-control" style="font-size:13px;padding-right:22px" type="number" min="0" step="0.01"
            placeholder="Payé" value="${e.montant_paye||''}"
            oninput="_echeances[${i}].montant_paye=this.value;updateEcheanceReste(${i});updateEcheancesTotal()">
          <span style="position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text-muted);pointer-events:none">€</span>
        </div>
        <div id="ech-reste-${i}" style="font-size:13px;text-align:right;padding:0 4px;${resteColor}" title="Reste à payer">${reste === null ? '—' : fmtEur(reste)}</div>
        ${e.bon_genere ? `<span style="font-size:11px;background:#fef3c7;color:#d97706;padding:2px 7px;border-radius:10px;white-space:nowrap" title="Bon généré le ${escHtml(e.bon_genere)}">${escHtml(e.bon_genere)}</span>` : ''}
        <button type="button" onclick="removeEcheance(${i})"
          style="background:none;border:none;color:var(--danger);font-size:16px;padding:2px 4px;cursor:pointer;line-height:1" title="Supprimer">✕</button>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <select class="form-control" style="font-size:12px;width:auto;flex:0 0 auto"
          onchange="_echeances[${i}].modalite=this.value;toggleEcheanceJours(${i})">
          <option value="" ${!e.modalite?'selected':''}>— Modalité de paiement —</option>
          <option value="comptant" ${e.modalite==='comptant'?'selected':''}>Comptant</option>
          <option value="jours" ${e.modalite==='jours'?'selected':''}>À X jours</option>
          <option value="jours_fm" ${e.modalite==='jours_fm'?'selected':''}>À X jours fin de mois</option>
        </select>
        <div id="ech-jours-wrap-${i}" style="display:${showJours?'flex':'none'};align-items:center;gap:5px">
          <input id="ech-jours-${i}" class="form-control" type="number" min="1" style="font-size:12px;width:68px"
            placeholder="Ex: 30" value="${e.jours||''}"
            oninput="_echeances[${i}].jours=this.value">
          <span id="ech-jours-label-${i}" style="font-size:12px;color:var(--text-muted);white-space:nowrap">${joursLabel}</span>
        </div>
        <div style="display:flex;align-items:center;gap:5px;margin-left:auto">
          <span style="font-size:12px;color:var(--text-muted);white-space:nowrap">Date prévisionnelle</span>
          <input class="form-control" type="date" style="font-size:12px;width:auto"
            title="Date prévisionnelle d'encaissement de ce stade"
            value="${toInputDate(e.date_prevue||'')}"
            oninput="_echeances[${i}].date_prevue=fromInputDate(this.value)">
        </div>
      </div>
    </div>`;
  }).join('');
  updateEcheancesTotal();

function updateEcheanceReste(i) {
  const el = document.getElementById(`ech-reste-${i}`);
  if (!el) return;
  const ht  = parseHT(document.getElementById('af-prix-ht')?.value);
  const exo = document.getElementById('af-exonere-tva')?.checked;
  const base = ht ? (exo ? ht : ht * 1.20) : null;
  const e = _echeances[i];
  if (!e) return;
  const montantStade = base !== null ? base * (parseFloat(e.pourcentage) || 0) / 100 : null;
  const paye = parseFloat(e.montant_paye) || 0;
  const reste = montantStade !== null ? montantStade - paye : null;
  el.style.cssText = `font-size:13px;text-align:right;padding:0 4px;${reste === null ? 'color:var(--text-muted)' : reste <= 0 ? 'color:#059669;font-weight:600' : 'color:#dc2626;font-weight:600'}`;
  el.textContent = reste === null ? '—' : fmtEur(reste);
}

function toggleEcheanceJours(i) {
  const wrap  = document.getElementById(`ech-jours-wrap-${i}`);
  const label = document.getElementById(`ech-jours-label-${i}`);
  if (!wrap) return;
  const m = _echeances[i]?.modalite;
  wrap.style.display = (m === 'jours' || m === 'jours_fm') ? 'flex' : 'none';
  if (label) label.textContent = m === 'jours_fm' ? 'jours fin de mois' : 'jours';
}

function addEcheance() {
  _echeances.push({ stade: '', pourcentage: '', montant_paye: '', modalite: '', jours: '', date_prevue: '' });
  renderEcheances();
  const first = document.querySelector('#echeances-list > div:last-child input');
  if (first) first.focus();
}

function removeEcheance(i) {
  _echeances.splice(i, 1);
  renderEcheances();
}

function updateEcheancesTotal() {
  const totalEl = document.getElementById('echeances-total');
  if (!totalEl) return;
  if (!_echeances.length) { totalEl.style.display = 'none'; return; }
  const ht  = parseHT(document.getElementById('af-prix-ht')?.value);
  const exo = document.getElementById('af-exonere-tva')?.checked;
  const base = ht ? (exo ? ht : ht * 1.20) : null;
  const label = exo ? 'HT' : 'TTC';
  const totalPct   = _echeances.reduce((s,e) => s + (parseFloat(e.pourcentage)||0), 0);
  const totalPaye  = _echeances.reduce((s,e) => s + (parseFloat(e.montant_paye)||0), 0);
  const totalMont  = base !== null ? base * totalPct / 100 : null;
  const totalReste = totalMont !== null ? totalMont - totalPaye : null;
  const resteColor = totalReste === null ? '' : totalReste <= 0 ? 'color:#059669;font-weight:700' : 'color:#dc2626;font-weight:700';
  totalEl.style.display = 'flex';
  totalEl.innerHTML = `
    <span style="font-weight:600;color:var(--text-muted)">Total :</span>
    <span><strong>${totalPct.toFixed(1)} %</strong></span>
    ${totalMont !== null ? `<span>Montant ${label} : <strong>${fmtEur(totalMont)}</strong></span>` : ''}
    <span>Payé : <strong>${fmtEur(totalPaye)}</strong></span>
    ${totalReste !== null ? `<span style="${resteColor}">Reste ${label} : ${fmtEur(totalReste)}</span>` : ''}
    ${totalPct > 100 ? '<span style="color:#dc2626">⚠️ Total > 100 %</span>' : ''}
  `;
}

async function saveAffaire(id) {
  const body = {
    num_affaire:             document.getElementById('af-num').value.trim() || undefined,
    nom_projet:              document.getElementById('af-nom').value.trim(),
    client_id:               document.getElementById('af-client').value || undefined,
    fournisseur:             document.getElementById('af-fournisseur').value.trim(),
    navire_machine:          document.getElementById('af-navire').value.trim(),
    ref_interne:             document.getElementById('af-ref').value.trim(),
    num_commande_client:     document.getElementById('af-num-cmd').value.trim(),
    charge_affaire:          document.getElementById('af-charge').value.trim(),
    resp_technique:          document.getElementById('af-resp-tech').value.trim(),
    prix_ht:                 document.getElementById('af-prix-ht').value.trim(),
    exonere_tva:             document.getElementById('af-exonere-tva')?.checked ? 1 : 0,
    etablissement_financier: document.getElementById('af-ets-fin').value.trim(),
    date_achat:              fromInputDate(document.getElementById('af-achat').value),
    date_debut:              fromInputDate(document.getElementById('af-debut').value),
    date_fin_prevue:         fromInputDate(document.getElementById('af-fin').value),
    date_cloture:            fromInputDate(document.getElementById('af-cloture').value),
    statut:                  document.getElementById('af-statut').value,
    description:             document.getElementById('af-desc').value.trim(),
    commentaires:            document.getElementById('af-comm').value.trim(),
    echeances_facturation:   JSON.stringify(_echeances.filter(e => e.stade || e.pourcentage)),
    transporteur:            document.getElementById('af-transporteur').value.trim(),
    contact_transport:       document.getElementById('af-contact-transport').value.trim(),
    prix_transport:          document.getElementById('af-prix-transport').value.trim(),
    num_suivi_transport:     document.getElementById('af-num-suivi-transport').value.trim(),
    instructions_transport:  document.getElementById('af-instructions-transport').value.trim(),
    conditions_reglement:    document.getElementById('af-conditions-reglement')?.value.trim() || '',
    garanties:               document.getElementById('af-garanties')?.value.trim() || '',
    interlocuteurs_client:   JSON.stringify(_interlocuteurs.filter(it => it.nom || it.email)),
  };
  if(!body.nom_projet) { toast('Le nom du projet est requis','warning'); return; }
  const btn = document.querySelector('.modal-footer .btn-primary');
  btn.disabled = true; btn.textContent = '…';
  try {
    if(id) {
      const updated = await PUT(`/affaires/${id}`, body);
      state.currentAffaire = updated;
      const idx = state.affaires.findIndex(a => a.id === id);
      if(idx>=0) state.affaires[idx] = {...state.affaires[idx], ...updated};
      toast('Affaire mise à jour','success');
    } else {
      const created = await POST('/affaires', body);
      state.affaires.unshift(created);
      toast('Affaire créée','success');
      state.currentId = created.id;
    }
    document.querySelector('.modal-overlay')?.remove();
    renderNav();
    if(id) renderAffaireDetail();
    else await loadAffaire(state.currentId);
  } catch(e) {
    toast(e.message,'error');
    btn.disabled = false; btn.textContent = 'Enregistrer';
  }
}

async function deleteAffaire() {
  document.querySelector('.modal-overlay')?.remove();
  const ok = await confirm('Supprimer cette affaire ?','Tous les chapitres associés seront supprimés. Cette action est irréversible.');
  if(!ok) return;
  try {
    await DEL(`/affaires/${state.currentAffaire.id}`);
    state.affaires = state.affaires.filter(a => a.id !== state.currentAffaire.id);
    state.currentAffaire = null;
    state.currentId = null;
    showAffaireList();
    toast('Affaire supprimée','success');
  } catch(e) { toast(e.message,'error'); }
}

async function downloadAffairePdf(pdfType = 'complet') {
  const a = state.currentAffaire;
  if (!a) return;
  const btn = document.querySelector(`[onclick="downloadAffairePdf('${pdfType}')"]`);
  const origText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '⏳ PDF…'; }
  try {
    const resp = await fetch(`${API_BASE}/affaires/${a.id}/pdf?pdf_type=${encodeURIComponent(pdfType)}`);
    if (!resp.ok) {
      const txt = await resp.text();
      throw new Error(txt || resp.statusText);
    }
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    const suffix = pdfType === 'technique' ? '_TECHNIQUE' : '';
    link.download = `Affaire_${a.num_affaire.replace(/\//g,'-')}${suffix}.pdf`;
    link.click();
    URL.revokeObjectURL(url);
    toast('PDF téléchargé', 'success');
  } catch(e) {
    toast('Erreur PDF : ' + e.message, 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = origText; }
  }
}

async function generateBonFacturation(affaireId, echelonIdx) {
  const a = state.currentAffaire;
  if (!a) return;
  const btnIds = [`bon-hdr-${affaireId}-${echelonIdx}`, `bon-dash-${affaireId}-${echelonIdx}`];
  const origHtml = {};
  btnIds.forEach(id => { const b = document.getElementById(id); if(b){ origHtml[id]=b.innerHTML; b.disabled=true; b.textContent='⏳'; } });
  try {
    const resp = await fetch(`${API_BASE}/affaires/${affaireId}/echeances/${echelonIdx}/bon-facturation`);
    if (!resp.ok) { const txt = await resp.text(); throw new Error(txt); }
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    let echeances = [];
    try { echeances = JSON.parse(a.echeances_facturation || '[]'); } catch(_) {}
    const ech = echeances[echelonIdx];
    const stadeLabel = (ech?.stade || `echelon-${echelonIdx+1}`).replace(/[\s\/]+/g,'_');
    link.download = `BonFacturation_${a.num_affaire.replace(/\//g,'-')}_${stadeLabel}.pdf`;
    link.click();
    URL.revokeObjectURL(url);
    // Marquer bon_genere (première génération uniquement) et sauvegarder
    if (ech && !ech.bon_genere) {
      const today = new Date().toLocaleDateString('fr-FR');
      echeances[echelonIdx] = { ...ech, bon_genere: today };
      const updated = await PUT(`/affaires/${affaireId}`, { echeances_facturation: JSON.stringify(echeances) });
      state.currentAffaire = { ...a, ...updated };
      const idx = state.affaires.findIndex(x => x.id === affaireId);
      if (idx >= 0) state.affaires[idx] = { ...state.affaires[idx], ...updated };
      renderAffaireDetail();
    } else {
      btnIds.forEach(id => { const b = document.getElementById(id); if(b){ b.disabled=false; b.innerHTML=origHtml[id]; } });
    }
    toast('Bon de facturation téléchargé', 'success');
  } catch(e) {
    toast('Erreur : ' + e.message, 'error');
    btnIds.forEach(id => { const b = document.getElementById(id); if(b){ b.disabled=false; b.innerHTML=origHtml[id] || 'Bon'; } });
  }
}

async function showAchatsGlobal(affaireIdFilter) {
  state.view = 'achats';
  state.currentId = null;
  state.achatsFilterAffaireId = affaireIdFilter || null;
  state.bcPage = 1;
  renderNav();
  document.getElementById('topbar-title').textContent = 'Achats — Bons de commande';
  document.getElementById('topbar-actions').innerHTML =
    `<button class="topbar-btn primary" onclick="openBcModal(null)">+ Nouveau bon de commande</button>`;
  document.getElementById('content').innerHTML =
    '<div style="padding:60px;text-align:center"><div class="spinner spinner-dark"></div></div>';
  await reloadBonsCommande();
}

async function reloadBonsCommande() {
  try {
    const params = new URLSearchParams();
    if (state.achatsFilterAffaireId) params.set('affaire_id', state.achatsFilterAffaireId);
    if (state.bcFilter !== 'all') params.set('statut', state.bcFilter);
    if (state.bcSearch) params.set('search', state.bcSearch);
    state.bonsCommande = await GET(`/bons-commande?${params}`);
    state.bcListData = [...state.bonsCommande];
    sortBcListData();
    renderBcTablePage();
  } catch(e) {
    document.getElementById('content').innerHTML =
      `<div class="empty-state"><div class="icon">⚠️</div><h3>Erreur</h3><p>${escHtml(e.message)}</p></div>`;
  }
}

function sortBcListData() {
  const col = state.bcSortCol;
  const dir = state.bcSortDir === 'asc' ? 1 : -1;
  state.bcListData.sort((a, b) => {
    let av = a[col], bv = b[col];
    if (typeof av === 'number' || typeof bv === 'number') {
      return ((av||0) - (bv||0)) * dir;
    }
    av = (av || '').toString().toLowerCase();
    bv = (bv || '').toString().toLowerCase();
    return av < bv ? -dir : av > bv ? dir : 0;
  });
}

function renderBcTablePage() {
  const data    = state.bcListData;
  const total   = data.length;
  const page    = state.bcPage;
  const size    = state.bcPageSize;
  const start   = (page - 1) * size;

  const totalHt = data.reduce((s,b) => s + (b.total_ht||0), 0);

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:6px 12px;font-size:13px">
      <span>Filtré sur une affaire</span>
      <button class="btn btn-ghost btn-xs" onclick="showAchatsGlobal(null)">✕ Retirer le filtre</button>
    </div>` : '';

  document.getElementById('content').innerHTML = `
  ${filterChip}
  <div class="list-toolbar">
    <div class="list-search-wrap">
      <span class="list-search-icon">🔍</span>
      <input type="text" value="${escHtml(state.bcSearch)}"
        placeholder="N° bon, fournisseur…"
        oninput="debounceBcSearch(this.value)" autofocus>

function renderBcPagination(total, page, size) {
  if (total <= size) return '';
  const totalPages = Math.ceil(total / size);
  const s = (page-1)*size + 1, e = Math.min(page*size, total);
  const pages = [];
  if (totalPages <= 7) {
    for (let i=1; i<=totalPages; i++) pages.push(i);
  } else {
    pages.push(1);
    if (page > 3) pages.push('…');
    for (let i=Math.max(2,page-1); i<=Math.min(totalPages-1,page+1); i++) pages.push(i);
    if (page < totalPages-2) pages.push('…');
    pages.push(totalPages);
  }
  return `<div class="pagination">
    <div class="pagination-info">
      <span>${s}–${e} sur <strong>${total}</strong> bon${total>1?'s':''} de commande</span>
      <select class="page-size-sel" onchange="setBcPageSize(+this.value)">
        ${[10,25,50,100].map(n=>`<option ${n===size?'selected':''}>${n}</option>`).join('')}
      </select>
      <span>/ page</span>
    </div>
    <div class="pagination-btns">
      <button class="page-btn" ${page===1?'disabled':''} onclick="goBcPage(${page-1})">‹</button>
      ${pages.map(p=>p==='…'
        ? '<span style="padding:0 4px;color:var(--text-muted)">…</span>'
        : `<button class="page-btn ${p===page?'active':''}" onclick="goBcPage(${p})">${p}</button>`
      ).join('')}
      <button class="page-btn" ${page===totalPages?'disabled':''} onclick="goBcPage(${page+1})">›</button>
    </div>
  </div>`;
}

let _bcAffaireTimer = null;
function onBcAffaireInput(val) {
  clearTimeout(_bcAffaireTimer);
  const box = document.getElementById('bc-affaire-results');
  if (!val || val.length < 2) { if (box) box.style.display = 'none'; return; }
  _bcAffaireTimer = setTimeout(async () => {
    try {
      const results = await GET(`/affaires?search=${encodeURIComponent(val)}`);
      if (!box) return;
      if (!results.length) { box.style.display = 'none'; return; }
      box.innerHTML = results.slice(0, 15).map(a => `
        <div style="padding:6px 10px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--border)"
          onmousedown="pickBcAffaire('${a.id}', '${escHtml(a.num_affaire).replace(/'/g,"\\'")}', '${escHtml(a.nom_projet||'').replace(/'/g,"\\'")}')">
          <strong>${escHtml(a.num_affaire)}</strong>${a.nom_projet ? ' — '+escHtml(a.nom_projet) : ''}
        </div>`).join('');
      box.style.display = 'block';
    } catch(e) { /* recherche best-effort, ignore les erreurs réseau */ }
  }, 250);
}
function pickBcAffaire(id, num, nom) {
  _bcAffaireId = id;
  _bcAffaireLabel = num + (nom ? ' — ' + nom : '');
  const results = document.getElementById('bc-affaire-results');
  if (results) results.style.display = 'none';
  document.getElementById('bc-affaire-search-wrap').style.display = 'none';
  document.getElementById('bc-affaire-picked-label').textContent = _bcAffaireLabel;
  document.getElementById('bc-affaire-picked').style.display = 'flex';
}
function clearBcAffaire() {
  _bcAffaireId = null;
  _bcAffaireLabel = '';
  document.getElementById('bc-affaire-picked').style.display = 'none';
  document.getElementById('bc-affaire-search-wrap').style.display = 'block';
  const input = document.getElementById('bc-affaire-search');
  if (input) { input.value = ''; input.focus(); }
}

function renderBcLignes() {

  if (!list) return;
  list.innerHTML = _bcLignes.map((l, i) => `
    <div style="background:var(--gray-bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;display:grid;grid-template-columns:1.1fr 1.6fr .6fr .9fr .9fr auto;gap:6px;align-items:start;position:relative">
      <div style="position:relative">
        <input class="form-control" style="font-size:13px" placeholder="Référence" autocomplete="off"
          value="${escHtml(l.reference||'')}"
          oninput="onBcRefInput(${i}, this.value)" onblur="setTimeout(()=>hideBcRefResults(${i}),150)">
        <div id="bc-ref-results-${i}" class="search-results" style="display:none;position:absolute;z-index:20;background:var(--surface);border:1px solid var(--border);border-radius:6px;width:100%;max-height:160px;overflow-y:auto"></div>
      </div>
      <input class="form-control" style="font-size:13px" placeholder="Désignation"
        value="${escHtml(l.libelle||'')}" oninput="_bcLignes[${i}].libelle=this.value">
      <input class="form-control" style="font-size:13px" type="number" min="0" step="1" placeholder="Qté"
        value="${l.quantite ?? 1}" oninput="_bcLignes[${i}].quantite=this.value;updateBcLigneRow(${i})">
      <div style="position:relative">
        <input class="form-control no-spinner" style="font-size:13px;padding-right:22px" type="number" min="0" step="0.01" placeholder="PU HT"
          value="${l.prix_unitaire ?? 0}" oninput="_bcLignes[${i}].prix_unitaire=this.value;updateBcLigneRow(${i})">
        <span style="position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text-muted);pointer-events:none">€</span>
      </div>
      <div id="bc-ligne-montant-${i}" style="font-size:13px;text-align:right;font-weight:600;padding:7px 4px">${fmtEur((parseFloat(l.quantite)||0) * (parseFloat(l.prix_unitaire)||0))}</div>

    </div>`).join('');
  updateBcLignesTotal();

function updateBcLigneRow(i) {
  // Met à jour uniquement le montant de la ligne (pas de re-render complet,
  // qui ferait perdre le focus/curseur en cours de saisie dans le champ prix ou quantité).
  const l = _bcLignes[i];
  const montantEl = document.getElementById(`bc-ligne-montant-${i}`);
  if (montantEl && l) {
    montantEl.textContent = fmtEur((parseFloat(l.quantite)||0) * (parseFloat(l.prix_unitaire)||0));
  }
  updateBcLignesTotal();
}

let _bcRefTimers = {};
function onBcRefInput(i, val) {
  _bcLignes[i].reference = val;
  _bcLignes[i].piece_id = null;
  clearTimeout(_bcRefTimers[i]);
  if (!val || val.length < 2) { hideBcRefResults(i); return; }
  _bcRefTimers[i] = setTimeout(async () => {
    try {
      const results = await GET(`/pieces?search=${encodeURIComponent(val)}&ref_only=true&limit=15`);
      const box = document.getElementById(`bc-ref-results-${i}`);
      if (!box) return;
      if (!results.length) { box.style.display = 'none'; return; }
      box.innerHTML = results.map(p => `
        <div style="padding:6px 10px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--border)"
          onmousedown="pickBcPiece(${i}, '${p.id}', '${escHtml(p.reference).replace(/'/g,"\\'")}', '${escHtml(p.libelle||'').replace(/'/g,"\\'")}', ${p.prix_achat||0})">
          <strong>${escHtml(p.reference)}</strong>${p.libelle ? ' — '+escHtml(p.libelle) : ''}
        </div>`).join('');
      box.style.display = 'block';
    } catch(e) { /* recherche best-effort, ignore les erreurs réseau */ }
  }, 250);
}
function hideBcRefResults(i) {
  const box = document.getElementById(`bc-ref-results-${i}`);
  if (box) box.style.display = 'none';
}
function pickBcPiece(i, pieceId, reference, libelle, prixAchat) {
  _bcLignes[i].piece_id = pieceId;
  _bcLignes[i].reference = reference;
  _bcLignes[i].libelle = libelle;
  _bcLignes[i].prix_unitaire = prixAchat;
  hideBcRefResults(i);
  renderBcLignes();
}

function addBcLigne() {
  _bcLignes.push({ piece_id: null, reference: '', libelle: '', quantite: 1, prix_unitaire: 0, ordre: _bcLignes.length });
  renderBcLignes();
  const inputs = document.querySelectorAll('#bc-lignes-list > div:last-child input');
  if (inputs[0]) inputs[0].focus();
}
function removeBcLigne(i) {
  _bcLignes.splice(i, 1);
  renderBcLignes();
}
function updateBcLignesTotal() {
  const totalEl = document.getElementById('bc-lignes-total');
  if (!totalEl) return;
  if (!_bcLignes.length) { totalEl.style.display = 'none'; return; }
  const exo = document.getElementById('bc-exonere-tva')?.checked;
  const totalHt = _bcLignes.reduce((s,l) => s + (parseFloat(l.quantite)||0) * (parseFloat(l.prix_unitaire)||0), 0);
  const tva = exo ? 0 : totalHt * 0.20;
  const ttc = totalHt + tva;
  totalEl.style.display = 'flex';
  totalEl.innerHTML = `
    <span>Total HT : <strong>${fmtEur(totalHt)}</strong></span>
    ${!exo ? `<span>TVA 20% : <strong>${fmtEur(tva)}</strong></span>` : ''}
    <span style="color:var(--primary)">Total ${exo?'HT (exonéré)':'TTC'} : <strong>${fmtEur(ttc)}</strong></span>
  `;
}

async function saveBonCommande(bcId) {
  const body = {
    affaire_id:            _bcAffaireId || null,
    fournisseur_nom:       document.getElementById('bc-fournisseur-nom').value.trim(),
    fournisseur_adresse:   document.getElementById('bc-fournisseur-adresse').value.trim(),
    fournisseur_contact:   document.getElementById('bc-fournisseur-contact').value.trim(),
    fournisseur_email:     document.getElementById('bc-fournisseur-email').value.trim(),
    fournisseur_tel:       document.getElementById('bc-fournisseur-tel').value.trim(),
    date_commande:         fromInputDate(document.getElementById('bc-date-commande').value),
    date_livraison_prevue: fromInputDate(document.getElementById('bc-date-livraison').value),
    date_livraison_reelle: fromInputDate(document.getElementById('bc-date-livraison-reelle').value),
    date_reglement:        fromInputDate(document.getElementById('bc-date-reglement').value),
    statut:                document.getElementById('bc-statut').value,
    conditions:            document.getElementById('bc-conditions').value.trim(),
    notes:                 document.getElementById('bc-notes').value.trim(),
    exonere_tva:           document.getElementById('bc-exonere-tva').checked ? 1 : 0,
    lignes: _bcLignes
      .filter(l => l.reference || l.libelle || l.quantite || l.prix_unitaire)
      .map((l, i) => ({
        piece_id: l.piece_id || null,
        reference: l.reference || '',
        libelle: l.libelle || '',
        quantite: parseFloat(l.quantite) || 0,
        prix_unitaire: parseFloat(l.prix_unitaire) || 0,
        ordre: i,
      })),
  };
  const btn = document.querySelector('.modal-footer .btn-primary');
  btn.disabled = true; btn.textContent = '…';
  try {
    if (bcId) {
      await PUT(`/bons-commande/${bcId}`, body);
      toast('Bon de commande mis à jour', 'success');
    } else {
      await POST('/bons-commande', body);
      toast('Bon de commande créé', 'success');
    }
    document.querySelector('.modal-overlay')?.remove();
    await reloadBonsCommande();
  } catch(e) {
    toast(e.message, 'error');
    btn.disabled = false; btn.textContent = 'Enregistrer';
  }
}

async function deleteBonCommande(bcId) {
  const ok = await confirm('Supprimer ce bon de commande ?', 'Cette action est irréversible.');
  if (!ok) return;
  try {
    await DEL(`/bons-commande/${bcId}`);
    toast('Bon de commande supprimé', 'success');
    await reloadBonsCommande();
  } catch(e) { toast(e.message, 'error'); }
}

async function generateBonCommandePdf(bcId) {
  const btn = document.querySelector(`[onclick="generateBonCommandePdf('${bcId}')"]`);
  const origText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '⏳'; }
  try {
    const resp = await fetch(`${API_BASE}/bons-commande/${bcId}/pdf`);
    if (!resp.ok) { const txt = await resp.text(); throw new Error(txt); }
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const bc = state.bonsCommande.find(b => b.id === bcId);
    const link = document.createElement('a');
    link.href = url;
    link.download = `BC_${(bc?.num_bc||'bon').replace(/\//g,'-')}.pdf`;
    link.click();
    URL.revokeObjectURL(url);
    toast('PDF téléchargé', 'success');
    await reloadBonsCommande();
  } catch(e) {
    toast('Erreur PDF : ' + e.message, 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = origText; }
  }
}

/* Migration unique (par navigateur) des anciens modèles de chapitres stockés
   en localStorage vers la base de données, introduits avant que ces
   réglages soient persistés côté serveur. Ne s'exécute que si la base est
   encore vide, pour ne jamais écraser des modèles déjà enregistrés par un
   autre poste. */
async function _migrerModelesChapitreVersBase() {
  if (localStorage.getItem('ems_tpl_migrated_to_db')) return;
  try {
    const oldTemplates   = JSON.parse(localStorage.getItem('ems_type_templates') || '{}');
    const oldLocked      = localStorage.getItem('ems_tpl_locked') === '1';
    const oldCustomTypes = JSON.parse(localStorage.getItem('ems_chapter_types') || '[]');
    const oldOrder       = JSON.parse(localStorage.getItem('ems_chapter_order') || '[]');
    const hasOldData = Object.keys(oldTemplates).length || oldCustomTypes.length || oldOrder.length || oldLocked;
    const dbIsEmpty  = !Object.keys(state.chapterTemplates).length && !state.chapterCustomTypes.length
                       && !state.chapterTypesOrder.length && !state.chapterTemplatesLocked;
    if (hasOldData && dbIsEmpty) {
      await Promise.all(Object.entries(oldTemplates).map(([t, fields]) =>
        PUT(`/modeles-chapitre/${encodeURIComponent(t)}`, { fields })));
      await PUT('/modeles-chapitre/config', { locked: oldLocked, custom_types: oldCustomTypes, order: oldOrder });
      state.chapterTemplates       = oldTemplates;
      state.chapterTemplatesLocked = oldLocked;
      state.chapterCustomTypes     = oldCustomTypes;
      state.chapterTypesOrder      = oldOrder;
      toast('Modèles de chapitres migrés vers la base de données', 'success');
    }
  } catch(e) { /* migration best-effort, ne bloque pas le chargement */ }
  localStorage.setItem('ems_tpl_migrated_to_db', '1');
}

    const isCustomized = !!_tplWorkingTypes[t];

        + ' onclick="event.stopPropagation();_tplActionBtn(this)">▲</button>';

        + ' title="Descendre" style="font-size:11px;padding:1px 3px;opacity:0' + (i === total - 1 ? ';visibility:hidden' : '') + '"'
        + ' onclick="event.stopPropagation();_tplActionBtn(this)">▼</button>';

function _tplActionBtn(btn) {
  const idx = parseInt(btn.dataset.idx, 10);
  const list = document.getElementById('tpl-type-list');
  const typeName = list && list._typeIndex ? list._typeIndex[idx] : null;
  if (typeName == null) return;

  else if (btn.dataset.action === 'delete') _tplDeleteUserType(typeName);

function _initRowDrag(containerId) {
  const c = document.getElementById(containerId);
  if (!c || c._dragInit) return;
  c._dragInit = true;
  let src = null;
  c.addEventListener('dragstart', e => {
    const row = e.target.closest('.tpl-field-row');
    if (!row) { e.preventDefault(); return; }
    src = row;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => src && src.classList.add('drag-fading'), 0);
  });
  c.addEventListener('dragend', () => {
    if (src) src.classList.remove('drag-fading');
    c.querySelectorAll('.drag-over').forEach(r => r.classList.remove('drag-over'));
    src = null;
  });
  c.addEventListener('dragover', e => {
    e.preventDefault();
    const row = e.target.closest('.tpl-field-row');
    c.querySelectorAll('.drag-over').forEach(r => r.classList.remove('drag-over'));
    if (row && row !== src) row.classList.add('drag-over');
  });
  c.addEventListener('drop', e => {
    e.preventDefault();
    const tgt = e.target.closest('.tpl-field-row');
    if (!tgt || tgt === src || !src) return;
    const rows = [...c.querySelectorAll('.tpl-field-row')];
    if (rows.indexOf(src) > rows.indexOf(tgt)) tgt.before(src);
    else tgt.after(src);
    tgt.classList.remove('drag-over');
  });
}

function _tplFieldRowHtml(libelle, valeur, unite, style) {

    + '<option value="select"'   + (st === 'select'   ? ' selected' : '') + '>Liste</option>'
    + '<option value="document"' + (st === 'document' ? ' selected' : '') + '>Document</option>'
    + '</select>';
  const optsHtml = showOpts
    ? buildOptsEditor(unite || '', 'details-unit')
    : '<input class="details-unit" placeholder="Unité" value="' + escHtml(unite || '') + '" style="flex:none;width:70px' + (showValUnit ? '' : ';display:none') + '">';
  return '<div class="details-row tpl-field-row" data-field-style="' + st + '" draggable="true"'
    + ' style="margin-bottom:8px;align-items:' + (showOpts ? 'flex-start' : 'center') + '">'
    + '<span class="tpl-drag-handle" title="Glisser pour réordonner" style="margin-top:' + (showOpts ? '6px' : '0') + '">⠿</span>'
    + styleSelect
    + '<input class="details-key" placeholder="Libellé" value="' + escHtml(libelle || '') + '" style="flex:2;min-width:80px;align-self:flex-start;margin-top:' + (showOpts ? '4px' : '0') + '">'
    + '<input class="details-val" placeholder="Valeur par défaut" value="' + escHtml(valeur || '') + '" style="flex:2;min-width:80px' + (showValUnit ? '' : ';display:none') + '">'
    + optsHtml
    + '<button class="btn-rm-detail" onclick="this.closest(\'.tpl-field-row\').remove()" style="align-self:flex-start;margin-top:' + (showOpts ? '4px' : '0') + '">✕</button>'
    + '</div>';
}

function _tplChangeStyle(sel) {
  const row = sel.closest('.tpl-field-row');
  if (!row) return;
  const newSt  = sel.value;
  const libelle = row.querySelector('.details-key')?.value?.trim() || '';
  // Reconstruire la ligne entière (tag editor a une structure trop différente de simple input)
  const tmp = document.createElement('div');
  tmp.innerHTML = _tplFieldRowHtml(libelle, '', '', newSt);
  const newRow = tmp.firstElementChild;
  row.replaceWith(newRow);
  _initRowDrag('tpl-field-list');
  newRow.querySelector('.details-key')?.focus();
}

function _tplRenderFieldEditor(fields) {
  const el = document.getElementById('tpl-field-list');
  if (!el) return;
  if (!fields.length) {
    el.innerHTML = '<div style="color:var(--text-muted);font-size:13px;margin-top:12px">Aucun champ'
      + (_tplLocked ? '.' : ' — cliquez « + Champ » pour ajouter.') + '</div>';
    return;
  }
  if (_tplLocked) {
    el.innerHTML = '<div style="display:flex;flex-direction:column;gap:5px;padding:2px 0">'
      + fields.map(f => {
          return '<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--gray-bg);border-radius:5px;font-size:13px">'
            + '<span style="color:var(--text-muted);min-width:110px;flex-shrink:0;font-size:12px;font-weight:500">' + escHtml(f.libelle||'—') + '</span>'
            + (f.valeur ? '<span style="color:var(--text);font-size:12px">' + escHtml(f.valeur)
                + (f.unite ? ' <span style="color:var(--text-muted)">'+escHtml(f.unite)+'</span>' : '')
                + '</span>' : '')
            + '</div>';
        }).join('')
      + '</div>';
    return;
  }
  el.innerHTML = fields.map(f => _tplFieldRowHtml(f.libelle, f.valeur, f.unite, f.style || f.type || 'text')).join('');
  _initRowDrag('tpl-field-list');
}

function _tplAddField(type) {
  if (_tplLocked) return;
  const el = document.getElementById('tpl-field-list');
  if (!el) return;
  if (!el.querySelector('.tpl-field-row')) el.innerHTML = '';
  el.insertAdjacentHTML('beforeend', _tplFieldRowHtml('', '', '', type || 'aux'));
  const rows = el.querySelectorAll('.tpl-field-row');
  rows[rows.length - 1]?.querySelector('.details-key')?.focus();
  _initRowDrag('tpl-field-list');
}

async function _tplSaveType() {
  if (_tplLocked || !_tplSelected) return;
  const rows = document.querySelectorAll('#tpl-field-list .tpl-field-row');
  const fields = [];
  rows.forEach(row => {
    const l  = row.querySelector('.details-key')?.value?.trim() || '';
    const st = row.dataset.fieldStyle || 'text';
    if (l) {
      const field = {style: st, libelle: l, valeur: '', unite: ''};
      if (st === 'measure') {
        field.valeur = row.querySelector('.details-val')?.value?.trim()  || '';
        field.unite  = row.querySelector('.details-unit')?.value?.trim() || '';
      } else if (st === 'select') {
        // Lire depuis le hidden input du tag editor
        field.unite = row.querySelector('.details-unit')?.value?.trim() || '';
      }
      fields.push(field);
    }
  });
  _tplWorkingTypes[_tplSelected] = fields;
  try {
    await PUT(`/modeles-chapitre/${encodeURIComponent(_tplSelected)}`, { fields });
  } catch(e) { toast('Erreur sauvegarde modèle : ' + e.message, 'error'); return; }
  state.chapterTemplates[_tplSelected] = fields;
  // Refresh display
  _tplRenderTypeList();
  _tplSelectType(_tplSelected);
  toast('Modèle "' + _tplSelected + '" enregistré', 'success');
}

async function _tplNewType() {
  if (_tplLocked) return;
  const name = window.prompt('Nom du nouveau type / catégorie :');
  if (!name || !name.trim()) return;
  const typeName = name.trim();
  if (!_tplWorkingTypes[typeName]) _tplWorkingTypes[typeName] = [];
  try {
    await PUT(`/modeles-chapitre/${encodeURIComponent(typeName)}`, { fields: _tplWorkingTypes[typeName] });
  } catch(e) { toast('Erreur création type : ' + e.message, 'error'); return; }
  state.chapterTemplates[typeName] = _tplWorkingTypes[typeName];
  await saveCustomType(typeName);
  // Ajouter à la fin de l'ordre global
  const order = getTypeOrder();
  if (!order.includes(typeName)) { order.push(typeName); await saveTypeOrder(order); }
  _tplRenderTypeList();
  _tplSelectType(typeName);
}

async function _tplResetType(typeName) {
  delete _tplWorkingTypes[typeName];
  try { await DEL(`/modeles-chapitre/${encodeURIComponent(typeName)}`); }
  catch(e) { toast('Erreur réinitialisation : ' + e.message, 'error'); return; }
  delete state.chapterTemplates[typeName];
  _tplRenderTypeList();
  _tplSelectType(typeName);
  toast('Modèle "' + typeName + '" réinitialisé au défaut', 'info');
}

async function _tplDeleteUserType(typeName) {
  if (_tplLocked) return;
  if (!window.confirm('Supprimer définitivement le type "' + typeName + '" ?')) return;
  delete _tplWorkingTypes[typeName];
  try { await DEL(`/modeles-chapitre/${encodeURIComponent(typeName)}`); }
  catch(e) { toast('Erreur suppression : ' + e.message, 'error'); return; }
  delete state.chapterTemplates[typeName];
  const ct = getCustomTypes().filter(t => t !== typeName);
  state.chapterCustomTypes = ct;
  await PUT('/modeles-chapitre/config', { custom_types: ct });
  // Retirer de l'ordre global
  await saveTypeOrder(getTypeOrder().filter(t => t !== typeName));
  if (_tplSelected === typeName) {
    _tplSelected = null;
    const header = document.getElementById('tpl-right-header');
    const fieldList = document.getElementById('tpl-field-list');
    const footer = document.getElementById('tpl-footer');
    if (header) header.innerHTML = '<span style="color:var(--text-muted);font-size:13px">← Sélectionnez un type pour éditer ses champs</span>';
    if (fieldList) fieldList.innerHTML = '';
    if (footer) footer.style.display = 'none';
  }
  _tplRenderTypeList();
  toast('Type "' + typeName + '" supprimé', 'info');
}

async function _tplRenameType(oldName) {
  if (_tplLocked) return;
  const newName = window.prompt('Nouveau nom pour "' + oldName + '" :', oldName);
  if (!newName || !newName.trim() || newName.trim() === oldName) return;
  const name = newName.trim();
  try {
    if (_tplWorkingTypes[oldName]) {
      _tplWorkingTypes[name] = _tplWorkingTypes[oldName];
      delete _tplWorkingTypes[oldName];
      await PUT(`/modeles-chapitre/${encodeURIComponent(name)}`, { fields: _tplWorkingTypes[name] });
      await DEL(`/modeles-chapitre/${encodeURIComponent(oldName)}`);
      state.chapterTemplates[name] = _tplWorkingTypes[name];
      delete state.chapterTemplates[oldName];
    }
    const ct = getCustomTypes().slice();
    const idx = ct.indexOf(oldName);
    if (idx >= 0) ct[idx] = name; else ct.push(name);
    state.chapterCustomTypes = ct;
    await PUT('/modeles-chapitre/config', { custom_types: ct });
    // Renommer dans l'ordre global
    const order = getTypeOrder();
    const oi = order.indexOf(oldName);
    if (oi >= 0) order[oi] = name; else order.push(name);
    await saveTypeOrder(order);
  } catch(e) { toast('Erreur renommage : ' + e.message, 'error'); return; }
  if (_tplSelected === oldName) _tplSelected = name;
  _tplRenderTypeList();
  if (_tplSelected === name) _tplSelectType(name);
  toast('Type renommé : "' + name + '"', 'success');
}

async function _tplMoveType(typeName, dir) {
  if (_tplLocked) return;
  try {
    const all = getAllTypes();
    const idx = all.indexOf(typeName);
    if (idx < 0) return;
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= all.length) return;
    [all[idx], all[newIdx]] = [all[newIdx], all[idx]];
    await saveTypeOrder(all);
    _tplRenderTypeList();
    if (_tplSelected === typeName) _tplSelectType(typeName);
  } catch(e) {}
}

async function _tplCreateType() {
  if (_tplLocked) return;
  const input = document.getElementById('tpl-new-type-input');
  if (!input) return;
  const typeName = input.value.trim();
  if (!typeName) { input.focus(); return; }
  if (!_tplWorkingTypes[typeName]) _tplWorkingTypes[typeName] = [];
  try {
    await PUT(`/modeles-chapitre/${encodeURIComponent(typeName)}`, { fields: _tplWorkingTypes[typeName] });
  } catch(e) { toast('Erreur création type : ' + e.message, 'error'); return; }
  state.chapterTemplates[typeName] = _tplWorkingTypes[typeName];
  await saveCustomType(typeName);
  const order = getTypeOrder();
  if (!order.includes(typeName)) { order.push(typeName); await saveTypeOrder(order); }
  input.value = '';
  _tplRenderTypeList();
  _tplSelectType(typeName);
}

async function _tplToggleLock() {
  if (_tplLocked) {
    const ok = window.confirm(
      'Déverrouiller les modèles de chapitres ?\n\n'
      + 'Cela permettra de modifier l\'ordre des types, leurs noms, leurs champs pré-remplis et d\'en créer de nouveaux.'
    );
    if (!ok) return;
    _tplLocked = false;
  } else {
    _tplLocked = true;
  }
  state.chapterTemplatesLocked = _tplLocked;
  try { await PUT('/modeles-chapitre/config', { locked: _tplLocked }); }
  catch(e) { toast('Erreur sauvegarde verrou : ' + e.message, 'error'); }
  // Mettre à jour tous les boutons cadenas présents dans la page
  document.querySelectorAll('.tpl-lock-btn').forEach(btn => {
    const isTopbar = btn.classList.contains('topbar-btn');
    btn.textContent = _tplLocked ? (isTopbar ? '🔒 Verrouillé' : '🔒') : (isTopbar ? '🔓 Déverrouillé' : '🔓');
    btn.title = _tplLocked ? 'Déverrouiller les modèles' : 'Verrouiller les modèles';
  });
  // Activer/désactiver l'input "nouveau type" (vue page complète)
  const newInput = document.getElementById('tpl-new-type-input');
  if (newInput) { newInput.disabled = _tplLocked; newInput.style.opacity = _tplLocked ? '.45' : '1'; }
  const createBtn = newInput?.nextElementSibling;
  if (createBtn) { createBtn.disabled = _tplLocked; createBtn.style.opacity = _tplLocked ? '.45' : '1'; }
  // Activer/désactiver le bouton "+" du modal
  document.querySelectorAll('.tpl-new-type-btn').forEach(btn => {
    btn.disabled = _tplLocked; btn.style.opacity = _tplLocked ? '.45' : '1';
  });
  _tplRenderTypeList();
  if (_tplSelected) _tplSelectType(_tplSelected);
}

/* ═══════════════════════════════════════════════
   ONGLET DOCUMENTS – ARBORESCENCE
═══════════════════════════════════════════════ */
let _docExpanded = new Set();

async function renderDocumentsTab() {
  const el = document.getElementById('tab-content');
  if (!el) return;
  const dossierPath = _toClientPath(state.currentAffaire?.dossier_path || '');
  el.innerHTML = `
    <div id="doc-zone">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">
        <span style="font-size:11px;color:var(--text-muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:monospace;min-width:0"
              title="${escHtml(dossierPath)}">${escHtml(dossierPath || '—')}</span>
        <button class="btn btn-secondary btn-xs no-print" onclick="openDossier()" title="Ouvrir dans l'explorateur Windows">Explorateur</button>
      </div>
      <div id="doc-tree-container" style="display:flex;flex-direction:column;gap:4px">
        <div style="color:var(--text-muted);font-size:13px;padding:20px;text-align:center">Chargement…</div>
      </div>
    </div>`;
  await docLoadTree();
}

async function docLoadTree(afterInit = false) {
  const id = state.currentId;
  const ct = document.getElementById('doc-tree-container');
  if (!ct || !id) return;
  try {
    const tree = await GET(`/affaires/${id}/folder-tree`);
    const isEmpty = !tree.folders.length && !tree.files.length;
    // Dossier absent côté serveur → une seule tentative de création côté client
    if (isEmpty && !afterInit && LOCAL_PORT) {
      ct.innerHTML = '<div style="color:var(--text-muted);font-size:13px;padding:20px;text-align:center">Initialisation du dossier…</div>';
      try {
        const info = await GET(`/affaires/${id}/ensure-dossier`);
        const clientPath = _toClientPath(info.path);
        if (clientPath) {
          await fetch('http://127.0.0.1:' + LOCAL_PORT + '/ensure-arborescence?path=' + encodeURIComponent(clientPath), {mode:'no-cors'});
        }
      } catch(_) {}
      setTimeout(() => docLoadTree(true), 600);
      return;
    }
    // Serveur ne lit pas O:\ même après création côté client
    if (isEmpty && afterInit) {
      ct.innerHTML = '<div style="font-size:13px;color:var(--text-muted);font-style:italic;padding:20px;text-align:center">Dossier initialisé — utilisez Explorateur pour y accéder.</div>';
      return;
    }
    // Seul le sous-dossier COMMERCIAL est affiché dans l'onglet Dossier
    // (les autres dossiers de l'arborescence standard restent créés sur le
    // disque mais ne sont pas montrés ici).
    tree.folders = (tree.folders || []).filter(f => f.name === 'COMMERCIAL');
    if (_docExpanded.size === 0) {
      for (const f of tree.folders) {
        _docExpanded.add(f.rel);
        for (const sub of f.folders) _docExpanded.add(sub.rel);
      }
    }
    ct.innerHTML = _docRenderChildren(tree, id, true);
  } catch(e) {
    ct.innerHTML = `<div style="color:var(--danger);font-size:13px;padding:12px">Erreur chargement: ${escHtml(e.message)}</div>`;
  }
}

function _docRenderChildren(node, id, isRoot) {
  const folders = (node.folders || []).map(f => _docFolderNode(f, id)).join('');
  const files = (node.files || []).map(f => _docFileRow(f, id)).join('');
  const content = folders + files;
  if (!content && isRoot) {
    return '<div style="font-size:13px;color:var(--text-muted);font-style:italic;padding:20px;text-align:center">Aucun document dans ce dossier</div>';
  }
  return content;
}

function _docFolderNode(folder, id) {
  const open = _docExpanded.has(folder.rel);
  const total = _docCountFiles(folder);
  const badge = total ? `<span style="font-size:11px;background:var(--gray-bg);padding:1px 7px;border-radius:10px;color:var(--text-muted);flex-shrink:0">${total}</span>` : '';
  const content = open
    ? `<div style="padding-left:18px;margin-top:3px">${_docRenderChildren(folder, id, false)}</div>`
    : '';
  return `
    <div style="margin-bottom:4px">
      <div class="doc-folder-drop" style="display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--surface);border:1px solid var(--border);border-radius:6px;cursor:pointer;user-select:none"
           onclick="docToggleFolder(${_qs(folder.rel)})"
           ondragover="event.preventDefault();event.stopPropagation();this.classList.add('drag-over')"
           ondragleave="event.stopPropagation();this.classList.remove('drag-over')"
           ondrop="docHandleDrop(event, ${_qs(folder.rel)})">
        <span style="font-size:10px;color:var(--text-muted);width:10px;flex-shrink:0">${open ? '▼' : '►'}</span>
        <span style="flex:1;font-size:13px;font-weight:600">${escHtml(folder.name)}</span>
        ${badge}
        <label class="btn btn-secondary btn-xs no-print" style="cursor:pointer;margin:0;flex-shrink:0" title="Ajouter des fichiers" onclick="event.stopPropagation()">
          Ajouter
          <input type="file" multiple style="display:none" onchange="docUploadToFolder(${_qs(folder.rel)}, this)">
        </label>
      </div>
      ${content}
    </div>`;
}

function _docFileRow(file, id) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const size = file.size > 1048576 ? (file.size/1048576).toFixed(1)+' Mo'
             : file.size > 1024 ? Math.round(file.size/1024)+' Ko'
             : file.size+' o';
  const d = new Date(file.modified*1000).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});
  const canView = ['pdf','png','jpg','jpeg','gif','bmp','webp','svg'].includes(ext);
  const viewBtn = canView
    ? `<button class="btn-icon" onclick="docViewFile(${_qs(file.rel)})" title="Ouvrir" style="font-size:14px">👁</button>`
    : '';
  return `
    <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);margin-bottom:3px">
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escHtml(file.name)}">${escHtml(file.name)}</div>
        <div style="font-size:11px;color:var(--text-muted)">${size} · ${d}</div>
      </div>
      ${viewBtn}
      <a href="${API_BASE}/affaires/${id}/file?rel=${encodeURIComponent(file.rel)}&dl=1"
         download="${escHtml(file.name)}" class="btn-icon" title="Télécharger" style="text-decoration:none;font-size:14px">⬇</a>
      <button class="btn-icon red no-print" style="font-size:12px"
              onclick="docDeleteFolderFile(${_qs(file.rel)},${_qs(file.name)})"
              title="Supprimer">✕</button>
    </div>`;
}

function _docCountFiles(folder) {
  let n = folder.files.length;
  for (const f of folder.folders) n += _docCountFiles(f);
  return n;
}

async function docToggleFolder(rel) {
  if (_docExpanded.has(rel)) _docExpanded.delete(rel);
  else _docExpanded.add(rel);
  await docLoadTree();
}

async function docUploadToFolder(folder, input) {
  const files = [...input.files];
  input.value = '';
  await _docUploadFiles(folder, files);
}

async function docHandleDrop(ev, folder) {
  ev.preventDefault();
  ev.stopPropagation();
  ev.currentTarget.classList.remove('drag-over');
  const files = [...(ev.dataTransfer?.files || [])];
  await _docUploadFiles(folder, files);
}

async function _docUploadFiles(folder, files) {
  if (!files.length) return;
  const id = state.currentId;
  let done = 0;
  for (const file of files) {
    try {
      const fd = new FormData();
      fd.append('file', file);
      fd.append('folder', folder);
      const r = await fetch(`${API_BASE}/affaires/${id}/folder-upload`, {method:'POST', body:fd});
      if (!r.ok) throw new Error(await r.text());
      done++;
    } catch(e) { toast('Erreur : ' + file.name + ' – ' + e.message, 'error'); }
  }
  if (done) {
    toast(done + ' fichier' + (done>1?'s':'') + ' ajouté' + (done>1?'s':''), 'success');
    if (folder) _docExpanded.add(folder);
    await docLoadTree();
  }
}

function docViewFile(rel) {
  window.open(`${API_BASE}/affaires/${state.currentId}/file?rel=${encodeURIComponent(rel)}`, '_blank');
}

async function docDeleteFolderFile(rel, name) {
  if (!window.confirm(`Supprimer "${name}" ?`)) return;
  try {
    const r = await fetch(`${API_BASE}/affaires/${state.currentId}/folder-file?rel=${encodeURIComponent(rel)}`, {method:'DELETE'});
    if (!r.ok && r.status !== 204) throw new Error(await r.text());
    toast('Fichier supprimé', 'success');
    await docLoadTree();
  } catch(e) { toast('Erreur suppression : ' + e.message, 'error'); }
}

async function openDossier() {
  if (!state.currentId) return;
  try {
    if (!LOCAL_PORT) { toast('Serveur local non disponible', 'error'); return; }
    const result = await GET(`/affaires/${state.currentId}/ensure-dossier`);
    const clientPath = _toClientPath(result.path);
    if (!clientPath) { toast('Impossible de déterminer le chemin du dossier', 'warning'); return; }
    if (state.currentAffaire) state.currentAffaire.dossier_path = result.path;
    // Création dossier + arborescence côté client (accès O:\ garanti)
    await fetch('http://127.0.0.1:' + LOCAL_PORT + '/open-folder?path=' + encodeURIComponent(clientPath), {mode:'no-cors'});
    toast('Dossier ouvert dans l\'explorateur', 'success', 2000);
  } catch(e) { toast('Impossible d\'ouvrir le dossier : ' + e.message, 'error'); }
}


/* ═══════════════════════════════════════════════
   TABLEAU BLANC
═══════════════════════════════════════════════ */
let _wbSaveTimer = null;

function renderWhiteboardTab() {
  const el = document.getElementById('tab-content');
  if (!el) return;
  const a = state.currentAffaire;
  const content = (a && a.whiteboard) ? a.whiteboard : '';

  el.innerHTML = `
<div id="wb-container">
  <div id="wb-toolbar" style="display:flex;flex-wrap:wrap;align-items:center;gap:3px;padding:6px 10px;background:var(--gray-bg);border:1px solid var(--border);border-radius:8px 8px 0 0;border-bottom:none">
    <button class="wb-btn" onclick="wbCmd('bold')" title="Gras (Ctrl+B)"><b>B</b></button>
    <button class="wb-btn" onclick="wbCmd('italic')" title="Italique (Ctrl+I)"><i>I</i></button>
    <button class="wb-btn" onclick="wbCmd('underline')" title="Souligné (Ctrl+U)"><u>U</u></button>
    <span style="width:1px;height:18px;background:var(--border);margin:0 4px;display:inline-block"></span>
    <button class="wb-btn" onclick="wbCmd('formatBlock','h2')" title="Titre">H1</button>
    <button class="wb-btn" onclick="wbCmd('formatBlock','h3')" title="Sous-titre">H2</button>
    <button class="wb-btn" onclick="wbCmd('formatBlock','p')" title="Paragraphe normal">¶</button>
    <span style="width:1px;height:18px;background:var(--border);margin:0 4px;display:inline-block"></span>
    <button class="wb-btn" onclick="wbCmd('insertUnorderedList')" title="Liste à puces">• liste</button>
    <button class="wb-btn" onclick="wbCmd('insertOrderedList')" title="Liste numérotée">1. liste</button>
    <span style="width:1px;height:18px;background:var(--border);margin:0 4px;display:inline-block"></span>
    <button class="wb-btn" onclick="wbInsertHR()" title="Trait séparateur">── ──</button>
    <button class="wb-btn" onclick="wbInsertImage()" title="Insérer une image depuis le disque">🖼 Image</button>
    <span style="flex:1"></span>
    <span id="wb-save-status" style="font-size:11px;color:var(--text-muted);padding:0 6px;white-space:nowrap"></span>
    <button class="wb-btn wb-btn-danger" onclick="wbClear()" title="Effacer tout">🗑</button>
  </div>
  <div id="wb-editor"
       contenteditable="true"
       spellcheck="true"
       style="min-height:460px;border:1px solid var(--border);border-radius:0 0 8px 8px;padding:18px 22px;font-size:14px;line-height:1.75;overflow-y:auto;background:var(--bg);outline:none;cursor:text;word-break:break-word"
  >${content || '<p><br></p>'}</div>
  <div style="font-size:11px;color:var(--text-muted);margin-top:6px;padding-left:2px">
    Coller des captures d'écran directement avec <kbd style="background:var(--gray-bg);border:1px solid var(--border);border-radius:3px;padding:0 4px">Ctrl+V</kbd> · Les modifications sont sauvegardées automatiquement.
  </div>
  <input type="file" id="wb-file-input" accept="image/*" style="display:none" onchange="wbHandleFileInput(this)">
</div>`;

  const editor = document.getElementById('wb-editor');
  if (!editor) return;
  editor.addEventListener('paste', wbHandlePaste);
  editor.addEventListener('input', wbScheduleSave);
  // Click sur image → sélectionner pour supprimer facilement
  editor.addEventListener('click', e => {
    if (e.target.tagName === 'IMG') {
      const sel = window.getSelection();
      const range = document.createRange();
      range.selectNode(e.target);
      sel.removeAllRanges();
      sel.addRange(range);
    }
  });
}

function wbCmd(cmd, val) {
  document.execCommand(cmd, false, val || null);
  document.getElementById('wb-editor')?.focus();
  wbScheduleSave();
}

function wbInsertHR() {
  document.execCommand('insertHTML', false,
    '<hr style="border:none;border-top:2px solid var(--border);margin:14px 0">');
  document.getElementById('wb-editor')?.focus();
  wbScheduleSave();
}

function wbInsertImage() {
  document.getElementById('wb-file-input')?.click();
}

function wbHandleFileInput(input) {
  const file = input.files[0];
  input.value = '';
  if (!file || !file.type.startsWith('image/')) return;
  wbEmbedBlob(file);
}

function wbHandlePaste(e) {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      wbEmbedBlob(item.getAsFile());
      return;
    }
  }
}

function wbEmbedBlob(blob) {
  if (!blob) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const editor = document.getElementById('wb-editor');
    if (!editor) return;
    editor.focus();
    document.execCommand('insertHTML', false,
      `<img src="${ev.target.result}" style="max-width:100%;border-radius:6px;margin:6px 0;display:block" alt="">`);
    wbScheduleSave();
  };
  reader.readAsDataURL(blob);
}

function wbClear() {
  if (!window.confirm('Effacer tout le contenu du tableau blanc ?')) return;
  const editor = document.getElementById('wb-editor');
  if (!editor) return;
  editor.innerHTML = '<p><br></p>';
  wbScheduleSave();
}

function wbScheduleSave() {
  const statusEl = document.getElementById('wb-save-status');
  if (statusEl) statusEl.textContent = 'Modification…';
  clearTimeout(_wbSaveTimer);
  _wbSaveTimer = setTimeout(wbSave, 1500);
}

async function wbSave() {
  if (!state.currentId) return;
  const editor = document.getElementById('wb-editor');
  if (!editor) return;
  const html = editor.innerHTML;
  const statusEl = document.getElementById('wb-save-status');
  if (statusEl) statusEl.textContent = 'Sauvegarde…';
  try {
    await PUT('/affaires/' + state.currentId, { whiteboard: html });
    if (state.currentAffaire) state.currentAffaire.whiteboard = html;
    if (statusEl) {
      statusEl.textContent = 'Enregistré ✓';
      setTimeout(() => { if (statusEl) statusEl.textContent = ''; }, 2500);
    }
  } catch(e) {
    if (statusEl) statusEl.textContent = '⚠ Erreur';
    toast('Erreur sauvegarde tableau blanc', 'error');
  }
}


</script>
</body>
</html>
