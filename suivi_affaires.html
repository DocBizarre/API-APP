const _seCache = {};

async function toggleSousEnsembles(moteurId) {
  const wrapper = document.getElementById(`moteur-wrapper-${moteurId}`);
  if (!wrapper) return;
  const wasCollapsed = wrapper.classList.contains('collapsed');
  wrapper.classList.toggle('collapsed');
  if (wasCollapsed) {
    await loadSousEnsembles(moteurId);
  }
}

async function loadSousEnsembles(moteurId) {
  const listEl = document.getElementById(`se-list-${moteurId}`);
  if (!listEl) return;
  try {
    const items = await GET(`/moteurs/${moteurId}/sous-ensembles`);
    _seCache[moteurId] = items;
    renderSousEnsemblesList(moteurId, items);
  } catch(e) {
    listEl.innerHTML = `<div style="font-size:12px;color:var(--danger)">Erreur chargement</div>`;
  }
}

function _seEtatClass(etat) {
  if (!etat) return 'se-etat-default';
  const e = etat.toLowerCase();
  if (e === 'neuf') return 'se-etat-neuf';
  if (e.startsWith('bon')) return 'se-etat-bon';
  if (e.startsWith('usag')) return 'se-etat-usage';
  if (e === 'hors service') return 'se-etat-hs';
  return 'se-etat-default';
}

function renderSousEnsemblesList(moteurId, items) {
  const listEl = document.getElementById(`se-list-${moteurId}`);
  if (!listEl) return;

  // Chapitres de l'affaire referençant ce moteur (par num_serie)
  const mObj = state.currentMoteurs.find(x => x.id === moteurId);
  const linkedChs = mObj
    ? state.currentItems.filter(it => it.num_serie && it.num_serie === mObj.num_serie)
    : [];
  const statCols = {'Terminé':'#059669','En cours':'#2563eb','À faire':'#9ca3af','NC':'#dc2626'};
  let chapSection = '';
  if (linkedChs.length) {
    chapSection = '<div style="margin-bottom:8px">'
      + '<div style="font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px">Chapitres affaire</div>'
      + linkedChs.map(ch => {
          const col = statCols[ch.statut] || '#9ca3af';
          return '<div class="se-item" style="background:#eff6ff;border-color:#bfdbfe;cursor:pointer"'
            + ` onclick="switchTab('chapitres');setTimeout(()=>{const el=document.getElementById('ch-${ch.id}');el?.scrollIntoView({behavior:'smooth'});el?.classList.add('open')},100)">`
            + `<span class="se-item-label">${escHtml(ch.libelle||ch.type_item||'—')}</span>`
            + `<span style="font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px;background:${col}22;color:${col};white-space:nowrap">${escHtml(ch.statut)}</span>`
            + '</div>';
        }).join('')
      + '</div>';
  }

  const seHtml = !items.length
    ? '<div style="font-size:12px;color:var(--text-muted);padding:4px 0;font-style:italic">Aucun sous-ensemble enregistré</div>'
    : items.map(se => `
    <div class="se-item">
      <div style="flex:1;min-width:0">
        <div class="se-item-label">${escHtml(se.libelle)}</div>
        ${se.type ? `<div style="font-size:11px;color:#2563eb;margin-top:2px">${escHtml(se.type)}</div>` : ''}
        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:3px">
          ${se.reference ? `<div class="se-item-meta">Réf: ${escHtml(se.reference)}</div>` : ''}
          ${se.marque ? `<div class="se-item-meta">${escHtml(se.marque)}</div>` : ''}
          ${se.num_serie ? `<div class="se-item-meta">SN: ${escHtml(se.num_serie)}</div>` : ''}
        </div>
      </div>
      ${se.etat ? `<span class="se-etat ${_seEtatClass(se.etat)}">${escHtml(se.etat)}</span>` : ''}
      <button class="btn-icon no-print" onclick="openSousEnsembleModal('${moteurId}', ${JSON.stringify(se).replace(/"/g,'&quot;')})" title="Modifier" style="font-size:13px;color:var(--text-muted)">✎</button>
      <button class="btn-icon red no-print" onclick="deleteSousEnsemble('${moteurId}','${se.id}')" title="Supprimer">✕</button>
    </div>`).join('');

  listEl.innerHTML = chapSection + seHtml;
}

    <div class="modal-body">

      </div>

        <div>
          <label class="form-label">N° Série</label>

        </div>

          <label class="form-label">État</label>
          <select class="form-control" id="se-etat">
            ${['','Neuf','Bon état','Usagé','Hors service'].map(v=>`<option ${(se?.etat||'')==v?'selected':''}>${v}</option>`).join('')}
          </select>

async function saveSousEnsemble(moteurId, seId) {
  const libelle = document.getElementById('se-libelle').value.trim();
  if (!libelle) { toast('Le libellé est obligatoire','error'); return; }
  const data = {
    libelle,
    type:      (() => { const v = document.getElementById('se-type').value; return v === '__new__' ? document.getElementById('se-type-custom').value.trim() : v; })(),
    reference: document.getElementById('se-reference').value.trim(),
    marque:    document.getElementById('se-marque').value.trim(),
    num_serie: document.getElementById('se-num-serie').value.trim(),
    etat:      document.getElementById('se-etat').value,
    notes:     document.getElementById('se-notes').value.trim(),
  };
  try {
    if (seId) {
      await PUT(`/moteurs/${moteurId}/sous-ensembles/${seId}`, data);
    } else {
      await POST(`/moteurs/${moteurId}/sous-ensembles`, data);
    }
    document.querySelector('.modal-overlay')?.remove();
    await loadSousEnsembles(moteurId);
    toast(seId ? 'Sous-ensemble modifié' : 'Sous-ensemble ajouté', 'success');
    // Proposer la création d'un chapitre uniquement pour un nouveau sous-ensemble
    if (!seId) {
      const mObj = state.currentMoteurs.find(x => x.id === moteurId);
      const ok = await confirm(
        `Créer un chapitre pour "${data.libelle}" ?`,
        `Voulez-vous ajouter un chapitre à cette affaire pour ce sous-ensemble ?`
      );
      if (ok) {
        editingChapterId = null;
        openChapterModal({
          libelle:   data.libelle,
          type_item: data.type || '',
          num_serie: mObj?.num_serie || '',
        });
      }
    }
  } catch(e) { toast(e.message, 'error'); }
}

async function deleteSousEnsemble(moteurId, seId) {
  const ok = await confirm('Supprimer ce sous-ensemble ?', 'Cette action est irréversible.');
  if (!ok) return;
  try {
    await DEL(`/moteurs/${moteurId}/sous-ensembles/${seId}`);
    await loadSousEnsembles(moteurId);
    toast('Sous-ensemble supprimé', 'success');
  } catch(e) { toast(e.message, 'error'); }
}

// Bascule d'onglet dans le modal Affaire : tous les panneaux restent dans le
// DOM (juste masqués) pour ne rien perdre des saisies en cours ni casser les
// lectures par id dans saveAffaire().
function switchAffaireTab(btn, tab) {
  const body = btn.closest('.modal-body');
  body.querySelectorAll(':scope > .tabs > .tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  body.querySelectorAll('[data-tab-panel]').forEach(p => { p.style.display = p.dataset.tabPanel === tab ? '' : 'none'; });
}

// Convertit JJ/MM/AAAA ou YYYY-MM-DD → YYYY-MM-DD (pour type="date")
function toInputDate(s) {
  if (!s) return '';
  const m1 = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (m1) return `${m1[3]}-${m1[2]}-${m1[1]}`;
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  return '';
}
// Convertit YYYY-MM-DD → JJ/MM/AAAA (pour la sauvegarde)
function fromInputDate(s) {
  if (!s) return '';
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return `${m[3]}/${m[2]}/${m[1]}`;
  return s;
}

function onTvaExonereChange(checked) {
  const tvaRow   = document.getElementById('af-tva-row');
  const tvaAlert = document.getElementById('af-tva-alert');
  if (tvaRow)   tvaRow.style.display   = checked ? 'none' : 'flex';
  if (tvaAlert) tvaAlert.style.display = checked ? 'flex' : 'none';
  updateTTC();
  _lots.forEach((_, li) => renderLotEcheances(li));
}
function updateTTC() {
  const ht = parseHT(document.getElementById('af-prix-ht')?.value);
  const tvaEl = document.getElementById('af-tva-amount');
  const ttcEl = document.getElementById('af-ttc-amount');
  if (!tvaEl || !ttcEl) return;
  if (!ht) { tvaEl.textContent = '—'; ttcEl.textContent = '—'; }
  else { tvaEl.textContent = fmtEur(ht * 0.20); ttcEl.textContent = fmtEur(ht * 1.20); }
  _echeances.forEach((_, i) => updateEcheanceReste(i));
  updateEcheancesTotal();
}

// ── Gestion des lots vendus (chacun avec son propre échéancier) ──
let _lots = [];

function initLots(jsonStr) {
  try { _lots = JSON.parse(jsonStr || '[]'); } catch(e) { _lots = []; }
  _lots.forEach(l => {
    if (!Array.isArray(l.echeances)) l.echeances = [];

function updateLotsTotal() {
  const totalEl    = document.getElementById('lots-total');
  const htInput    = document.getElementById('af-prix-ht');
  const globalSect = document.getElementById('global-echeancier-section');
  const hasLots    = _lots.length > 0;

function matchInterlocuteurContact(i) {
  const it = _interlocuteurs[i];
  if (!it || !it.nom) return;
  const contact = state.contacts.find(c => (c.nom||'').trim().toLowerCase() === it.nom.trim().toLowerCase());
  if (!contact) return;
  if (!it.email && contact.email) it.email = contact.email;
  if (!it.telephone && contact.telephone) it.telephone = contact.telephone;
  renderInterlocuteurs();
}

async function addCommercial() {

async function saveCommercial(id) {

      telephone: document.getElementById(`com-tel-${id}`).value.trim(),

async function deleteCommercial(id) {

async function downloadAffairePdf(pdfType = 'complet') {
  const a = state.currentAffaire;
  if (!a) return;
  const btn = document.querySelector(`[onclick="downloadAffairePdf('${pdfType}')"]`);
  const origText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '⏳ PDF…'; }
  try {
    const resp = await fetch(`${API_BASE}/affaires/${a.id}/pdf?pdf_type=${encodeURIComponent(pdfType)}`);
    if (!resp.ok) {
      const txt = await resp.text();
      throw new Error(txt || resp.statusText);
    }
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    const safeNum = a.num_affaire.replace(/\//g,'-');
    const suffix = pdfType === 'technique' ? '_TECHNIQUE' : '';
    link.download = pdfType === 'accuse_reception'
      ? `AR_Commande_${safeNum}.pdf`
      : `Affaire_${safeNum}${suffix}.pdf`;
    link.click();
    URL.revokeObjectURL(url);
    toast('PDF téléchargé', 'success');
  } catch(e) {
    toast('Erreur PDF : ' + e.message, 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = origText; }
  }
}

async function generateBonFacturation(affaireId, echelonIdx, lotId) {
  const a = state.currentAffaire;
  if (!a) return;
  const btnIds = [`bon-hdr-${affaireId}-${lotId || 'g'}-${echelonIdx}`, `bon-dash-${affaireId}-${lotId || 'g'}-${echelonIdx}`];
  const origHtml = {};
  btnIds.forEach(id => { const b = document.getElementById(id); if(b){ origHtml[id]=b.innerHTML; b.disabled=true; b.textContent='⏳'; } });
  try {
    const url = lotId
      ? `${API_BASE}/affaires/${affaireId}/echeances/${echelonIdx}/bon-facturation?lot_id=${encodeURIComponent(lotId)}`
      : `${API_BASE}/affaires/${affaireId}/echeances/${echelonIdx}/bon-facturation`;
    const resp = await fetch(url);
    if (!resp.ok) { const txt = await resp.text(); throw new Error(txt); }
    const blob = await resp.blob();
    const blobUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = blobUrl;

    let lots = [];
    let echeances = [];
    let lot = null;
    if (lotId) {
      try { lots = JSON.parse(a.lots_vendus || '[]'); } catch(_) {}
      lot = lots.find(l => l.id === lotId);
      echeances = lot?.echeances || [];
    } else {
      try { echeances = JSON.parse(a.echeances_facturation || '[]'); } catch(_) {}
    }
    const ech = echeances[echelonIdx];
    const isAcompte = /acompte/i.test(ech?.stade || '');
    const stadeLabel = (ech?.stade || `echelon-${echelonIdx+1}`).replace(/[\s\/]+/g,'_');
    const lotPrefix  = lot ? (lot.libelle || 'lot').replace(/[\s\/]+/g,'_') + '_' : '';
    link.download = `${isAcompte ? 'DemandeAcompte' : 'BonFacturation'}_${a.num_affaire.replace(/\//g,'-')}_${lotPrefix}${stadeLabel}.pdf`;
    link.click();
    URL.revokeObjectURL(blobUrl);
    // Marquer bon_genere (première génération uniquement) et sauvegarder
    if (ech && !ech.bon_genere) {
      const today = new Date().toLocaleDateString('fr-FR');
      let updated;
      if (lotId) {
        const lotIdx = lots.findIndex(l => l.id === lotId);
        echeances[echelonIdx] = { ...ech, bon_genere: today };
        lots[lotIdx] = { ...lots[lotIdx], echeances };
        updated = await PUT(`/affaires/${affaireId}`, { lots_vendus: JSON.stringify(lots) });
      } else {
        echeances[echelonIdx] = { ...ech, bon_genere: today };
        updated = await PUT(`/affaires/${affaireId}`, { echeances_facturation: JSON.stringify(echeances) });
      }
      state.currentAffaire = { ...a, ...updated };
      const idx = state.affaires.findIndex(x => x.id === affaireId);
      if (idx >= 0) state.affaires[idx] = { ...state.affaires[idx], ...updated };
      renderAffaireDetail();
    } else {
      btnIds.forEach(id => { const b = document.getElementById(id); if(b){ b.disabled=false; b.innerHTML=origHtml[id]; } });
    }
    toast(isAcompte ? 'Demande d\'acompte téléchargée' : 'Bon de facturation téléchargé', 'success');
  } catch(e) {
    toast('Erreur : ' + e.message, 'error');
    btnIds.forEach(id => { const b = document.getElementById(id); if(b){ b.disabled=false; b.innerHTML=origHtml[id] || 'Bon'; } });
  }
}

function sortBcListData() {
  const col = state.bcSortCol;
  const dir = state.bcSortDir === 'asc' ? 1 : -1;
  state.bcListData.sort((a, b) => {
    let av = a[col], bv = b[col];
    if (typeof av === 'number' || typeof bv === 'number') {
      return ((av||0) - (bv||0)) * dir;
    }
    av = (av || '').toString().toLowerCase();
    bv = (bv || '').toString().toLowerCase();
    return av < bv ? -dir : av > bv ? dir : 0;
  });
}

// Avancement de la réception d'un bon (quantités reçues / commandées), affiché
// sous le statut tant que la commande n'est que partiellement reçue.
function receptionTotaux(bc) {
  const lignes = (bc.lignes || []).filter(l => (l.quantite || 0) > 0);
  const cmd  = lignes.reduce((s, l) => s + (l.quantite || 0), 0);
  const recu = lignes.reduce((s, l) => s + Math.min(l.quantite_recue || 0, l.quantite || 0), 0);
  const manquantes = lignes.filter(l => (l.quantite_restante || 0) > 0).length;
  return { cmd, recu, manquantes, nbLignes: lignes.length };
}
function receptionProgressHtml(bc) {
  if (bc.etat_reception !== 'partielle') return '';
  const t = receptionTotaux(bc);
  const pct = t.cmd ? Math.round(100 * t.recu / t.cmd) : 0;
  return `<div onclick="openReceptionModal('${bc.id}')" style="cursor:pointer;margin-top:4px;font-size:11px;color:#92400e"
      title="${t.manquantes} ligne(s) sur ${t.nbLignes} en attente de livraison — cliquer pour réceptionner">
      <div style="height:4px;background:#fde68a;border-radius:2px;overflow:hidden;width:90px;margin-bottom:2px">
        <div style="height:100%;width:${pct}%;background:#d97706"></div></div>
      ${fmtQte(t.recu)} / ${fmtQte(t.cmd)} reçus</div>`;
}
function fmtQte(q) {
  return (Math.round((q || 0) * 1000) / 1000).toLocaleString('fr-FR');
}

function renderBcPagination(total, page, size) {
  if (total <= size) return '';
  const totalPages = Math.ceil(total / size);
  const s = (page-1)*size + 1, e = Math.min(page*size, total);
  const pages = [];
  if (totalPages <= 7) {
    for (let i=1; i<=totalPages; i++) pages.push(i);
  } else {
    pages.push(1);
    if (page > 3) pages.push('…');
    for (let i=Math.max(2,page-1); i<=Math.min(totalPages-1,page+1); i++) pages.push(i);
    if (page < totalPages-2) pages.push('…');
    pages.push(totalPages);
  }
  return `<div class="pagination">
    <div class="pagination-info">
      <span>${s}–${e} sur <strong>${total}</strong> bon${total>1?'s':''} de commande</span>
      <select class="page-size-sel" onchange="setBcPageSize(+this.value)">
        ${[10,25,50,100].map(n=>`<option ${n===size?'selected':''}>${n}</option>`).join('')}
      </select>
      <span>/ page</span>
    </div>
    <div class="pagination-btns">
      <button class="page-btn" ${page===1?'disabled':''} onclick="goBcPage(${page-1})">‹</button>
      ${pages.map(p=>p==='…'
        ? '<span style="padding:0 4px;color:var(--text-muted)">…</span>'
        : `<button class="page-btn ${p===page?'active':''}" onclick="goBcPage(${p})">${p}</button>`
      ).join('')}
      <button class="page-btn" ${page===totalPages?'disabled':''} onclick="goBcPage(${page+1})">›</button>
    </div>
  </div>`;
}

let _bcAffaireTimer = null;
function onBcAffaireInput(val) {
  clearTimeout(_bcAffaireTimer);
  const box = document.getElementById('bc-affaire-results');
  if (!val || val.length < 2) { if (box) box.style.display = 'none'; return; }
  _bcAffaireTimer = setTimeout(async () => {
    try {
      const results = await GET(`/affaires?search=${encodeURIComponent(val)}`);
      if (!box) return;
      if (!results.length) { box.style.display = 'none'; return; }
      box.innerHTML = results.slice(0, 15).map(a => `
        <div style="padding:6px 10px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--border)"
          onmousedown="pickBcAffaire('${a.id}', '${escHtml(a.num_affaire).replace(/'/g,"\\'")}', '${escHtml(a.nom_projet||'').replace(/'/g,"\\'")}')">
          <strong>${escHtml(a.num_affaire)}</strong>${a.nom_projet ? ' — '+escHtml(a.nom_projet) : ''}
        </div>`).join('');
      box.style.display = 'block';
    } catch(e) { /* recherche best-effort, ignore les erreurs réseau */ }
  }, 250);
}
function pickBcAffaire(id, num, nom) {
  _bcAffaireId = id;
  _bcAffaireLabel = num + (nom ? ' — ' + nom : '');
  const results = document.getElementById('bc-affaire-results');
  if (results) results.style.display = 'none';
  document.getElementById('bc-affaire-search-wrap').style.display = 'none';
  document.getElementById('bc-affaire-picked-label').textContent = _bcAffaireLabel;
  document.getElementById('bc-affaire-picked').style.display = 'flex';
  const chapWrap = document.getElementById('bc-chapitre-wrap');
  if (chapWrap) chapWrap.style.display = 'block';
}
function onBcChargeNomChange(val) {
  const t = state.techniciens.find(t => t.nom === val);
  if (!t) return;
  const emailEl = document.getElementById('bc-charge-email');
  const telEl = document.getElementById('bc-charge-tel');
  if (emailEl) emailEl.value = t.email || '';
  if (telEl) telEl.value = t.telephone || '';
}
function onBcFournisseurNomChange(val) {
  const f = findFournisseur(val);
  if (!f) return;
  if (!_bcInterlocuteurs.length && (f.contact || f.email || f.telephone)) {
    _bcInterlocuteurs = [{ nom: f.contact||'', email: f.email||'', telephone: f.telephone||'', role: '' }];
    renderBcInterlocuteurs();
  }
  const map = {
    'bc-fournisseur-rue': f.rue,
    'bc-fournisseur-cp': f.code_postal, 'bc-fournisseur-ville': f.ville,
    'bc-fournisseur-pays': f.pays,
  };
  for (const [id, fieldVal] of Object.entries(map)) {
    const el = document.getElementById(id);
    if (el && fieldVal) el.value = fieldVal;
  }
}
function updateBcLienMonstockLink(val) {
  const a = document.getElementById('bc-lien-monstock-open');
  if (!a) return;
  const url = (val || '').trim();
  a.href = url;
  a.style.display = url ? 'inline-flex' : 'none';

function clearBcAffaire() {
  _bcAffaireId = null;

// ── Catalogue des références produits (table /pieces) depuis une ligne d'achat ──
function toggleRefSaveBtn(kind, i) {
  const l = (kind === 'bc' ? _bcLignes : _iaLignes)[i];
  const btn = document.getElementById(`${kind}-ref-save-${i}`);
  if (btn && l) btn.style.display = (!l.piece_id && (l.reference||'').trim()) ? 'inline-block' : 'none';
}
// Enregistre la référence saisie sur une ligne de BC / d'intention d'achat dans
// le catalogue (si elle n'y est pas déjà), puis lie la ligne à cette pièce.
async function savePieceFromLigne(kind, i) {
  const lignes = kind === 'bc' ? _bcLignes : _iaLignes;
  const l = lignes[i];
  const ref = (l?.reference || '').trim();
  if (!ref) return;
  const btn = document.getElementById(`${kind}-ref-save-${i}`);
  if (btn) btn.disabled = true;
  try {
    const findExact = async () => {
      const found = await GET(`/pieces?search=${encodeURIComponent(ref)}&ref_only=true&limit=50`);
      return (found || []).find(p => (p.reference || '').trim().toLowerCase() === ref.toLowerCase());
    };
    let piece = await findExact();
    if (piece) {
      toast(`« ${piece.reference} » est déjà au catalogue : ligne liée`, 'info');
    } else {
      // Import en masse d'une seule ligne avec skip_doublons : ne remplace jamais
      // une pièce existante (au pire, complète ses champs vides).
      await POST('/pieces/bulk', { skip_doublons: true, pieces: [{
        reference: ref,
        libelle: (l.libelle || '').trim(),
        prix_achat: parseFloat(l.prix_unitaire) || 0,
        // lien avec le fournisseur du bon (sinon créé à l'enregistrement du bon)
        fournisseur: (document.getElementById(`${kind}-fournisseur-nom`)?.value || '').trim(),
      }] });
      piece = await findExact();
      toast(`Référence « ${ref} » ajoutée au catalogue`, 'success');
      if (!piece) { if (btn) btn.style.display = 'none'; return; }
    }
    l.piece_id = piece.id;
    l.reference = piece.reference;
    if (!l.libelle && piece.libelle) l.libelle = piece.libelle;
    kind === 'bc' ? renderBcLignes() : renderIaLignes();
  } catch (e) {
    toast('Ajout au catalogue impossible : ' + e.message, 'error');
    if (btn) btn.disabled = false;
  }
}

      <div style="position:relative">
        <input class="form-control" style="font-size:13px" placeholder="Référence" autocomplete="off"
          value="${escHtml(l.reference||'')}"
          oninput="onBcRefInput(${i}, this.value)" onblur="setTimeout(()=>hideBcRefResults(${i}),150)">
        <div id="bc-ref-results-${i}" class="search-results" style="display:none;position:absolute;z-index:20;background:var(--surface);border:1px solid var(--border);border-radius:6px;width:100%;max-height:160px;overflow-y:auto"></div>
      </div>
      <input class="form-control" style="font-size:13px" placeholder="Désignation"
        value="${escHtml(l.libelle||'')}" oninput="_bcLignes[${i}].libelle=this.value">
      <input class="form-control" style="font-size:13px" type="number" min="0" step="1" placeholder="Qté"
        value="${l.quantite ?? 1}" oninput="_bcLignes[${i}].quantite=this.value;updateBcLigneRow(${i})">
      <div style="position:relative">
        <input class="form-control no-spinner" style="font-size:13px;padding-right:22px" type="number" min="0" step="0.01" placeholder="PU HT"
          value="${l.prix_unitaire ?? 0}" oninput="_bcLignes[${i}].prix_unitaire=this.value;updateBcLigneRow(${i})">
        <span style="position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text-muted);pointer-events:none">€</span>
      </div>
      <div id="bc-ligne-montant-${i}" style="font-size:13px;text-align:right;font-weight:600;padding:7px 4px">${fmtEur((parseFloat(l.quantite)||0) * (parseFloat(l.prix_unitaire)||0))}</div>
      <div style="display:flex;gap:2px;align-items:center">
        <button type="button" id="bc-ref-save-${i}" onclick="savePieceFromLigne('bc', ${i})"
          style="display:${(!l.piece_id && (l.reference||'').trim()) ? 'inline-block' : 'none'};background:none;border:none;font-size:15px;padding:2px 4px;cursor:pointer;line-height:1"
          title="Référence absente du catalogue : l'enregistrer (avec la désignation et le prix d'achat de la ligne) pour la retrouver dans les prochains achats">📦</button>
        <button type="button" onclick="removeBcLigne(${i})" style="background:none;border:none;color:var(--danger);font-size:16px;padding:2px 4px;cursor:pointer;line-height:1" title="Supprimer">✕</button>
      </div>
      ${(l.quantite_recue || 0) > 0 ? `
      <div style="grid-column:1/-1;font-size:11px;color:${(l.quantite_restante || 0) > 0 ? '#92400e' : '#065f46'}">
        📥 Reçu ${fmtQte(l.quantite_recue)} / ${fmtQte(l.quantite)}${(l.quantite_restante || 0) > 0 ? ` — reste ${fmtQte(l.quantite_restante)} à recevoir` : ' — ligne entièrement reçue'}
      </div>` : ''}
    </div>`).join('');
  updateBcLignesTotal();
}

function updateBcLigneRow(i) {
  // Met à jour uniquement le montant de la ligne (pas de re-render complet,
  // qui ferait perdre le focus/curseur en cours de saisie dans le champ prix ou quantité).
  const l = _bcLignes[i];
  const montantEl = document.getElementById(`bc-ligne-montant-${i}`);
  if (montantEl && l) {
    montantEl.textContent = fmtEur((parseFloat(l.quantite)||0) * (parseFloat(l.prix_unitaire)||0));
  }
  updateBcLignesTotal();
}

let _bcRefTimers = {};
function onBcRefInput(i, val) {
  _bcLignes[i].reference = val;
  _bcLignes[i].piece_id = null;
  toggleRefSaveBtn('bc', i);
  clearTimeout(_bcRefTimers[i]);
  if (!val || val.length < 2) { hideBcRefResults(i); return; }
  _bcRefTimers[i] = setTimeout(async () => {
    try {
      // Les références du fournisseur choisi passent en tête, avec son dernier prix
      const fourn = (document.getElementById('bc-fournisseur-nom')?.value || '').trim();

function bcBaseAmount() {
  const exo = document.getElementById('bc-exonere-tva')?.checked;
  const fraisPort = parseFloat(document.getElementById('bc-frais-port')?.value) || 0;
  const totalHt = _bcLignes.reduce((s,l) => s + (parseFloat(l.quantite)||0) * (parseFloat(l.prix_unitaire)||0), 0) + fraisPort;
  return totalHt ? (exo ? totalHt : totalHt * 1.20) : null;
}

function updateBcPaiementReste(i) {

  if (!el) return;

  if (!e) return;
  const montantStade = base !== null ? base * (parseFloat(e.pourcentage) || 0) / 100 : null;
  const paye = parseFloat(e.montant_paye) || 0;
  const reste = montantStade !== null ? montantStade - paye : null;
  el.style.cssText = `font-size:13px;text-align:right;padding:0 4px;${reste === null ? 'color:var(--text-muted)' : reste <= 0 ? 'color:#059669;font-weight:600' : 'color:#dc2626;font-weight:600'}`;
  el.textContent = reste === null ? '—' : fmtEur(reste);
}

function toggleBcPaiementJours(i) {
  const wrap  = document.getElementById(`bcpay-jours-wrap-${i}`);

  const m = _bcPaiements[i]?.modalite;
  wrap.style.display = (m === 'jours' || m === 'jours_fm') ? 'flex' : 'none';
  if (label) label.textContent = m === 'jours_fm' ? 'jours fin de mois' : 'jours';
}

// Calcule la date prévisionnelle de paiement d'un stade à partir de la date de
// livraison prévue et de la modalité choisie (comptant / X jours / X jours fin de mois).
// Renvoie null si le calcul n'est pas possible (pas de date de livraison ou pas de modalité) :
// dans ce cas la date renseignée manuellement n'est pas modifiée.
function computeDatePrevue(livraisonStr, modalite, jours) {
  if (!modalite) return null;
  const base = parseFrDateStr(livraisonStr);
  if (!base) return null;
  let due;
  if (modalite === 'comptant') {
    due = new Date(base);
  } else if (modalite === 'jours') {
    due = new Date(base);
    due.setDate(due.getDate() + (parseInt(jours, 10) || 0));
  } else if (modalite === 'jours_fm') {
    due = new Date(base.getFullYear(), base.getMonth() + 1, 0); // dernier jour du mois de livraison
    due.setDate(due.getDate() + (parseInt(jours, 10) || 0));
  } else {
    return null;
  }
  const dd = String(due.getDate()).padStart(2, '0');
  const mm = String(due.getMonth() + 1).padStart(2, '0');
  return `${dd}/${mm}/${due.getFullYear()}`;
}

// Recalcule automatiquement la date prévue d'un stade de l'échéancier ; la valeur
// reste toujours modifiable manuellement ensuite dans le champ date.
function updateBcPaiementDatePrevue(i) {
  const e = _bcPaiements[i];
  if (!e) return;
  const livraisonFr = fromInputDate(document.getElementById('bc-date-livraison')?.value || '');
  const calc = computeDatePrevue(livraisonFr, e.modalite, e.jours);
  if (calc === null) return;
  e.date_prevue = calc;
  const dateInput = document.getElementById(`bcpay-date-${i}`);
  if (dateInput) dateInput.value = toInputDate(calc);
}

function recalcAllBcPaiementDates() {
  _bcPaiements.forEach((_, i) => updateBcPaiementDatePrevue(i));
}

function addBcPaiement() {
  _bcPaiements.push({ stade: '', pourcentage: '', montant_paye: '', modalite: '', jours: '', date_prevue: '' });
  renderBcPaiements();
  const first = document.querySelector('#bc-paiements-list > div:last-child input');
  if (first) first.focus();
}

function removeBcPaiement(i) {
  _bcPaiements.splice(i, 1);

function updateBcPaiementsTotal() {
  const totalEl = document.getElementById('bc-paiements-total');
  if (!totalEl) return;
  if (!_bcPaiements.length) { totalEl.style.display = 'none'; return; }
  const exo = document.getElementById('bc-exonere-tva')?.checked;
  const base = bcBaseAmount();
  const label = exo ? 'HT' : 'TTC';
  const totalPct   = _bcPaiements.reduce((s,e) => s + (parseFloat(e.pourcentage)||0), 0);
  const totalPaye  = _bcPaiements.reduce((s,e) => s + (parseFloat(e.montant_paye)||0), 0);
  const totalMont  = base !== null ? base * totalPct / 100 : null;
  const totalReste = totalMont !== null ? totalMont - totalPaye : null;
  const resteColor = totalReste === null ? '' : totalReste <= 0 ? 'color:#059669;font-weight:700' : 'color:#dc2626;font-weight:700';
  totalEl.style.display = 'flex';
  totalEl.innerHTML = `
    <span style="font-weight:600;color:var(--text-muted)">Total :</span>
    <span><strong>${totalPct.toFixed(1)} %</strong></span>
    ${totalMont !== null ? `<span>Montant ${label} : <strong>${fmtEur(totalMont)}</strong></span>` : ''}
    <span>Payé : <strong>${fmtEur(totalPaye)}</strong></span>
    ${totalReste !== null ? `<span style="${resteColor}">Reste ${label} : ${fmtEur(totalReste)}</span>` : ''}
    ${totalPct > 100 ? '<span style="color:#dc2626">⚠️ Total > 100 %</span>' : ''}
  `;
}

      .filter(l => l.reference || l.drawing_no || l.libelle || l.ratio_notes || l.quantite || l.prix_unitaire)
      .map((l, i) => ({
        piece_id: l.piece_id || null,
        reference: l.reference || '',
        drawing_no: l.drawing_no || '',

  try {
    await DEL(`/intentions-achat/${iaId}`);
    toast("Intention d'achat supprimée", 'success');

async function generateIntentionAchatPdf(iaId) {
  const btn = document.querySelector(`[onclick="generateIntentionAchatPdf('${iaId}')"]`);
  const origText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '⏳'; }
  try {
    const ia = state.intentionsAchat.find(b => b.id === iaId);
    const lang = (ia && ia.langue) || 'fr';
    const resp = await fetch(`${API_BASE}/intentions-achat/${iaId}/pdf?lang=${lang}`);
    if (!resp.ok) { const txt = await resp.text(); throw new Error(txt); }
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `IA_${(ia?.num_ia||'intention').replace(/\//g,'-')}.pdf`;
    link.click();
    URL.revokeObjectURL(url);
    toast('PDF téléchargé', 'success');
    await reloadIntentionsAchat();
  } catch(e) {
    toast('Erreur PDF : ' + e.message, 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = origText; }
  }
}

// Après enregistrement : reporte sur les lignes en cours d'édition les id
// attribués par le serveur (les lignes gardent ainsi leurs réceptions aux
// enregistrements suivants) et les quantités reçues.
function _bcLigneNonVide(l) { return l.reference || l.libelle || l.quantite || l.prix_unitaire; }
function _syncBcLignesFromSaved(saved) {
  if (!saved || !Array.isArray(saved.lignes)) return;
  const kept = _bcLignes.filter(_bcLigneNonVide);
  if (kept.length !== saved.lignes.length) return;
  kept.forEach((l, i) => {
    const s = saved.lignes[i];
    l.id = s.id;
    l.quantite_recue = s.quantite_recue || 0;
    l.quantite_restante = s.quantite_restante || 0;
  });
}

    fournisseur_code_postal: document.getElementById('bc-fournisseur-cp').value.trim(),
    fournisseur_ville:       document.getElementById('bc-fournisseur-ville').value.trim(),
    fournisseur_pays:        document.getElementById('bc-fournisseur-pays').value.trim(),
    fournisseur_contact:   (bcPremierContact.nom||'').trim(),
    fournisseur_email:     (bcPremierContact.email||'').trim(),
    fournisseur_tel:       (bcPremierContact.telephone||'').trim(),

    livraison_nom:         document.getElementById('bc-livraison-nom').value.trim() || BC_LIVRAISON_DEFAUT.nom,
    livraison_rue:         document.getElementById('bc-livraison-rue').value.trim() || BC_LIVRAISON_DEFAUT.rue,
    livraison_code_postal: document.getElementById('bc-livraison-cp').value.trim() || BC_LIVRAISON_DEFAUT.cp,
    livraison_ville:       document.getElementById('bc-livraison-ville').value.trim() || BC_LIVRAISON_DEFAUT.ville,
    livraison_pays:        document.getElementById('bc-livraison-pays').value.trim() || BC_LIVRAISON_DEFAUT.pays,

    charge_commande_email: document.getElementById('bc-charge-email').value.trim(),
    charge_commande_tel:   document.getElementById('bc-charge-tel').value.trim(),
    date_commande:         fromInputDate(document.getElementById('bc-date-commande').value),
    date_livraison_prevue: fromInputDate(document.getElementById('bc-date-livraison').value),
    date_livraison_reelle: fromInputDate(document.getElementById('bc-date-livraison-reelle').value),
    date_reglement:        fromInputDate(document.getElementById('bc-date-reglement').value),
    statut:                document.getElementById('bc-statut').value,
    conditions:            document.getElementById('bc-conditions').value.trim(),
    notes:                 document.getElementById('bc-notes').value.trim(),
    exonere_tva:           document.getElementById('bc-exonere-tva').checked ? 1 : 0,
    frais_port:            parseFloat(document.getElementById('bc-frais-port').value) || 0,
    chapitre_cout:         _bcAffaireId ? (document.getElementById('bc-chapitre-cout').value || '') : '',
    paiements:             JSON.stringify(_bcPaiements.filter(e => e.stade || e.pourcentage)),
    lignes: _bcLignes
      .filter(_bcLigneNonVide)
      .map((l, i) => ({
        id: l.id || null,   // conserve l'id de la ligne (réceptions rattachées)
        piece_id: l.piece_id || null,
        reference: l.reference || '',
        libelle: l.libelle || '',
        quantite: parseFloat(l.quantite) || 0,
        prix_unitaire: parseFloat(l.prix_unitaire) || 0,
        ordre: i,
      })),
  };
  const btn = document.querySelector('.modal-footer .btn-primary');
  btn.disabled = true; btn.textContent = '…';
  let savedId = null;
  try {
    if (bcId) {
      const updated = await PUT(`/bons-commande/${bcId}`, body);
      // Le statut peut avoir été recalculé d'après les réceptions (ligne ajoutée…)
      const stSel = document.getElementById('bc-statut');
      if (stSel && updated?.statut) stSel.value = updated.statut;
      _syncBcLignesFromSaved(updated);
      toast('Bon de commande mis à jour', 'success');
      savedId = bcId;
    } else {
      const created = await POST('/bons-commande', body);
      _syncBcLignesFromSaved(created);
      // Une fois créé, les enregistrements suivants mettent à jour ce même
      // bon de commande au lieu d'en recréer un nouveau à chaque clic.
      btn.setAttribute('onclick', `saveBonCommande('${created.id}')`);
      toast('Bon de commande créé', 'success');
      savedId = created.id;
    }
    await refreshFournisseursEtContacts();
    await reloadBonsCommande();
  } catch(e) {
    toast(e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Enregistrer';
  }
  return savedId;
}

function duplicateBonCommande(bcId) {
  const src = state.bonsCommande.find(b => b.id === bcId);
  if (!src) return;
  let paiements = [];
  try { paiements = JSON.parse(src.paiements || '[]'); } catch(e) { paiements = []; }
  const dup = {
    ...src,
    statut: 'Brouillon',
    date_commande: '',
    date_livraison_reelle: '',
    date_reglement: '',
    receptions: [],
    etat_reception: '',
    lignes: (src.lignes || []).map(({ id, quantite_recue, quantite_restante, ...l }) => ({...l})),
    paiements: JSON.stringify(paiements.map(p => ({...p, montant_paye: ''}))),
  };
  openBcModal(null, dup);
  toast("Bon de commande dupliqué, vérifiez les informations avant d'enregistrer", 'info');
}

async function deleteBonCommande(bcId) {
  const ok = await confirm('Supprimer ce bon de commande ?', 'Cette action est irréversible.');
  if (!ok) return;
  try {
    await DEL(`/bons-commande/${bcId}`);
    toast('Bon de commande supprimé', 'success');
    await reloadBonsCommande();
  } catch(e) { toast(e.message, 'error'); }
}

// ══════════════════ Réceptions des bons de commande ══════════════════
// Une réception = une livraison (un BL fournisseur). On saisit, ligne par
// ligne, la quantité effectivement reçue : s'il manque des articles, le bon
// passe en « Reçu partiellement » et le reliquat reste à réceptionner plus
// tard ; quand tout est reçu, il passe en « Reçu » (date de livraison réelle
// = date de la dernière réception). Cf. POST /bons-commande/{id}/receptions.
let _recBc = null;

async function openReceptionModal(bcId) {
  let bc;
  try { bc = await GET(`/bons-commande/${bcId}`); }
  catch (e) { toast(e.message, 'error'); return; }
  renderReceptionModal(bc);
}

function _todayInputDate() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

        ? `<div style="padding:10px;background:#d1fae5;color:#065f46;border-radius:6px;font-size:13px;margin-bottom:12px">✓ Commande entièrement reçue${bc.date_livraison_reelle ? ' le ' + escHtml(bc.date_livraison_reelle) : ''}.</div>`
        : (bc.statut === 'Reçu' && !(bc.receptions || []).length
          ? `<div style="padding:10px;background:#fef3c7;color:#92400e;border-radius:6px;font-size:13px;margin-bottom:12px">
               ⚠ Ce bon est déjà marqué « Reçu » (saisi avant le suivi des réceptions) : les quantités ci-dessous n'ont simplement pas été pointées.

function _receptionInputs() {
  return [...document.querySelectorAll('#rec-lignes input[data-ligne]')];
}

function setReceptionQuantites(tout) {
  _receptionInputs().forEach(inp => { inp.value = tout ? inp.dataset.max : 0; });
  updateReceptionResume();
}

// Résumé en direct : réception complète ou partielle, articles qui manqueront.
function updateReceptionResume() {
  const el = document.getElementById('rec-resume');
  if (!el) return;
  const inputs = _receptionInputs();
  if (!inputs.length) { el.innerHTML = ''; return; }
  let saisi = 0, manquants = 0, lignesManquantes = 0, erreur = false;
  inputs.forEach(inp => {
    const q = parseFloat(inp.value) || 0;
    const max = parseFloat(inp.dataset.max) || 0;
    const ko = q < 0 || q > max + 1e-9;
    inp.style.borderColor = ko ? 'var(--danger)' : '';
    erreur = erreur || ko;
    saisi += Math.max(q, 0);
    if (q < max - 1e-9) { manquants += max - Math.max(q, 0); lignesManquantes++; }
  });
  if (erreur) {
    el.innerHTML = `<span style="color:var(--danger)">Quantité reçue supérieure au reste à recevoir.</span>`;
  } else if (saisi <= 0) {
    el.innerHTML = `<span style="color:var(--text-muted)">Aucune quantité saisie.</span>`;
  } else if (lignesManquantes) {
    el.innerHTML = `<span style="color:#92400e">⚠ Réception partielle : il manquera ${fmtQte(manquants)} article(s) sur ${lignesManquantes} ligne(s) — le bon passera en « Reçu partiellement ».</span>`;
  } else {
    el.innerHTML = `<span style="color:#065f46">✓ Réception complète — le bon passera en « Reçu ».</span>`;
  }
}

async function saveReception() {
  const bc = _recBc;
  if (!bc) return;
  const lignes = [];
  for (const inp of _receptionInputs()) {
    const q = parseFloat(inp.value) || 0;
    const max = parseFloat(inp.dataset.max) || 0;
    if (q < 0 || q > max + 1e-9) { toast('Quantité reçue supérieure au reste à recevoir', 'error'); inp.focus(); return; }
    if (q > 0) lignes.push({ ligne_id: inp.dataset.ligne, quantite_recue: q });
  }
  if (!lignes.length) { toast('Saisissez au moins une quantité reçue', 'warning'); return; }
  const body = {
    date_reception: fromInputDate(document.getElementById('rec-date')?.value || ''),
    numero_bl:      (document.getElementById('rec-bl')?.value || '').trim(),
    receptionnaire: (document.getElementById('rec-par')?.value || '').trim(),
    commentaire:    (document.getElementById('rec-commentaire')?.value || '').trim(),
    lignes,
  };
  const btn = document.getElementById('rec-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    const updated = await POST(`/bons-commande/${bc.id}/receptions`, body);
    toast(updated.etat_reception === 'complete'
      ? 'Réception enregistrée — commande entièrement reçue'
      : 'Réception partielle enregistrée — reliquat en attente', 'success');
    renderReceptionModal(updated);
    await _afterReceptionChange();
  } catch (e) {
    toast(e.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Enregistrer la réception'; }
  }
}

async function deleteReception(bcId, receptionId) {
  const ok = await confirm('Annuler cette réception ?',
    'Les quantités de cette livraison seront de nouveau « à recevoir » et le statut du bon sera recalculé.');
  if (!ok) return;
  try {
    const updated = await DEL(`/bons-commande/${bcId}/receptions/${receptionId}`);
    toast('Réception annulée', 'success');
    renderReceptionModal(updated);
    await _afterReceptionChange();
  } catch (e) { toast(e.message, 'error'); }
}

async function _afterReceptionChange() {
  if (state.view === 'achats' && state.achatsMode !== 'intention') await reloadBonsCommande();
}

// ══════════════════ Envoi des commandes au fournisseur par mail ══════════════════
// Le mail est préparé par l'app Affaire locale (shared/mailer.py, comme dans les
// autres apps EMS) : brouillon Outlook avec le PDF joint, sinon mailto + dossier
// du PDF. L'utilisateur confirme ensuite l'envoi, ce qui pose l'indicateur
// « envoyé » (date + destinataires) et passe le statut Brouillon à Envoyé(e).
function _achatListe(kind) { return kind === 'bc' ? (state.bonsCommande || []) : (state.intentionsAchat || []); }
function _achatApi(kind)   { return kind === 'bc' ? 'bons-commande' : 'intentions-achat'; }
function _achatLabel(kind) { return kind === 'bc' ? 'bon de commande' : "intention d'achat"; }

function envoiBadge(kind, b) {
  if (!b.envoye_le) return '';
  const quand = b.envoye_le.split(' ')[0];
  const title = `Envoyé le ${b.envoye_le}${b.envoye_a ? ' à ' + b.envoye_a : ''} — cliquer pour annuler l'indicateur`;
  return ` <span onclick="annulerEnvoi('${kind}', '${b.id}')" title="${escHtml(title)}"
    style="display:inline-flex;align-items:center;gap:3px;margin-left:4px;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;background:#dcfce7;color:#15803d;cursor:pointer;white-space:nowrap">✉ Envoyé ${escHtml(quand)}</span>`;
}

function _destinatairesAchat(b) {
  let interlocs = [];
  try { interlocs = JSON.parse(b.interlocuteurs_fournisseur || '[]'); } catch (e) { interlocs = []; }
  const emails = [];
  for (const it of interlocs) {
    const e = (it?.email || '').trim();
    if (e && !emails.some(x => x.toLowerCase() === e.toLowerCase())) emails.push(e);
  }
  if (!emails.length && (b.fournisseur_email || '').trim()) emails.push(b.fournisseur_email.trim());
  return emails;
}

async function _getAchat(kind, id) {
  // Liste affichée d'abord ; sinon (filtre actif, création récente) directement l'API
  const b = _achatListe(kind).find(x => x.id === id);
  if (b) return b;
  try { return await GET(`/${_achatApi(kind)}/${id}`); } catch (e) { return null; }
}

async function envoyerCommande(kind, id) {
  const b = await _getAchat(kind, id);
  if (!b) { toast('Commande introuvable, rechargez la liste', 'error'); return; }
  if (!LOCAL_PORT) {
    toast("L'envoi par mail se fait depuis l'application EMS Affaire (serveur local indisponible)", 'error');
    return;
  }
  if (!_destinatairesAchat(b).length) {
    const ok = await confirm('Aucun email fournisseur',
      `Aucun interlocuteur avec email n'est renseigné sur ce ${_achatLabel(kind)}. Ouvrir quand même le mail (destinataire à saisir) ?`);
    if (!ok) return;
  }
  if (b.envoye_le) {
    const ok = await confirm('Déjà envoyé', `Ce ${_achatLabel(kind)} a déjà été envoyé le ${escHtml(b.envoye_le)}. Le renvoyer ?`);
    if (!ok) return;
  }
  toast('Préparation du mail (génération du PDF)…', 'info');
  let res;
  try {
    const r = await fetch('http://127.0.0.1:' + LOCAL_PORT + '/email-commande', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind, bon: b }),
    });
    res = await r.json();
  } catch (e) {
    toast("Impossible de joindre l'application EMS Affaire : " + e.message, 'error');
    return;
  }
  if (!res.ok) { toast('Envoi impossible : ' + (res.error || 'erreur inconnue'), 'error'); return; }
  if (!res.pj_auto) {
    toast('Mail ouvert : joignez le PDF depuis le dossier qui vient de s\'ouvrir', 'info');
  }
  const dest = (res.destinataires || []).join('; ');
  const envoye = await confirm('Mail envoyé ?',
    `Une fois le mail envoyé${dest ? ' à ' + escHtml(dest) : ''}, confirmez pour marquer ce ${_achatLabel(kind)} comme « envoyé ».`);
  if (!envoye) return;
  try {
    await POST(`/${_achatApi(kind)}/${id}/envoi`, { envoye: true, envoye_a: dest });
    toast(`${kind === 'bc' ? 'Bon de commande' : "Intention d'achat"} marqué(e) comme envoyé(e)`, 'success');
    kind === 'bc' ? await reloadBonsCommande() : await reloadIntentionsAchat();
  } catch (e) { toast(e.message, 'error'); }
}

async function annulerEnvoi(kind, id) {
  const b = await _getAchat(kind, id);
  if (!b) return;
  const ok = await confirm("Annuler l'indicateur « envoyé » ?",
    `Envoyé le ${escHtml(b.envoye_le)}${b.envoye_a ? ' à ' + escHtml(b.envoye_a) : ''}. Le statut n'est pas modifié.`);
  if (!ok) return;
  try {
    await POST(`/${_achatApi(kind)}/${id}/envoi`, { envoye: false });
    kind === 'bc' ? await reloadBonsCommande() : await reloadIntentionsAchat();
  } catch (e) { toast(e.message, 'error'); }
}

// « Enregistrer et envoyer » depuis la fenêtre d'un BC / d'une IA
async function envoyerDepuisModal(kind) {
  const saveBtn = document.querySelector('.modal-footer .btn-primary');
  const m = (saveBtn?.getAttribute('onclick') || '').match(/\('([^']*)'\)/);
  const currentId = m ? m[1] : '';
  const id = kind === 'bc' ? await saveBonCommande(currentId) : await saveIntentionAchat(currentId);
  if (!id) return;   // échec d'enregistrement : le toast d'erreur est déjà affiché
  document.querySelector('.modal-overlay')?.remove();
  await envoyerCommande(kind, id);
}

async function generateBonCommandePdf(bcId) {
  const btn = document.querySelector(`[onclick="generateBonCommandePdf('${bcId}')"]`);
  const origText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '⏳'; }
  try {
    const resp = await fetch(`${API_BASE}/bons-commande/${bcId}/pdf`);
    if (!resp.ok) { const txt = await resp.text(); throw new Error(txt); }
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const bc = state.bonsCommande.find(b => b.id === bcId);
    const link = document.createElement('a');
    link.href = url;
    link.download = `BC_${(bc?.num_bc||'bon').replace(/\//g,'-')}.pdf`;
    link.click();
    URL.revokeObjectURL(url);
    toast('PDF téléchargé', 'success');
    await reloadBonsCommande();
  } catch(e) {
    toast('Erreur PDF : ' + e.message, 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = origText; }
  }
}

/* ═══════════════════════════════════════════════
   DOCUMENTS IMPRIMABLES — Fiche récap A4 / Étiquette expédition
═══════════════════════════════════════════════ */
function printFicheRecapA4() {
  const a = state.currentAffaire;
  if (!a) return;
  const now = new Date().toLocaleDateString('fr-FR', {day:'2-digit',month:'2-digit',year:'numeric'});
  const client = state.clients.find(c => c.id === a.client_id) || null;

  let interlocuteurs = [];
  try { interlocuteurs = JSON.parse(a.interlocuteurs_client || '[]'); } catch(e) {}
  interlocuteurs = interlocuteurs.filter(it => it.nom || it.email || it.telephone);
  if (!interlocuteurs.length && client && (client.contact || client.email || client.telephone)) {
    interlocuteurs = [{ nom: client.contact || client.nom, email: client.email, telephone: client.telephone, role: '' }];
  }

  const infoRow = (label, val) => val
    ? `<div class="rc-field"><span class="rc-lbl">${escHtml(label)}</span><span class="rc-val">${escHtml(val)}</span></div>` : '';

  const contactsRows = interlocuteurs.length
    ? interlocuteurs.map(it => `
      <tr>
        <td>${escHtml(it.nom||'—')}</td>
        <td>${escHtml(it.email||'—')}</td>
        <td>${escHtml(it.telephone||'—')}</td>
        <td>${escHtml(it.role||'—')}</td>
      </tr>`).join('')
    : `<tr><td colspan="4" style="text-align:center;color:#9ca3af;font-style:italic">Aucun contact renseigné</td></tr>`;

  const html = `<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
  <title>Fiche récap — ${escHtml(a.num_affaire)}</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    @page{size:A4;margin:16mm}
    body{font-family:'Segoe UI',Arial,sans-serif;color:#1e293b;background:#fff}
    .rc-header{display:flex;align-items:center;gap:16px;border-bottom:3px solid #002b5c;padding-bottom:12px;margin-bottom:18px}
    .rc-header img{height:52px;width:auto}
    .rc-header h1{font-size:15px;font-weight:700;color:#002b5c;letter-spacing:.4px;text-transform:uppercase}
    .rc-header .rc-sub{font-size:11px;color:#6b7785;margin-top:2px}
    .rc-num-box{margin-left:auto;text-align:right}
    .rc-num-box .rc-num{font-size:22px;font-weight:800;color:#002b5c;letter-spacing:.5px}
    .rc-num-box .rc-projet{font-size:12px;color:#4b5563;margin-top:2px}
    .rc-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#fff;background:#002b5c;padding:5px 10px;border-radius:4px;margin:18px 0 8px}
    .rc-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px}
    .rc-field{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0;border-bottom:1px dotted #e2e8f0}
    .rc-lbl{color:#6b7785;font-weight:600}
    .rc-val{font-weight:600;color:#1e293b;text-align:right}
    .rc-desc{margin-top:10px;font-size:12px;line-height:1.5;white-space:pre-wrap;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:10px}
    table.rc-contacts{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
    table.rc-contacts th{background:#f1f5f9;text-align:left;font-size:10.5px;text-transform:uppercase;color:#6b7785;padding:6px 8px;border-bottom:1px solid #e2e8f0}
    table.rc-contacts td{padding:7px 8px;border-bottom:1px solid #f1f5f9}
    .rc-footer{margin-top:26px;padding-top:8px;border-top:1px solid #e2e8f0;font-size:9px;color:#9ca3af;display:flex;justify-content:space-between}
  </style></head><body>
  <div class="rc-header">
    <img src="${LOGO_EMS_DATAURI}" alt="EMS">
    <div>
      <h1>${escHtml(EMS_ENTREPRISE.nom)}</h1>
      <div class="rc-sub">Fiche récapitulative d'affaire</div>
    </div>
    <div class="rc-num-box">
      <div class="rc-num">${escHtml(a.num_affaire)}</div>
      <div class="rc-projet">${escHtml(a.nom_projet || a.navire_machine || '—')}</div>
    </div>
  </div>

  <div class="rc-section-title">Informations principales</div>
  <div class="rc-grid">
    ${infoRow('Client', a.client_nom)}
    ${infoRow('Statut', a.statut)}
    ${infoRow('Navire / Machine', a.navire_machine)}
    ${infoRow('Complexité', a.complexite)}
    ${infoRow("Chargé d'affaire", a.charge_affaire)}
    ${infoRow('Référent technique', a.resp_technique)}
    ${infoRow('Commercial EMS', a.commercial)}
    ${infoRow('Date début', a.date_debut)}
    ${infoRow('Date de livraison prévue', a.date_fin_prevue)}
    ${infoRow('Référence interne', a.ref_interne)}
    ${infoRow('N° commande client', a.num_commande_client)}
  </div>
  ${a.description ? `<div class="rc-desc">${escHtml(a.description)}</div>` : ''}

  <div class="rc-section-title">Contact(s) client</div>
  <table class="rc-contacts">
    <thead><tr><th>Nom</th><th>Email</th><th>Téléphone</th><th>Rôle</th></tr></thead>
    <tbody>${contactsRows}</tbody>
  </table>

  <div class="rc-footer">
    <span>${escHtml(EMS_ENTREPRISE.rue)}, ${escHtml(EMS_ENTREPRISE.cp)} ${escHtml(EMS_ENTREPRISE.ville)} — ${escHtml(EMS_ENTREPRISE.tel)}</span>
    <span>Édité le ${now}</span>
  </div>
  <script>window.onload=()=>window.print()<\/script>
  </body></html>`;

  const win = window.open('', '_blank', 'width=900,height=1100');
  if (win) {
    win.document.write(html);
    win.document.close();
  } else {
    toast('Autoriser les popups pour imprimer la fiche récap', 'warning');
  }
}

function printEtiquetteExpedition() {
  const a = state.currentAffaire;
  if (!a) return;
  const now = new Date().toLocaleDateString('fr-FR', {day:'2-digit',month:'2-digit',year:'numeric'});

  const technicien = (state.techniciens || []).find(t => t.nom === a.charge_affaire) || null;
  const emsContactRows = [
    a.charge_affaire && `<div class="ex-row"><span class="ex-lbl">Contact</span><span>${escHtml(a.charge_affaire)}</span></div>`,
    technicien && technicien.email && `<div class="ex-row"><span class="ex-lbl">Email</span><span>${escHtml(technicien.email)}</span></div>`,
    technicien && technicien.telephone && `<div class="ex-row"><span class="ex-lbl">Tél. direct</span><span>${escHtml(technicien.telephone)}</span></div>`,
  ].filter(Boolean).join('');

  const client = state.clients.find(c => c.id === a.client_id) || null;
  const destNom   = a.livraison_nom || a.client_nom || (client && client.nom) || '—';
  const destRue   = a.livraison_rue || (client && client.adresse) || '';
  const destCpVille = [a.livraison_code_postal, a.livraison_ville].filter(Boolean).join(' ');
  const destPays  = a.livraison_pays || 'France';
  const destTel   = a.contact_transport || (client && client.telephone) || '';

  const html = `<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">

/* Migration unique (par navigateur) des anciens modèles de chapitres stockés
   en localStorage vers la base de données, introduits avant que ces
   réglages soient persistés côté serveur. Ne s'exécute que si la base est
   encore vide, pour ne jamais écraser des modèles déjà enregistrés par un
   autre poste. */
async function _migrerModelesChapitreVersBase() {
  if (localStorage.getItem('ems_tpl_migrated_to_db')) return;
  try {
    const oldTemplates   = JSON.parse(localStorage.getItem('ems_type_templates') || '{}');
    const oldLocked      = localStorage.getItem('ems_tpl_locked') === '1';
    const oldCustomTypes = JSON.parse(localStorage.getItem('ems_chapter_types') || '[]');
    const oldOrder       = JSON.parse(localStorage.getItem('ems_chapter_order') || '[]');
    const hasOldData = Object.keys(oldTemplates).length || oldCustomTypes.length || oldOrder.length || oldLocked;
    const dbIsEmpty  = !Object.keys(state.chapterTemplates).length && !state.chapterCustomTypes.length
                       && !state.chapterTypesOrder.length && !state.chapterTemplatesLocked;
    if (hasOldData && dbIsEmpty) {
      await Promise.all(Object.entries(oldTemplates).map(([t, fields]) =>
        PUT(`/modeles-chapitre/${encodeURIComponent(t)}`, { fields })));
      await PUT('/modeles-chapitre/config', { locked: oldLocked, custom_types: oldCustomTypes, order: oldOrder });
      state.chapterTemplates       = oldTemplates;
      state.chapterTemplatesLocked = oldLocked;
      state.chapterCustomTypes     = oldCustomTypes;
      state.chapterTypesOrder      = oldOrder;
      toast('Modèles de chapitres migrés vers la base de données', 'success');
    }
  } catch(e) { /* migration best-effort, ne bloque pas le chargement */ }
  localStorage.setItem('ems_tpl_migrated_to_db', '1');
}

async function init() {

    const [affaires, clients, techniciens, contacts, fournisseurs, navires, commerciaux, modelesChapitre] = await Promise.all([
      GET('/affaires'),
      GET('/clients').catch(() => []),
      GET('/techniciens').catch(() => []),
      GET('/contacts').catch(() => []),
      GET('/fournisseurs').catch(() => []),
      GET('/navires').catch(() => []),
      GET('/commerciaux').catch(() => []),
      GET('/modeles-chapitre').catch(() => ({ templates: {}, locked: false, custom_types: [], order: [] })),
    ]);
    state.affaires    = affaires;
    state.listData    = [...affaires];
    state.clients     = clients;
    state.techniciens = techniciens;
    state.contacts    = contacts;
    state.fournisseurs = fournisseurs;
    state.navires     = navires;
    state.commerciaux = commerciaux;
    state.chapterTemplates      = modelesChapitre.templates || {};
    state.chapterTemplatesLocked = !!modelesChapitre.locked;
    state.chapterCustomTypes     = modelesChapitre.custom_types || [];
    state.chapterTypesOrder      = modelesChapitre.order || [];
    await _migrerModelesChapitreVersBase();
    document.getElementById('api-status').textContent = '● connecté';
    document.getElementById('api-status').style.color = 'rgba(52,211,153,.7)';
    renderNav();
    showDashboard();
  } catch(e) {
    document.getElementById('api-status').textContent = '● hors ligne';
    document.getElementById('api-status').style.color = 'rgba(252,165,165,.8)';
    document.getElementById('content').innerHTML = `
      <div class="empty-state" style="padding:80px 20px">

        <h3>Serveur inaccessible</h3>
        <p>Vérifiez que le serveur EMS est démarré sur <strong>${API_BASE}</strong>.</p>
        <button class="btn btn-primary" style="margin-top:16px" onclick="init()">🔄 Réessayer</button>

  }
}

function _tplRenderTypeList() {
  const el = document.getElementById('tpl-type-list');
  if (!el) return;
  const defaultKeys = Object.keys(_TYPE_FIELD_DEFAULTS);
  const allTypes = getAllTypes();
  const total = allTypes.length;

  el.innerHTML = allTypes.map((t, i) => {
    const isCustomized = !!_tplWorkingTypes[t];
    const isUserType   = !ITEM_TYPES.includes(t) && !defaultKeys.includes(t);
    const isActive     = _tplSelected === t;

    let actionHtml = '';
    if (!_tplLocked) {
      const upBtn   = '<button class="btn-icon tpl-action" data-idx="' + i + '" data-action="up"'
        + ' title="Remonter" style="font-size:11px;padding:1px 3px;opacity:0' + (i === 0 ? ';visibility:hidden' : '') + '"'
        + ' onclick="event.stopPropagation();_tplActionBtn(this)">▲</button>';
      const downBtn = '<button class="btn-icon tpl-action" data-idx="' + i + '" data-action="down"'
        + ' title="Descendre" style="font-size:11px;padding:1px 3px;opacity:0' + (i === total - 1 ? ';visibility:hidden' : '') + '"'
        + ' onclick="event.stopPropagation();_tplActionBtn(this)">▼</button>';
      if (isUserType) {
        actionHtml = '<button class="btn-icon tpl-action" data-idx="' + i + '" data-action="rename"'
          + ' title="Renommer" style="font-size:12px;padding:1px 5px;opacity:0"'
          + ' onclick="event.stopPropagation();_tplActionBtn(this)">✎</button>'
          + upBtn + downBtn
          + '<button class="btn-icon red tpl-action" data-idx="' + i + '" data-action="delete"'
          + ' title="Supprimer" style="font-size:11px;padding:1px 4px;opacity:0"'
          + ' onclick="event.stopPropagation();_tplActionBtn(this)">✕</button>';
      } else if (isCustomized) {
        actionHtml = '<button class="btn-icon tpl-action" data-idx="' + i + '" data-action="reset"'
          + ' title="Réinitialiser" style="font-size:12px;padding:1px 4px;opacity:0"'
          + ' onclick="event.stopPropagation();_tplActionBtn(this)">↺</button>'
          + upBtn + downBtn;
      } else {
        actionHtml = upBtn + downBtn;
      }
    }

    return '<div class="tpl-type-item" data-idx="' + i + '"'
      + ' onclick="_tplClickItem(this)"'
      + ' style="display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:5px;cursor:pointer;font-size:13px;border:1px solid '
      + (isActive ? '#bfdbfe' : 'transparent') + ';' + (isActive ? 'background:#eff6ff;' : '') + '"'
      + ' onmouseenter="this.querySelectorAll(\'.tpl-action\').forEach(b=>b.style.opacity=\'1\')"'
      + ' onmouseleave="this.querySelectorAll(\'.tpl-action\').forEach(b=>b.style.opacity=\'0\')">'
      + '<span style="flex:1">' + escHtml(t) + '</span>'
      + actionHtml
      + '</div>';
  }).join('');

  el._typeIndex = allTypes;
}

function _tplClickItem(el) {
  const idx = parseInt(el.dataset.idx, 10);
  const list = document.getElementById('tpl-type-list');
  const typeName = list && list._typeIndex ? list._typeIndex[idx] : null;
  if (typeName != null) _tplSelectType(typeName);
}

function _tplActionBtn(btn) {
  const idx = parseInt(btn.dataset.idx, 10);
  const list = document.getElementById('tpl-type-list');
  const typeName = list && list._typeIndex ? list._typeIndex[idx] : null;
  if (typeName == null) return;
  if (btn.dataset.action === 'reset') _tplResetType(typeName);
  else if (btn.dataset.action === 'delete') _tplDeleteUserType(typeName);
  else if (btn.dataset.action === 'rename') _tplRenameType(typeName);
  else if (btn.dataset.action === 'up') _tplMoveType(typeName, -1);
  else if (btn.dataset.action === 'down') _tplMoveType(typeName, 1);
}

function _tplSelectType(typeName) {
  _tplSelected = typeName;
  _tplRenderTypeList();

  const header    = document.getElementById('tpl-right-header');
  const fieldList = document.getElementById('tpl-field-list');
  const footer    = document.getElementById('tpl-footer');
  if (!header || !fieldList) return;

  const isUserType = !ITEM_TYPES.includes(typeName) && !Object.keys(_TYPE_FIELD_DEFAULTS).includes(typeName);
  const delBtn = (!_tplLocked && isUserType)
    ? '<button class="btn btn-sm" style="background:#fee2e2;color:#dc2626" onclick="_tplDeleteUserType(\''+typeName.replace(/'/g,"\'")+'\')">🗑 Supprimer</button>'

  if (hint) hint.textContent = _tplWorkingTypes[typeName] ? 'Modèle personnalisé' : (Object.keys(_TYPE_FIELD_DEFAULTS).includes(typeName) ? 'Modèle par défaut (non modifié)' : 'Nouveau type utilisateur');
}

function _initRowDrag(containerId) {
  const c = document.getElementById(containerId);
  if (!c || c._dragInit) return;
  c._dragInit = true;
  let src = null;
  c.addEventListener('dragstart', e => {
    const row = e.target.closest('.tpl-field-row');
    if (!row) { e.preventDefault(); return; }
    src = row;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => src && src.classList.add('drag-fading'), 0);
  });
  c.addEventListener('dragend', () => {
    if (src) src.classList.remove('drag-fading');
    c.querySelectorAll('.drag-over').forEach(r => r.classList.remove('drag-over'));
    src = null;
  });
  c.addEventListener('dragover', e => {
    e.preventDefault();
    const row = e.target.closest('.tpl-field-row');
    c.querySelectorAll('.drag-over').forEach(r => r.classList.remove('drag-over'));
    if (row && row !== src) row.classList.add('drag-over');
  });
  c.addEventListener('drop', e => {
    e.preventDefault();
    const tgt = e.target.closest('.tpl-field-row');
    if (!tgt || tgt === src || !src) return;
    const rows = [...c.querySelectorAll('.tpl-field-row')];
    if (rows.indexOf(src) > rows.indexOf(tgt)) tgt.before(src);
    else tgt.after(src);
    tgt.classList.remove('drag-over');
  });
}

function _tplFieldRowHtml(libelle, valeur, unite, style) {
  // Normalise les anciennes valeurs 'main'/'aux'
  const st = style === 'main' ? 'text' : (style === 'aux' ? 'measure' : (style || 'text'));
  const showValUnit = st === 'measure';
  const showOpts    = st === 'select';
  const styleSelect = '<select class="form-control" style="width:116px;flex-shrink:0;font-size:12px;padding:4px 6px" onchange="_tplChangeStyle(this)">'
    + '<option value="text"'    + (st === 'text'    ? ' selected' : '') + '>Texte</option>'
    + '<option value="measure"' + (st === 'measure' ? ' selected' : '') + '>Mesure</option>'
    + '<option value="date"'    + (st === 'date'    ? ' selected' : '') + '>Date</option>'
    + '<option value="check"'   + (st === 'check'   ? ' selected' : '') + '>Coche</option>'
    + '<option value="select"'   + (st === 'select'   ? ' selected' : '') + '>Liste</option>'
    + '<option value="document"' + (st === 'document' ? ' selected' : '') + '>Document</option>'
    + '</select>';
  const optsHtml = showOpts
    ? buildOptsEditor(unite || '', 'details-unit')
    : '<input class="details-unit" placeholder="Unité" value="' + escHtml(unite || '') + '" style="flex:none;width:70px' + (showValUnit ? '' : ';display:none') + '">';
  return '<div class="details-row tpl-field-row" data-field-style="' + st + '" draggable="true"'
    + ' style="margin-bottom:8px;align-items:' + (showOpts ? 'flex-start' : 'center') + '">'
    + '<span class="tpl-drag-handle" title="Glisser pour réordonner" style="margin-top:' + (showOpts ? '6px' : '0') + '">⠿</span>'
    + styleSelect
    + '<input class="details-key" placeholder="Libellé" value="' + escHtml(libelle || '') + '" style="flex:2;min-width:80px;align-self:flex-start;margin-top:' + (showOpts ? '4px' : '0') + '">'
    + '<input class="details-val" placeholder="Valeur par défaut" value="' + escHtml(valeur || '') + '" style="flex:2;min-width:80px' + (showValUnit ? '' : ';display:none') + '">'
    + optsHtml
    + '<button class="btn-rm-detail" onclick="this.closest(\'.tpl-field-row\').remove()" style="align-self:flex-start;margin-top:' + (showOpts ? '4px' : '0') + '">✕</button>'
    + '</div>';
}

function _tplChangeStyle(sel) {
  const row = sel.closest('.tpl-field-row');
  if (!row) return;
  const newSt  = sel.value;
  const libelle = row.querySelector('.details-key')?.value?.trim() || '';
  // Reconstruire la ligne entière (tag editor a une structure trop différente de simple input)
  const tmp = document.createElement('div');
  tmp.innerHTML = _tplFieldRowHtml(libelle, '', '', newSt);
  const newRow = tmp.firstElementChild;
  row.replaceWith(newRow);
  _initRowDrag('tpl-field-list');
  newRow.querySelector('.details-key')?.focus();
}

function _tplRenderFieldEditor(fields) {
  const el = document.getElementById('tpl-field-list');
  if (!el) return;
  if (!fields.length) {
    el.innerHTML = '<div style="color:var(--text-muted);font-size:13px;margin-top:12px">Aucun champ'
      + (_tplLocked ? '.' : ' — cliquez « + Champ » pour ajouter.') + '</div>';
    return;
  }
  if (_tplLocked) {
    el.innerHTML = '<div style="display:flex;flex-direction:column;gap:5px;padding:2px 0">'
      + fields.map(f => {
          return '<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--gray-bg);border-radius:5px;font-size:13px">'
            + '<span style="color:var(--text-muted);min-width:110px;flex-shrink:0;font-size:12px;font-weight:500">' + escHtml(f.libelle||'—') + '</span>'
            + (f.valeur ? '<span style="color:var(--text);font-size:12px">' + escHtml(f.valeur)
                + (f.unite ? ' <span style="color:var(--text-muted)">'+escHtml(f.unite)+'</span>' : '')
                + '</span>' : '')
            + '</div>';
        }).join('')
      + '</div>';
    return;
  }
  el.innerHTML = fields.map(f => _tplFieldRowHtml(f.libelle, f.valeur, f.unite, f.style || f.type || 'text')).join('');
  _initRowDrag('tpl-field-list');
}

function _tplAddField(type) {
  if (_tplLocked) return;
  const el = document.getElementById('tpl-field-list');
  if (!el) return;
  if (!el.querySelector('.tpl-field-row')) el.innerHTML = '';
  el.insertAdjacentHTML('beforeend', _tplFieldRowHtml('', '', '', type || 'aux'));
  const rows = el.querySelectorAll('.tpl-field-row');
  rows[rows.length - 1]?.querySelector('.details-key')?.focus();
  _initRowDrag('tpl-field-list');
}

async function _tplSaveType() {
  if (_tplLocked || !_tplSelected) return;
  const rows = document.querySelectorAll('#tpl-field-list .tpl-field-row');
  const fields = [];
  rows.forEach(row => {
    const l  = row.querySelector('.details-key')?.value?.trim() || '';
    const st = row.dataset.fieldStyle || 'text';
    if (l) {
      const field = {style: st, libelle: l, valeur: '', unite: ''};
      if (st === 'measure') {
        field.valeur = row.querySelector('.details-val')?.value?.trim()  || '';
        field.unite  = row.querySelector('.details-unit')?.value?.trim() || '';
      } else if (st === 'select') {
        // Lire depuis le hidden input du tag editor
        field.unite = row.querySelector('.details-unit')?.value?.trim() || '';
      }
      fields.push(field);
    }
  });
  _tplWorkingTypes[_tplSelected] = fields;
  try {
    await PUT(`/modeles-chapitre/${encodeURIComponent(_tplSelected)}`, { fields });
  } catch(e) { toast('Erreur sauvegarde modèle : ' + e.message, 'error'); return; }
  state.chapterTemplates[_tplSelected] = fields;
  // Refresh display
  _tplRenderTypeList();
  _tplSelectType(_tplSelected);
  toast('Modèle "' + _tplSelected + '" enregistré', 'success');
}

async function _tplNewType() {
  if (_tplLocked) return;
  const name = window.prompt('Nom du nouveau type / catégorie :');
  if (!name || !name.trim()) return;
  const typeName = name.trim();
  if (!_tplWorkingTypes[typeName]) _tplWorkingTypes[typeName] = [];
  try {
    await PUT(`/modeles-chapitre/${encodeURIComponent(typeName)}`, { fields: _tplWorkingTypes[typeName] });
  } catch(e) { toast('Erreur création type : ' + e.message, 'error'); return; }
  state.chapterTemplates[typeName] = _tplWorkingTypes[typeName];
  await saveCustomType(typeName);
  // Ajouter à la fin de l'ordre global
  const order = getTypeOrder();
  if (!order.includes(typeName)) { order.push(typeName); await saveTypeOrder(order); }
  _tplRenderTypeList();
  _tplSelectType(typeName);
}

async function _tplResetType(typeName) {
  delete _tplWorkingTypes[typeName];
  try { await DEL(`/modeles-chapitre/${encodeURIComponent(typeName)}`); }
  catch(e) { toast('Erreur réinitialisation : ' + e.message, 'error'); return; }
  delete state.chapterTemplates[typeName];
  _tplRenderTypeList();
  _tplSelectType(typeName);
  toast('Modèle "' + typeName + '" réinitialisé au défaut', 'info');
}

async function _tplDeleteUserType(typeName) {
  if (_tplLocked) return;
  if (!window.confirm('Supprimer définitivement le type "' + typeName + '" ?')) return;
  delete _tplWorkingTypes[typeName];
  try { await DEL(`/modeles-chapitre/${encodeURIComponent(typeName)}`); }
  catch(e) { toast('Erreur suppression : ' + e.message, 'error'); return; }
  delete state.chapterTemplates[typeName];
  const ct = getCustomTypes().filter(t => t !== typeName);
  state.chapterCustomTypes = ct;
  await PUT('/modeles-chapitre/config', { custom_types: ct });
  // Retirer de l'ordre global
  await saveTypeOrder(getTypeOrder().filter(t => t !== typeName));
  if (_tplSelected === typeName) {
    _tplSelected = null;
    const header = document.getElementById('tpl-right-header');
    const fieldList = document.getElementById('tpl-field-list');
    const footer = document.getElementById('tpl-footer');
    if (header) header.innerHTML = '<span style="color:var(--text-muted);font-size:13px">← Sélectionnez un type pour éditer ses champs</span>';
    if (fieldList) fieldList.innerHTML = '';
    if (footer) footer.style.display = 'none';
  }
  _tplRenderTypeList();
  toast('Type "' + typeName + '" supprimé', 'info');
}

async function _tplRenameType(oldName) {
  if (_tplLocked) return;
  const newName = window.prompt('Nouveau nom pour "' + oldName + '" :', oldName);
  if (!newName || !newName.trim() || newName.trim() === oldName) return;
  const name = newName.trim();
  try {
    if (_tplWorkingTypes[oldName]) {
      _tplWorkingTypes[name] = _tplWorkingTypes[oldName];
      delete _tplWorkingTypes[oldName];
      await PUT(`/modeles-chapitre/${encodeURIComponent(name)}`, { fields: _tplWorkingTypes[name] });
      await DEL(`/modeles-chapitre/${encodeURIComponent(oldName)}`);
      state.chapterTemplates[name] = _tplWorkingTypes[name];
      delete state.chapterTemplates[oldName];
    }
    const ct = getCustomTypes().slice();
    const idx = ct.indexOf(oldName);
    if (idx >= 0) ct[idx] = name; else ct.push(name);
    state.chapterCustomTypes = ct;
    await PUT('/modeles-chapitre/config', { custom_types: ct });
    // Renommer dans l'ordre global
    const order = getTypeOrder();
    const oi = order.indexOf(oldName);
    if (oi >= 0) order[oi] = name; else order.push(name);
    await saveTypeOrder(order);
  } catch(e) { toast('Erreur renommage : ' + e.message, 'error'); return; }
  if (_tplSelected === oldName) _tplSelected = name;
  _tplRenderTypeList();
  if (_tplSelected === name) _tplSelectType(name);
  toast('Type renommé : "' + name + '"', 'success');
}

async function _tplMoveType(typeName, dir) {
  if (_tplLocked) return;
  try {
    const all = getAllTypes();
    const idx = all.indexOf(typeName);
    if (idx < 0) return;
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= all.length) return;
    [all[idx], all[newIdx]] = [all[newIdx], all[idx]];
    await saveTypeOrder(all);
    _tplRenderTypeList();
    if (_tplSelected === typeName) _tplSelectType(typeName);
  } catch(e) {}
}

async function _tplCreateType() {
  if (_tplLocked) return;
  const input = document.getElementById('tpl-new-type-input');
  if (!input) return;
  const typeName = input.value.trim();
  if (!typeName) { input.focus(); return; }
  if (!_tplWorkingTypes[typeName]) _tplWorkingTypes[typeName] = [];
  try {
    await PUT(`/modeles-chapitre/${encodeURIComponent(typeName)}`, { fields: _tplWorkingTypes[typeName] });
  } catch(e) { toast('Erreur création type : ' + e.message, 'error'); return; }
  state.chapterTemplates[typeName] = _tplWorkingTypes[typeName];
  await saveCustomType(typeName);
  const order = getTypeOrder();
  if (!order.includes(typeName)) { order.push(typeName); await saveTypeOrder(order); }
  input.value = '';
  _tplRenderTypeList();
  _tplSelectType(typeName);
}

async function _tplToggleLock() {
  if (_tplLocked) {
    const ok = window.confirm(
      'Déverrouiller les modèles de chapitres ?\n\n'
      + 'Cela permettra de modifier l\'ordre des types, leurs noms, leurs champs pré-remplis et d\'en créer de nouveaux.'
    );
    if (!ok) return;
    _tplLocked = false;
  } else {
    _tplLocked = true;
  }
  state.chapterTemplatesLocked = _tplLocked;
  try { await PUT('/modeles-chapitre/config', { locked: _tplLocked }); }
  catch(e) { toast('Erreur sauvegarde verrou : ' + e.message, 'error'); }
  // Mettre à jour tous les boutons cadenas présents dans la page
  document.querySelectorAll('.tpl-lock-btn').forEach(btn => {
    const isTopbar = btn.classList.contains('topbar-btn');
    btn.textContent = _tplLocked ? (isTopbar ? '🔒 Verrouillé' : '🔒') : (isTopbar ? '🔓 Déverrouillé' : '🔓');
    btn.title = _tplLocked ? 'Déverrouiller les modèles' : 'Verrouiller les modèles';
  });
  // Activer/désactiver l'input "nouveau type" (vue page complète)
  const newInput = document.getElementById('tpl-new-type-input');
  if (newInput) { newInput.disabled = _tplLocked; newInput.style.opacity = _tplLocked ? '.45' : '1'; }
  const createBtn = newInput?.nextElementSibling;
  if (createBtn) { createBtn.disabled = _tplLocked; createBtn.style.opacity = _tplLocked ? '.45' : '1'; }
  // Activer/désactiver le bouton "+" du modal
  document.querySelectorAll('.tpl-new-type-btn').forEach(btn => {
    btn.disabled = _tplLocked; btn.style.opacity = _tplLocked ? '.45' : '1';
  });
  _tplRenderTypeList();
  if (_tplSelected) _tplSelectType(_tplSelected);
}
