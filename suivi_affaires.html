function renderFacturationGlobale() {
  // ── Calcul par affaire ──
  const billing = state.affaires.map(a => {
    const ht  = parseHT(a.prix_ht);
    const exo = a.exonere_tva == 1;
    const ttc = ht !== null ? (exo ? ht : ht * 1.20) : null;
    const echs = getEffectiveEcheances(a);
    const totalPaye = echs.reduce((s, e) => s + (parseFloat(e.montant_paye) || 0), 0);
    const reste     = ttc !== null ? ttc - totalPaye : null; // reste réel = TTC − encaissé
    return { ...a, _ht: ht, _ttc: ttc, _paye: totalPaye, _reste: reste };
  });

  // ── Agrégats globaux ──
  const caTotTTC  = billing.reduce((s, b) => s + (b._ttc || 0), 0);
  const totPaye   = billing.reduce((s, b) => s + b._paye, 0);
  // TVA encaissée : part de TVA (20 %) contenue dans les montants payés (TTC) des affaires non exonérées
  const totPayeTVA = billing.reduce((s, b) => s + (b.exonere_tva == 1 ? 0 : b._paye * (0.20 / 1.20)), 0);
  const totMontDu = caTotTTC; // référence = somme des TTC
  // Reste HT : pour les non-exonérés on divise par 1,20 ; pour les exonérés le reste est déjà HT
  const totResteHT = billing.reduce((s, b) => {
    const r = Math.max(0, b._reste || 0);
    return s + (r > 0.005 ? (b.exonere_tva == 1 ? r : r / 1.20) : 0);
  }, 0);
  const nbTotal   = billing.length;
  const nbSoldees = billing.filter(b => b._reste !== null && b._reste <= 0.005).length;
  const nbReste   = billing.filter(b => b._ttc !== null && (b._reste === null || b._reste > 0.005)).length;
  const nbSansPrix= billing.filter(b => b._ttc  === null).length;

  // ── CA des affaires en cours (hors Clos/Annulé), par année fiscale (livraison prévue) ──
  const caEnCours = caEnCoursStats(state.affaires);

  // ── Répartition par statut ──
  const statutColors = { 'En cours': '#2563eb', 'En attente': '#d97706', 'À facturer': '#7c3aed', 'Facturé': '#0d9488', 'Clos': '#059669', 'Annulé': '#9ca3af' };
  const byStatut = ['En cours', 'En attente', 'À facturer', 'Facturé', 'Clos', 'Annulé'].map(s => {
    const grp = billing.filter(b => b.statut === s);
    return { statut: s, nb: grp.length,
      ttc:  grp.reduce((x, b) => x + (b._ttc  || 0), 0),
      paye: grp.reduce((x, b) => x + b._paye,         0),
      reste:grp.reduce((x, b) => x + Math.max(0, b._reste || 0), 0) };
  }).filter(s => s.nb > 0);
  const maxStatTTC = Math.max(...byStatut.map(s => s.ttc), 1);

  // ── Top clients ──
  const cliMap = {};
  billing.forEach(b => {
    const k = b.client_nom || '— Sans client —';
    if (!cliMap[k]) cliMap[k] = { ttc: 0, paye: 0, reste: 0, nb: 0 };
    cliMap[k].ttc   += b._ttc || 0;
    cliMap[k].paye  += b._paye;
    cliMap[k].reste += Math.max(0, b._reste || 0);
    cliMap[k].nb++;
  });
  const topCli = Object.entries(cliMap).sort((a, b) => b[1].ttc - a[1].ttc).slice(0, 7);
  const maxCliTTC = topCli.length ? topCli[0][1].ttc : 1;

  // ── Helpers de dates / périodes (réutilisés par les histogrammes et la trésorerie) ──
  const parseFrDate = s => {
    const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec((s || '').trim());
    if (!m) return null;
    const d = new Date(+m[3], +m[2] - 1, +m[1]);
    return isNaN(d) ? null : d;
  };
  const moisAbrev = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
  const isoWeekInfo = d => {
    const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dayNum = (dt.getUTCDay() + 6) % 7; // lundi = 0
    dt.setUTCDate(dt.getUTCDate() - dayNum + 3); // jeudi de la semaine ISO
    const firstThursday = new Date(Date.UTC(dt.getUTCFullYear(), 0, 4));
    const firstDayNum = (firstThursday.getUTCDay() + 6) % 7;
    firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDayNum + 3);
    const week = 1 + Math.round((dt - firstThursday) / (7 * 86400000));
    return { isoYear: dt.getUTCFullYear(), week };
  };

  // ── Échelle Y "arrondie" et régulière (graduations lisibles), réutilisée par tous les histogrammes ──
  const niceStep = raw => {
    const exp   = Math.pow(10, Math.floor(Math.log10(raw)));
    const frac  = raw / exp;
    const nice  = frac <= 1 ? 1 : frac <= 2 ? 2 : frac <= 2.5 ? 2.5 : frac <= 5 ? 5 : 10;
    return nice * exp;
  };
  const niceScale = (maxVal, targetTicks = 4) => {
    if (!(maxVal > 0)) return { niceMax: 1, ticks: [0, 1] };
    const step    = niceStep(maxVal / targetTicks);
    const niceMax = Math.ceil(maxVal / step) * step;
    const ticks   = [];
    for (let v = 0; v <= niceMax + step / 1e6; v += step) ticks.push(v);
    return { niceMax, ticks };
  };

  // ── Rendu générique d'histogramme SVG : grille Y régulière + axe X lisible quel que soit le nombre
  //    de buckets (semaine/mois/année) — réutilisé par les 6 histogrammes Ventes/Commandes/Trésorerie ──
  const buildBarChart = (keys, buckets, series, opts = {}) => {
    const BAR_H = 120, MARGIN_R = 10, MARGIN_T = 10, GAP = 8;
    const n     = keys.length;
    const BAR_W = n > 0 ? Math.max(20, Math.min(56, Math.floor(560 / n) - GAP)) : 56;
    const fmt   = opts.formatValue || fmtEurCompact;
    const rawMax = keys.reduce((m, k) => Math.max(m, ...series.map(s => s.get(buckets[k]))), 0);
    const { niceMax, ticks } = niceScale(rawMax);
    // Marge gauche adaptée à la largeur du plus grand libellé d'échelle (ex. "1,2 M €") : une marge fixe
    // tronquait ou faisait chevaucher les valeurs élevées avec la grille/les barres.
    const AXIS_FONT = 9;
    const maxTickLabelW = ticks.reduce((w, t) => Math.max(w, fmt(t).length * AXIS_FONT * 0.62), 0);
    const MARGIN_L = Math.max(46, Math.ceil(maxTickLabelW) + 16);
    const svgW  = MARGIN_L + n * (BAR_W + GAP) + MARGIN_R;

    // Grille horizontale à intervalles réguliers, avec graduation Y (même échelle pour toutes les barres)
    const gridSvg = ticks.map(t => {
      const y = MARGIN_T + BAR_H - Math.round(t / niceMax * BAR_H);
      return `
        <line x1="${MARGIN_L - 4}" y1="${y}" x2="${svgW - MARGIN_R}" y2="${y}" stroke="${t === 0 ? '#cbd5e1' : '#eef1f5'}" stroke-width="1"/>
        <text x="${MARGIN_L - 8}" y="${y + 3}" text-anchor="end" font-size="9" fill="#9ca3af">${fmt(t)}</text>`;
    }).join('');

    // Si les barres sont trop serrées pour que chaque étiquette reste lisible à plat, on n'en affiche
    // qu'une sur N (survol de la barre via <title> pour le détail complet) plutôt que de les faire se chevaucher
    const estLabelW  = 32; // largeur approx. d'une étiquette "S12 26" / "Jan 26" / "2026" à 10px
    const labelStep  = Math.max(1, Math.ceil(estLabelW / (BAR_W + GAP)));
    const showValues = BAR_W >= 30; // valeurs numériques sous les barres seulement si la place ne les fait pas chevaucher
    const labelY  = MARGIN_T + BAR_H + 18;
    const valueY0 = labelY + 14;

    const barsSvg = keys.map((k, i) => {
      const d = buckets[k];
      const x = MARGIN_L + i * (BAR_W + GAP);
      const rectsSvg = series.map(s => {
        const v = s.get(d);
        const h = Math.round(v / niceMax * BAR_H);
        const col = s.colorOf ? s.colorOf(d) : s.color;
        return `<rect x="${x}" y="${MARGIN_T + BAR_H - h}" width="${BAR_W}" height="${h}" rx="4" fill="${col}"${s.opacity != null ? ` fill-opacity="${s.opacity}"` : ''}/>`;
      }).join('');
      const labelSvg = (i % labelStep === 0)
        ? `<text x="${x + BAR_W/2}" y="${labelY}" text-anchor="middle" font-size="10.5" fill="#6b7280">${d.label}</text>` : '';
      const valuesSvg = (showValues && i % labelStep === 0)
        ? series.map((s, si) => `<text x="${x + BAR_W/2}" y="${valueY0 + si * 12}" text-anchor="middle" font-size="9.5" font-weight="${si === series.length - 1 ? 600 : 400}" fill="${s.colorOf ? s.colorOf(d) : s.color}">${fmt(s.get(d))}</text>`).join('')
        : '';
      const tooltip = opts.tooltip ? `<title>${opts.tooltip(d)}</title>` : '';
      // Groupé dans un <g> : un <title> placé en frère des <rect> (et non comme enfant direct)
      // ne s'applique à aucun d'eux — le survol retombe alors sur le premier <title> du <svg>
      // parent, ce qui affichait toujours l'infobulle du 1er bucket quelle que soit la barre survolée.
      return `<g>${rectsSvg}${labelSvg}${valuesSvg}${tooltip}</g>`;
    }).join('');

    const height = valueY0 + series.length * 12 - 4;
    return { keys, svgW, height, svg: `<svg width="${svgW}" height="${height}" style="display:block">${gridSvg}${barsSvg}</svg>` };
  };

  // ── Histogrammes CA par période (achat / livraison), chacun filtrable indépendamment ──
  const unitLabel = u => ({ annee: 'année', mois: 'mois', semaine: 'semaine' })[u];
  const bucketOf = (d, unit) => {
    if (unit === 'mois') {
      const y = d.getFullYear(), m = d.getMonth() + 1;
      return { key: `${y}-${String(m).padStart(2,'0')}`, label: `${moisAbrev[m-1]} ${String(y).slice(2)}` };
    }
    if (unit === 'semaine') {
      const { isoYear, week } = isoWeekInfo(d);
      return { key: `${isoYear}-W${String(week).padStart(2,'0')}`, label: `S${week} ${String(isoYear).slice(2)}` };
    }
    return { key: String(d.getFullYear()), label: String(d.getFullYear()) };
  };
  // Montant HT par période — pas de notion d'encaissé, seulement le prix HT de l'affaire
  const buildHtHisto = (dateField, unit, fromD, toD, metricLabel) => {
    const buckets = {};
    billing.forEach(b => {
      const d = parseFrDate(b[dateField]);
      if (!d) return;
      if (fromD && d < fromD) return;
      if (toD   && d > toD)   return;
      const { key, label } = bucketOf(d, unit);
      if (!buckets[key]) buckets[key] = { label, ht: 0 };
      buckets[key].ht += b._ht || 0;
    });
    const keys = Object.keys(buckets).sort();
    return buildBarChart(keys, buckets, [{ get: d => d.ht, color: '#2563eb' }], {
      tooltip: d => `${d.label} — ${metricLabel} : ${fmtEur(d.ht)}`,
    });
  };
  // Distinction prévu (HT) / encaissé (converti en HT) — utilisée par l'histogramme de livraison
  const buildHisto = (dateField, unit, fromD, toD) => {
    const buckets = {};
    billing.forEach(b => {
      const d = parseFrDate(b[dateField]);
      if (!d) return;
      if (fromD && d < fromD) return;
      if (toD   && d > toD)   return;
      const { key, label } = bucketOf(d, unit);
      if (!buckets[key]) buckets[key] = { label, ht: 0, payeHT: 0 };
      const exo = b.exonere_tva == 1;
      buckets[key].ht     += b._ht || 0;
      buckets[key].payeHT += exo ? b._paye : b._paye / 1.20;
    });
    const keys = Object.keys(buckets).sort();
    return buildBarChart(keys, buckets, [
      { get: d => d.ht,     color: '#bfdbfe' },
      { get: d => d.payeHT, color: '#2563eb' },
    ], {
      tooltip: d => `${d.label} — Prévu HT : ${fmtEur(d.ht)} | Encaissé HT : ${fmtEur(d.payeHT)}`,
    });
  };
  const achatUnit  = state.histoAchatUnit || 'annee';
  const achatFromD = state.histoAchatFrom ? new Date(state.histoAchatFrom + 'T00:00:00') : null;
  const achatToD   = state.histoAchatTo   ? new Date(state.histoAchatTo   + 'T23:59:59') : null;
  const histoAchat  = buildHtHisto('date_achat', achatUnit, achatFromD, achatToD, 'Prises de commande HT');

  const livrUnit  = state.histoLivraisonUnit || 'annee';
  const livrFromD = state.histoLivraisonFrom ? new Date(state.histoLivraisonFrom + 'T00:00:00') : null;
  const livrToD   = state.histoLivraisonTo   ? new Date(state.histoLivraisonTo   + 'T23:59:59') : null;
  const histoLivraison = buildHisto('date_fin_prevue', livrUnit, livrFromD, livrToD);

  // ── Barre de filtre (plage de dates + unité) réutilisée par chaque histogramme ──
  const filterToolbar = (chart, unit, from, to) => {
    const cfg = HISTO_FILTER_DEFAULTS[chart];
    return `
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <select id="${cfg.idBase}-unit" class="form-control" style="width:auto;font-size:12px;padding:4px 24px 4px 8px" onchange="updateHistoFilter('${chart}')">
        <option value="semaine" ${unit==='semaine'?'selected':''}>Semaine</option>
        <option value="mois" ${unit==='mois'?'selected':''}>Mois</option>
        <option value="annee" ${unit==='annee'?'selected':''}>Année</option>
      </select>
      <input type="date" id="${cfg.idBase}-from" class="form-control" style="width:auto;font-size:12px;padding:4px 8px" value="${from||''}" onchange="updateHistoFilter('${chart}')">
      <span style="font-size:12px;color:var(--text-muted)">→</span>
      <input type="date" id="${cfg.idBase}-to" class="form-control" style="width:auto;font-size:12px;padding:4px 8px" value="${to||''}" onchange="updateHistoFilter('${chart}')">
      ${(from || to || unit !== cfg.unit) ? `<button class="topbar-btn" style="padding:4px 10px;font-size:12px" onclick="resetHistoFilter('${chart}')">✕ Réinitialiser</button>` : ''}
    </div>`;
  };

  // ── Affaires avec reste à payer ──
  const avecReste = billing.filter(b => b._reste !== null && b._reste > 0.005)
    .sort((a, b) => b._reste - a._reste);

  // ── Trésorerie prévisionnelle (basée sur la date prévisionnelle de chaque stade,
  //    ou à défaut la date de clôture/livraison estimée de l'affaire) ──
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const pendingStages = [];
  billing.forEach(b => {
    const echs = getEffectiveEcheances(b);
    echs.forEach(e => {
      const montantStade = e._base !== null ? e._base * (parseFloat(e.pourcentage) || 0) / 100 : null;
      const paye  = parseFloat(e.montant_paye) || 0;
      const reste = montantStade !== null ? montantStade - paye : null;
      if (reste === null || reste <= 0.005) return;
      const dateStr    = e.date_prevue || b.date_fin_prevue || b.date_cloture || '';
      const dateObj    = parseFrDate(dateStr);
      const estimeeAff = !e.date_prevue && !!dateStr; // faute de date propre au stade, on retombe sur l'affaire
      const exo        = b.exonere_tva == 1;
      const montantHT  = exo ? reste : reste / 1.20; // reste est en TTC (ou déjà en HT si exonéré) — pas de déduction de TVA sur les affaires exonérées
      pendingStages.push({ affaire: b, stade: e._lotLibelle ? `${e._lotLibelle} — ${e.stade || '—'}` : (e.stade || '—'), montant: reste, montantHT, exo, dateStr, dateObj, estimeeAff });
    });
  });
  pendingStages.sort((a, b) => {
    if (!a.dateObj && !b.dateObj) return 0;
    if (!a.dateObj) return 1;
    if (!b.dateObj) return -1;
    return a.dateObj - b.dateObj;
  });
  const totalEntreeEstimee   = pendingStages.reduce((s, p) => s + p.montant, 0);
  const totalEntreeEstimeeHT = pendingStages.reduce((s, p) => s + p.montantHT, 0);

  // ── Regroupement par période pour le graphique de trésorerie, filtrable indépendamment ──
  const tresorUnit  = state.tresorUnit || 'mois';
  const tresorFromD = state.tresorFrom ? new Date(state.tresorFrom + 'T00:00:00') : null;
  const tresorToD   = state.tresorTo   ? new Date(state.tresorTo   + 'T23:59:59') : null;
  const cashBuckets = {}; // key -> { label, value }
  let nonPlanifie = 0, retard = 0;
  pendingStages.forEach(p => {
    if (!p.dateObj) { nonPlanifie += p.montant; return; }
    if (tresorFromD && p.dateObj < tresorFromD) return;
    if (tresorToD   && p.dateObj > tresorToD)   return;
    if (p.dateObj < today) { retard += p.montant; return; }
    const { key, label } = bucketOf(p.dateObj, tresorUnit);
    if (!cashBuckets[key]) cashBuckets[key] = { label, value: 0 };
    cashBuckets[key].value += p.montant;
  });
  const orderedKeys = [];
  if (retard > 0.005) orderedKeys.push('Retard');
  orderedKeys.push(...Object.keys(cashBuckets).sort());
  if (nonPlanifie > 0.005) orderedKeys.push('NonPlanifie');
  const colorBucket   = k => k === 'Retard' ? '#dc2626' : k === 'NonPlanifie' ? '#9ca3af' : '#2563eb';
  const cashBuckets2  = {}; // buckets uniformisés {label, value, color} indexés par clé, pour buildBarChart
  orderedKeys.forEach(k => {
    cashBuckets2[k] = {
      label: k === 'Retard' ? 'Retard' : k === 'NonPlanifie' ? 'Non planifié' : cashBuckets[k].label,
      value: k === 'Retard' ? retard : k === 'NonPlanifie' ? nonPlanifie : cashBuckets[k].value,
      color: colorBucket(k),
    };
  });
  const cashChart = buildBarChart(orderedKeys, cashBuckets2, [
    { get: d => d.value, colorOf: d => d.color },
  ], {
    tooltip: d => `${d.label} — ${fmtEur(d.value)}`,
  });

  // ── Sorties prévues (achats) : même logique que les entrées, basée sur l'échéancier
  //    de paiement de chaque bon de commande, ou à défaut sur son montant total ──
  const pendingSorties = [];
  (state.facturationBons || []).forEach(b => {
    if (b.statut === 'Annulé' || b.date_reglement) return;
    let pays = [];
    try { pays = JSON.parse(b.paiements || '[]'); } catch(_) {}
    const base = b.total_ttc || 0;
    const exo  = b.exonere_tva == 1;
    if (pays.length) {
      pays.forEach(e => {
        const montantStade = base * (parseFloat(e.pourcentage) || 0) / 100;
        const paye  = parseFloat(e.montant_paye) || 0;
        const reste = montantStade - paye;
        if (reste <= 0.005) return;
        const dateStr   = e.date_prevue || b.date_livraison_prevue || '';
        const dateObj   = parseFrDate(dateStr);
        const estimeeBc = !e.date_prevue && !!dateStr;
        const montantHT = exo ? reste : reste / 1.20;
        pendingSorties.push({ bon: b, stade: e.stade || '—', montant: reste, montantHT, exo, dateStr, dateObj, estimeeBc });
      });
    } else if (base > 0.005) {
      const dateStr   = b.date_livraison_prevue || '';
      const dateObj   = parseFrDate(dateStr);
      const montantHT = exo ? base : base / 1.20;
      pendingSorties.push({ bon: b, stade: 'Solde', montant: base, montantHT, exo, dateStr, dateObj, estimeeBc: false });
    }
  });

  // ── Trésorerie prévisionnelle combinée : entrées (vente) − sorties (achats), par période ──
  const tresorRows = {}; // key -> { label, entree, sortie }
  let tresEntreeRetard = 0, tresEntreeNonPlan = 0, tresSortieRetard = 0, tresSortieNonPlan = 0;
  const addToTresor = (list, field) => {
    list.forEach(p => {
      if (!p.dateObj) { if (field === 'entree') tresEntreeNonPlan += p.montant; else tresSortieNonPlan += p.montant; return; }
      if (tresorFromD && p.dateObj < tresorFromD) return;
      if (tresorToD   && p.dateObj > tresorToD)   return;
      if (p.dateObj < today) { if (field === 'entree') tresEntreeRetard += p.montant; else tresSortieRetard += p.montant; return; }
      const { key, label } = bucketOf(p.dateObj, tresorUnit);
      if (!tresorRows[key]) tresorRows[key] = { label, entree: 0, sortie: 0 };
      tresorRows[key][field] += p.montant;
    });
  };
  addToTresor(pendingStages, 'entree');
  addToTresor(pendingSorties, 'sortie');

  const hasTresRetard  = tresEntreeRetard > 0.005 || tresSortieRetard > 0.005;
  const hasTresNonPlan = tresEntreeNonPlan > 0.005 || tresSortieNonPlan > 0.005;
  let soldeCumule = 0;
  const tresorTableLines = [];
  if (hasTresRetard) {
    soldeCumule += tresEntreeRetard - tresSortieRetard;
    tresorTableLines.push({ label: 'Retard', entree: tresEntreeRetard, sortie: tresSortieRetard, solde: tresEntreeRetard - tresSortieRetard, cumule: soldeCumule, isRetard: true });
  }
  Object.keys(tresorRows).sort().forEach(k => {
    const r = tresorRows[k];
    const solde = r.entree - r.sortie;
    soldeCumule += solde;
    tresorTableLines.push({ label: r.label, entree: r.entree, sortie: r.sortie, solde, cumule: soldeCumule });
  });
  if (hasTresNonPlan) {
    soldeCumule += tresEntreeNonPlan - tresSortieNonPlan;
    tresorTableLines.push({ label: 'Non planifié', entree: tresEntreeNonPlan, sortie: tresSortieNonPlan, solde: tresEntreeNonPlan - tresSortieNonPlan, cumule: soldeCumule, isNonPlan: true });
  }
  const tresorTotalEntree = tresorTableLines.reduce((s, r) => s + r.entree, 0);
  const tresorTotalSortie = tresorTableLines.reduce((s, r) => s + r.sortie, 0);

  const tresorTableRows = tresorTableLines.map(r => `
    <tr style="border-bottom:1px solid var(--border);${r.isRetard ? 'background:#fef2f2' : r.isNonPlan ? 'background:var(--gray-bg)' : ''}">
      <td style="padding:9px 10px;font-weight:${r.isRetard || r.isNonPlan ? 600 : 500};${r.isRetard ? 'color:#dc2626' : ''}">${escHtml(r.label)}</td>
      <td style="padding:9px 10px;text-align:right;color:#059669;font-weight:600">${r.entree > 0.005 ? fmtEur(r.entree) : '—'}</td>
      <td style="padding:9px 10px;text-align:right;color:#dc2626;font-weight:600">${r.sortie > 0.005 ? '− ' + fmtEur(r.sortie) : '—'}</td>
      <td style="padding:9px 10px;text-align:right;font-weight:700;color:${r.solde >= 0 ? '#059669' : '#dc2626'}">${r.solde >= 0 ? '+' : ''}${fmtEur(r.solde)}</td>
      <td style="padding:9px 10px;text-align:right;font-weight:700;color:${r.cumule >= 0 ? '#1e3a5f' : '#dc2626'}">${fmtEur(r.cumule)}</td>
    </tr>`).join('');

  // ── Graphique combiné : barres entrées/sorties (de part et d'autre du zéro) + courbe du solde cumulé ──
  // Le "Retard" n'est pas une période du même axe temporel que les autres colonnes : il est affiché comme
  // une barre à part (première colonne), mais SANS être relié à la courbe de solde cumulé, qui ne parcourt
  // que les vraies périodes datées. Le "Non planifié" n'a pas de date du tout : il n'apparaît pas dans le
  // graphique (uniquement dans le tableau), faute de pouvoir être positionné sur l'axe temps.
  const buildTresorCombo = (periodLines, retardLine) => {
    const BAR_H = 150, MARGIN_R = 12, MARGIN_T = 14, MARGIN_B = 30, GAP = 10;
    const SEP = 26; // séparation supplémentaire entre la colonne "Retard" et les vraies périodes
    const allBars = retardLine ? [retardLine, ...periodLines] : periodLines;
    const n = allBars.length;
    if (!n) return { svg: '', height: 0 };
    const BAR_W  = Math.max(22, Math.min(64, Math.floor(600 / n) - GAP));
    const sepW   = retardLine ? SEP : 0;

    const maxPos = Math.max(0, 1, ...allBars.map(r => r.entree), ...periodLines.map(r => r.cumule));
    const minNeg = Math.min(0, ...allBars.map(r => -r.sortie), ...periodLines.map(r => r.cumule));
    const step    = niceStep(Math.max(maxPos, -minNeg, 1) / 4);
    const niceMax = Math.ceil(maxPos / step) * step || step;
    const niceMin = minNeg < 0 ? -(Math.ceil(-minNeg / step) * step) : 0;
    const span    = niceMax - niceMin || 1;
    const yOf     = v => MARGIN_T + BAR_H - ((v - niceMin) / span) * BAR_H;
    const zeroY   = yOf(0);

    const ticks = [];
    for (let v = niceMin; v <= niceMax + step / 1e6; v += step) ticks.push(v);
    // Marge gauche adaptée à la largeur du plus grand libellé (les montants négatifs "- 1,2 M €" sont
    // plus longs que les positifs) : une marge fixe faisait chevaucher/tronquer l'échelle sur les gros montants.
    const AXIS_FONT = 9;
    const maxTickLabelW = ticks.reduce((w, t) => Math.max(w, fmtEurCompact(t).length * AXIS_FONT * 0.62), 0);
    const MARGIN_L = Math.max(52, Math.ceil(maxTickLabelW) + 16);
    const svgW   = MARGIN_L + n * (BAR_W + GAP) + sepW + MARGIN_R;

    const gridSvg = ticks.map(t => `
      <line x1="${(MARGIN_L-4).toFixed(1)}" y1="${yOf(t).toFixed(1)}" x2="${(svgW-MARGIN_R).toFixed(1)}" y2="${yOf(t).toFixed(1)}" stroke="${Math.abs(t) < 1e-6 ? '#94a3b8' : '#eef1f5'}" stroke-width="1"/>
      <text x="${(MARGIN_L-8).toFixed(1)}" y="${(yOf(t)+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#9ca3af">${fmtEurCompact(t)}</text>`).join('');

    const estLabelW = 34;
    const labelStep = Math.max(1, Math.ceil(estLabelW / (BAR_W + GAP)));
    const halfGap   = 2;
    // La colonne "Retard" (i=0 si présente) reste collée à MARGIN_L ; toutes les périodes (i>=1) sont
    // décalées d'un cran supplémentaire (sepW) pour créer un espace visuel net entre les deux groupes.
    const xOfBar    = i => MARGIN_L + i * (BAR_W + GAP) + (retardLine && i >= 1 ? sepW : 0);

    // Zone grisée + ligne pointillée délimitant clairement la colonne "Retard" du reste du graphique.
    const sepSvg = retardLine ? (() => {
      const zoneEnd = xOfBar(0) + BAR_W + GAP / 2;
      const lineX   = zoneEnd + sepW / 2 - GAP / 2 + 1;
      return `
      <rect x="${(MARGIN_L - 6).toFixed(1)}" y="${MARGIN_T.toFixed(1)}" width="${(zoneEnd - (MARGIN_L - 6)).toFixed(1)}" height="${BAR_H.toFixed(1)}" fill="#fee2e2" fill-opacity="0.55"/>
      <line x1="${lineX.toFixed(1)}" y1="${MARGIN_T.toFixed(1)}" x2="${lineX.toFixed(1)}" y2="${(MARGIN_T + BAR_H).toFixed(1)}" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    })() : '';

    const barsSvg = allBars.map((r, i) => {
      const x       = xOfBar(i);
      const wHalf   = (BAR_W - halfGap) / 2;
      const yEntree = yOf(r.entree);
      const ySortie = yOf(-r.sortie);
      const entreeRect = r.entree > 0.005
        ? `<rect x="${x.toFixed(1)}" y="${yEntree.toFixed(1)}" width="${wHalf.toFixed(1)}" height="${Math.max(0, zeroY - yEntree).toFixed(1)}" rx="3" fill="#059669"><title>${escHtml(r.label)} — Entrées : ${fmtEur(r.entree)}</title></rect>` : '';
      const sortieRect = r.sortie > 0.005
        ? `<rect x="${(x + wHalf + halfGap).toFixed(1)}" y="${zeroY.toFixed(1)}" width="${wHalf.toFixed(1)}" height="${Math.max(0, ySortie - zeroY).toFixed(1)}" rx="3" fill="#dc2626"><title>${escHtml(r.label)} — Sorties : ${fmtEur(r.sortie)}</title></rect>` : '';
      const labelSvg = (i % labelStep === 0)
        ? `<text x="${(x + BAR_W/2).toFixed(1)}" y="${MARGIN_T + BAR_H + 16}" text-anchor="middle" font-size="10" fill="${r === retardLine ? '#dc2626' : '#6b7280'}">${escHtml(r.label)}</text>` : '';
      return `<g>${entreeRect}${sortieRect}${labelSvg}</g>`;
    }).join('');

    // La courbe de solde cumulé ne relie que les vraies périodes datées, pas la barre "Retard".
    const periodOffset = retardLine ? 1 : 0;
    const linePts = periodLines.map((r, i) => `${(xOfBar(i + periodOffset) + BAR_W/2).toFixed(1)},${yOf(r.cumule).toFixed(1)}`);
    const lineSvg = linePts.length > 1 ? `<polyline points="${linePts.join(' ')}" fill="none" stroke="#1e3a5f" stroke-width="2.2"/>` : '';
    const dotsSvg = periodLines.map((r, i) => {
      const x = xOfBar(i + periodOffset) + BAR_W/2;
      const y = yOf(r.cumule);
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="${r.cumule >= 0 ? '#1e3a5f' : '#dc2626'}"><title>${escHtml(r.label)} — Solde cumulé : ${fmtEur(r.cumule)}</title></circle>`;
    }).join('');

    const height = MARGIN_T + BAR_H + MARGIN_B;
    return { svg: `<svg width="${svgW}" height="${height}" style="display:block">${gridSvg}${sepSvg}${barsSvg}${lineSvg}${dotsSvg}</svg>`, height };
  };
  const chartPeriodLines = tresorTableLines.filter(r => !r.isRetard && !r.isNonPlan);
  const chartRetardLine  = hasTresRetard ? { label: 'Retard', entree: tresEntreeRetard, sortie: tresSortieRetard } : null;
  const tresorComboChart = buildTresorCombo(chartPeriodLines, chartRetardLine);

  // ── Donut SVG ──
  const R = 58, circ = 2 * Math.PI * R;
  const frac     = totMontDu > 0 ? Math.min(1, totPaye / totMontDu) : 0;
  const dashP    = frac * circ;
  const bgCol    = frac >= 1 ? '#d1fae5' : totPaye > 0 ? '#fca5a5' : '#e2e8f0';
  const fgCol    = frac >= 1 ? '#059669' : '#2563eb';
  const donutSvg = `
    <svg width="160" height="160" viewBox="0 0 160 160" style="display:block;margin:0 auto">
      <circle cx="80" cy="80" r="${R}" fill="none" stroke="${bgCol}" stroke-width="18"/>
      ${dashP > 0 ? `<circle cx="80" cy="80" r="${R}" fill="none"
        stroke="${fgCol}" stroke-width="18"
        stroke-dasharray="${dashP.toFixed(2)} ${(circ-dashP).toFixed(2)}"
        stroke-dashoffset="${(circ*0.25).toFixed(2)}"
        stroke-linecap="round"/>` : ''}
      <text x="80" y="76" text-anchor="middle" font-size="20" font-weight="700" fill="${frac>=1?'#059669':'#1e3a5f'}">${(frac*100).toFixed(1)}%</text>
      <text x="80" y="93" text-anchor="middle" font-size="11" fill="#6b7280">encaissé</text>
    </svg>`;

  // ── KPI cards euros ──
  const kpiEur = [
    { label: 'CA affaires en cours', value: fmtEur(caEnCours.total),    col:'#7c3aed', bg:'#f5f3ff' },
    { label: `CA en cours ${new Date().getFullYear()}`, value: fmtEur(caEnCours.parAnnee[String(new Date().getFullYear())] || 0), col:'#7c3aed', bg:'#f5f3ff' },
    { label: 'Encaissé',      value: fmtEur(totPaye),                   col:'#059669', bg:'#d1fae5', sub: `dont TVA : ${fmtEur(totPayeTVA)}` },
    { label: 'Reste à payer HT', value: fmtEur(totResteHT),             col: totResteHT<.01?'#059669':'#dc2626', bg: totResteHT<.01?'#d1fae5':'#fee2e2' },
  ].map(k => `
    <div style="background:${k.bg};border:1px solid ${k.col}22;border-radius:10px;padding:16px 18px;flex:1;min-width:130px">
      <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">${k.label}</div>
      <div style="font-size:18px;font-weight:700;color:${k.col}">${k.value}</div>
      ${k.sub ? `<div style="font-size:10.5px;color:var(--text-muted);margin-top:3px">${k.sub}</div>` : ''}
    </div>`).join('');

  // ── Compteurs ──
  const cptrs = [
    { label:'Affaires total', value: nbTotal,    col:'#1e3a5f' },
    { label:'Soldées',        value: nbSoldees,  col:'#059669' },
    { label:'Avec reste',     value: nbReste,    col:'#dc2626' },
    { label:'Sans prix',      value: nbSansPrix, col:'#d97706' },
  ].map(k => `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 18px;text-align:center;flex:1;min-width:100px">
      <div style="font-size:26px;font-weight:700;color:${k.col}">${k.value}</div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${k.label}</div>
    </div>`).join('');

  // ── Barres par statut ──
  const statutBars = byStatut.map(s => {
    const col     = statutColors[s.statut] || '#6b7280';
    const wTTC    = (s.ttc  / maxStatTTC * 100).toFixed(1);
    const wPaye   = (s.paye / maxStatTTC * 100).toFixed(1);
    return `
      <div style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
          <span style="font-size:12px;font-weight:600;color:${col}">${s.statut}
            <span style="font-weight:400;color:var(--text-muted)">(${s.nb} affaire${s.nb>1?'s':''})</span></span>
          <span style="font-size:12px;color:var(--text-muted)">${s.ttc ? fmtEur(s.ttc) : '—'}</span>
        </div>
        <div style="position:relative;background:#e2e8f0;border-radius:8px;height:12px;overflow:hidden">
          <div style="position:absolute;left:0;top:0;height:100%;width:${wTTC}%;background:${col};opacity:.22;border-radius:8px"></div>
          <div style="position:absolute;left:0;top:0;height:100%;width:${wPaye}%;background:${col};border-radius:8px"></div>
        </div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:3px">
          Encaissé : <strong>${fmtEur(s.paye)}</strong> · Reste : <strong style="color:${s.reste>0?'#dc2626':'#059669'}">${fmtEur(s.reste)}</strong>
        </div>
      </div>`;
  }).join('') || '<p style="color:var(--text-muted);font-size:13px">Aucune donnée.</p>';

  // ── Barres clients ──
  const cliBars = topCli.map(([name, d]) => {
    const wTTC  = (d.ttc  / maxCliTTC * 100).toFixed(1);
    const wPaye = (d.paye / maxCliTTC * 100).toFixed(1);
    return `
      <div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
          <span style="font-size:12px;font-weight:500;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escHtml(name)}">${escHtml(name)}</span>
          <span style="font-size:12px;color:var(--text-muted)">${d.nb} aff. · ${fmtEur(d.ttc)}</span>
        </div>
        <div style="position:relative;background:#e2e8f0;border-radius:8px;height:10px;overflow:hidden">
          <div style="position:absolute;left:0;top:0;height:100%;width:${wTTC}%;background:#2563eb;opacity:.22;border-radius:8px"></div>
          <div style="position:absolute;left:0;top:0;height:100%;width:${wPaye}%;background:#059669;border-radius:8px"></div>
        </div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:3px">
          Payé : <strong style="color:#059669">${fmtEur(d.paye)}</strong>
          · Reste : <strong style="color:${d.reste>0?'#dc2626':'#059669'}">${fmtEur(d.reste)}</strong>
        </div>
      </div>`;
  }).join('') || '<p style="color:var(--text-muted);font-size:13px">Aucun client.</p>';

  // ── Tableau entrée estimée : tri selon state.tableEntreeSortCol/Dir ──
  const entreeGetters = {
    num_affaire: p => p.affaire.num_affaire || '',
    nom_projet:  p => p.affaire.nom_projet || p.affaire.navire_machine || '',
    client_nom:  p => p.affaire.client_nom || '',
    stade:       p => p.stade || '',
    montantHT:   p => p.montantHT || 0,
    dateObj:     p => p.dateObj,
  };
  const entreeSortDir = state.tableEntreeSortDir === 'desc' ? -1 : 1;
  const entreeGetter  = entreeGetters[state.tableEntreeSortCol] || entreeGetters.dateObj;
  const pendingStagesSorted = [...pendingStages].sort((a, b) => cmpVal(entreeGetter(a), entreeGetter(b)) * entreeSortDir);
  state._facturationEntreeRows = pendingStagesSorted;
  const entreeRows = pendingStagesSorted.map(p => {
    const b = p.affaire;
    let dateCell;
    if (!p.dateObj) {
      dateCell = `<span style="color:var(--text-muted)">Non planifiée</span>`;
    } else {
      const late = p.dateObj < today;
      dateCell = `<span style="${late ? 'color:#dc2626;font-weight:600' : ''}">${escHtml(p.dateStr)}${late ? ' ⚠️' : ''}</span>` +
        (p.estimeeAff ? ` <span style="font-size:10px;color:var(--text-muted)" title="Date estimée d'après la date de clôture/livraison de l'affaire (aucune date propre au stade)">(estimée)</span>` : '');
    }
    return `
    <tr style="border-bottom:1px solid var(--border);cursor:pointer" onclick="loadAffaire('${b.id}')"
        onmouseover="this.style.background='var(--gray-bg)'" onmouseout="this.style.background=''">
      <td style="padding:9px 10px;font-size:12px;color:var(--text-muted)">${escHtml(b.num_affaire||'—')}</td>
      <td style="padding:9px 10px;font-weight:500">${escHtml(b.nom_projet||b.navire_machine||'—')}</td>
      <td style="padding:9px 10px;font-size:12px;color:var(--text-muted)">${escHtml(b.client_nom||'—')}</td>
      <td style="padding:9px 10px;font-size:12px">${escHtml(p.stade)}</td>
      <td style="padding:9px 10px;text-align:right;font-weight:600;color:#0891b2">${fmtEur(p.montantHT)}
        ${!p.exo ? `<div style="font-size:10px;color:var(--text-muted);font-weight:400">TTC : ${fmtEur(p.montant)}</div>` : ''}</td>
      <td style="padding:9px 10px">${dateCell}</td>
    </tr>`;
  }).join('');

  // ── Tableau facturations en retard : sous-ensemble de pendingStages dont la date est dépassée ──
  const retardGetters = entreeGetters;
  const retardSortDir = state.tableRetardSortDir === 'desc' ? -1 : 1;
  const retardGetter  = retardGetters[state.tableRetardSortCol] || retardGetters.dateObj;
  const retardStagesSorted = pendingStages
    .filter(p => p.dateObj && p.dateObj < today)
    .map(p => ({ ...p, joursRetard: Math.round((today - p.dateObj) / 86400000) }))
    .sort((a, b) => cmpVal(retardGetter(a), retardGetter(b)) * retardSortDir);
  state._facturationRetardRows = retardStagesSorted;
  const totalRetardHT = retardStagesSorted.reduce((s, p) => s + p.montantHT, 0);
  const retardRows = retardStagesSorted.map(p => {
    const b = p.affaire;
    return `
    <tr style="border-bottom:1px solid var(--border);cursor:pointer" onclick="loadAffaire('${b.id}')"
        onmouseover="this.style.background='var(--gray-bg)'" onmouseout="this.style.background=''">
      <td style="padding:9px 10px;font-size:12px;color:var(--text-muted)">${escHtml(b.num_affaire||'—')}</td>
      <td style="padding:9px 10px;font-weight:500">${escHtml(b.nom_projet||b.navire_machine||'—')}</td>
      <td style="padding:9px 10px;font-size:12px;color:var(--text-muted)">${escHtml(b.client_nom||'—')}</td>
      <td style="padding:9px 10px;font-size:12px">${escHtml(p.stade)}</td>
      <td style="padding:9px 10px;text-align:right;font-weight:600;color:#dc2626">${fmtEur(p.montantHT)}
        ${!p.exo ? `<div style="font-size:10px;color:var(--text-muted);font-weight:400">TTC : ${fmtEur(p.montant)}</div>` : ''}</td>
      <td style="padding:9px 10px;color:#dc2626;font-weight:600">${escHtml(p.dateStr)} ⚠️</td>
      <td style="padding:9px 10px;text-align:right;color:#dc2626;font-weight:600">${p.joursRetard} j</td>
    </tr>`;
  }).join('');

  // ── Tableau reste : enrichi (HT payé/restant) puis trié selon state.tableResteSortCol/Dir ──
  const resteEnriched = avecReste.map(b => {
    const exo = b.exonere_tva == 1;
    return { ...b, _exo: exo, _payeHT: exo ? b._paye : b._paye / 1.20, _resteHT: exo ? b._reste : b._reste / 1.20 };
  });
  const resteGetters = {
    num_affaire: b => b.num_affaire || '',
    nom_projet:  b => b.nom_projet || b.navire_machine || '',
    client_nom:  b => b.client_nom || '',
    totalHT:     b => b._ht || 0,
    payeHT:      b => b._payeHT || 0,
    resteHT:     b => b._resteHT || 0,
    statut:      b => b.statut || '',
  };
  const resteSortDir = state.tableResteSortDir === 'desc' ? -1 : 1;
  const resteGetter  = resteGetters[state.tableResteSortCol] || resteGetters.resteHT;
  resteEnriched.sort((a, b) => cmpVal(resteGetter(a), resteGetter(b)) * resteSortDir);
  state._facturationResteRows = resteEnriched;
  const resteRows = resteEnriched.map(b => {
    const exo = b._exo, payeHT = b._payeHT, resteHT = b._resteHT;
    return `
    <tr style="border-bottom:1px solid var(--border);cursor:pointer" onclick="loadAffaire('${b.id}')"
        onmouseover="this.style.background='var(--gray-bg)'" onmouseout="this.style.background=''">
      <td style="padding:9px 10px;font-size:12px;color:var(--text-muted)">${escHtml(b.num_affaire||'—')}</td>
      <td style="padding:9px 10px;font-weight:500">${escHtml(b.nom_projet||b.navire_machine||'—')}</td>
      <td style="padding:9px 10px;font-size:12px;color:var(--text-muted)">${escHtml(b.client_nom||'—')}</td>
      <td style="padding:9px 10px;text-align:right">${b._ht ? fmtEur(b._ht) : '—'}
        ${!exo && b._ttc ? `<div style="font-size:10px;color:var(--text-muted);font-weight:400">TTC : ${fmtEur(b._ttc)}</div>` : ''}</td>
      <td style="padding:9px 10px;text-align:right;color:#059669;font-weight:600">${fmtEur(payeHT)}
        ${!exo ? `<div style="font-size:10px;color:var(--text-muted);font-weight:400">TTC : ${fmtEur(b._paye)}</div>` : ''}</td>
      <td style="padding:9px 10px;text-align:right;color:#dc2626;font-weight:700">${fmtEur(resteHT)}
        ${!exo ? `<div style="font-size:10px;color:var(--text-muted);font-weight:400">TTC : ${fmtEur(b._reste)}</div>` : ''}</td>
      <td style="padding:9px 10px">${statusBadge(b.statut)}</td>
    </tr>`;
  }).join('');

  const subTab = state.facturationSubTab || 'overview';

  // ── Onglet Vue d'ensemble : KPI, compteurs, donut/statuts, top clients ──
  const overviewSection = `
    <!-- KPI euros -->
    <div style="display:flex;flex-wrap:wrap;gap:10px">${kpiEur}</div>

    <!-- Compteurs -->
    <div style="display:flex;flex-wrap:wrap;gap:10px">${cptrs}</div>

    <!-- Donut + barres statut -->
    <div class="grid-donut" style="align-items:start">
      <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;text-align:center">
        <div style="font-size:13px;font-weight:600;margin-bottom:14px">Encaissement global</div>
        ${donutSvg}
        <div style="margin-top:10px;font-size:12px;color:var(--text-muted)">
          <span style="display:inline-flex;align-items:center;gap:4px;margin-right:8px">
            <span style="width:10px;height:10px;background:${fgCol};border-radius:50%;display:inline-block"></span>Encaissé</span>
          <span style="display:inline-flex;align-items:center;gap:4px">
            <span style="width:10px;height:10px;background:${bgCol};border-radius:50%;display:inline-block"></span>Reste</span>
        </div>
        <div style="margin-top:10px;font-size:12px;color:var(--text-muted)">${fmtEur(totPaye)} / ${fmtEur(totMontDu)}</div>
      </div>
      <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px">
        <div style="font-size:13px;font-weight:600;margin-bottom:16px">CA et encaissement par statut</div>
        ${statutBars}
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px">
          <span style="display:inline-flex;align-items:center;gap:4px;margin-right:12px"><span style="width:28px;height:6px;background:#6b7280;opacity:.3;border-radius:3px;display:inline-block"></span>CA total</span>
          <span style="display:inline-flex;align-items:center;gap:4px"><span style="width:28px;height:6px;background:#6b7280;border-radius:3px;display:inline-block"></span>Encaissé</span>
        </div>
      </div>
    </div>

    <!-- Top clients -->
    <div class="grid-2col" style="align-items:start">
      <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px">
        <div style="font-size:13px;font-weight:600;margin-bottom:16px">Top clients — CA TTC
          <span style="font-weight:400;font-size:11px;color:var(--text-muted)">(bleu pâle = total, vert = encaissé)</span>
        </div>
        ${cliBars}
      </div>
    </div>`;

  // ── Onglet Graphiques : les 3 histogrammes (CA achat, CA livraison, trésorerie) ──
  const chartsSection = `
    <!-- Prises de commande HT par date d'achat -->
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px">
        <div style="font-size:13px;font-weight:600">Prises de commande par ${unitLabel(achatUnit)}
          <span style="font-weight:400;font-size:11px;color:var(--text-muted)">(prix HT des affaires, basé sur la date d'achat — indépendant de l'encaissement)</span>
        </div>
        ${filterToolbar('achat', achatUnit, state.histoAchatFrom, state.histoAchatTo)}
      </div>
      ${histoAchat.keys.length > 0 ? `
      <div style="overflow-x:auto">${histoAchat.svg}</div>` : `<p style="color:var(--text-muted);font-size:13px">Aucune donnée sur la période.</p>`}
      <div style="font-size:11px;color:var(--text-muted);margin-top:6px">
        <span style="display:inline-flex;align-items:center;gap:4px"><span style="width:12px;height:8px;background:#2563eb;border-radius:2px;display:inline-block"></span>Montant HT des prises de commande</span>
      </div>
    </div>

    <!-- CA par période — prévisionnel, basé sur la date de livraison -->
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px">
        <div style="font-size:13px;font-weight:600">CA par ${unitLabel(livrUnit)}
          <span style="font-weight:400;font-size:11px;color:var(--text-muted)">(prévisionnel HT — basé sur la date de livraison)</span>
        </div>
        ${filterToolbar('livraison', livrUnit, state.histoLivraisonFrom, state.histoLivraisonTo)}
      </div>
      ${histoLivraison.keys.length > 0 ? `
      <div style="overflow-x:auto">${histoLivraison.svg}</div>` : `<p style="color:var(--text-muted);font-size:13px">Aucune donnée sur la période.</p>`}
      <div style="font-size:11px;color:var(--text-muted);margin-top:6px">
        <span style="display:inline-flex;align-items:center;gap:4px;margin-right:10px"><span style="width:12px;height:8px;background:#bfdbfe;border-radius:2px;display:inline-block"></span>Prévu HT</span>
        <span style="display:inline-flex;align-items:center;gap:4px"><span style="width:12px;height:8px;background:#2563eb;border-radius:2px;display:inline-block"></span>Encaissé HT</span>
      </div>
    </div>

    <!-- Trésorerie prévisionnelle -->
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">
        <div style="font-size:13px;font-weight:600">Trésorerie prévisionnelle
          <span style="font-weight:400;font-size:11px;color:var(--text-muted)">(basé sur la date prévisionnelle de chaque stade de facturation, ou à défaut la date de clôture/livraison estimée de l'affaire)</span>
        </div>
        ${filterToolbar('tresor', tresorUnit, state.tresorFrom, state.tresorTo)}
      </div>
      ${orderedKeys.length ? `
      <div style="overflow-x:auto">${cashChart.svg}</div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:6px">
        <span style="display:inline-flex;align-items:center;gap:4px;margin-right:10px"><span style="width:12px;height:8px;background:#dc2626;border-radius:2px;display:inline-block"></span>Retard</span>
        <span style="display:inline-flex;align-items:center;gap:4px;margin-right:10px"><span style="width:12px;height:8px;background:#2563eb;border-radius:2px;display:inline-block"></span>À venir (par ${unitLabel(tresorUnit)})</span>
        <span style="display:inline-flex;align-items:center;gap:4px"><span style="width:12px;height:8px;background:#9ca3af;border-radius:2px;display:inline-block"></span>Non planifié</span>
      </div>` : `<p style="color:var(--text-muted);font-size:13px">Aucune entrée en attente.</p>`}
    </div>

    <!-- Trésorerie prévisionnelle : tableau entrées / sorties par commande -->
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden">
      <div style="padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px">
        Trésorerie prévisionnelle — Entrées / Sorties
        <span style="font-weight:400;font-size:11px;color:var(--text-muted);margin-left:6px">
          Entrées : échéances de facturation restantes (vente) · Sorties : échéances de paiement restantes des commandes fournisseur (achat)
        </span>
      </div>
      ${tresorTableLines.length ? `
      ${tresorComboChart.svg ? `
      <div style="padding:16px;border-bottom:1px solid var(--border)">
        <div style="overflow-x:auto">${tresorComboChart.svg}</div>

          ${hasTresNonPlan ? ` <span>Non planifié (${fmtEur(tresEntreeNonPlan)} entrées / ${fmtEur(tresSortieNonPlan)} sorties) : sans date, visible dans le tableau ci-dessous uniquement.</span>` : ''}

  // ── Onglet Tableaux : retard + reste à payer + entrée estimée ──
  const tablesSection = `

    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden">
      <div style="padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <span>Facturations en retard
          <span style="font-weight:400;color:var(--text-muted);font-size:12px;margin-left:6px">${retardStagesSorted.length} stade${retardStagesSorted.length!==1?'s':''} en retard</span>
        </span>
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:13px;color:#dc2626;font-weight:700">${fmtEur(totalRetardHT)} <span style="font-size:10px;font-weight:400;color:var(--text-muted)">HT</span></span>
          ${retardStagesSorted.length ? `<button class="topbar-btn" style="padding:4px 10px;font-size:12px" onclick="exportRetardCsv()" title="Export Excel — les échéances à ${SEUIL_RETARD_COULEUR}+ jours de retard sont surlignées en rouge">⬇ Export Excel</button>` : ''}
        </div>
      </div>
      ${retardStagesSorted.length ? `
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead>
            <tr style="background:var(--gray-bg);border-bottom:2px solid var(--border)">
              ${thSortFact('retard','num_affaire','N°')}
              ${thSortFact('retard','nom_projet','Projet')}
              ${thSortFact('retard','client_nom','Client')}
              ${thSortFact('retard','stade','Stade')}
              ${thSortFact('retard','montantHT','Montant restant HT','right')}
              ${thSortFact('retard','dateObj','Date prévisionnelle')}
              <th style="padding:8px 10px;text-align:right;font-weight:600;color:var(--text-muted);white-space:nowrap">Retard</th>
            </tr>
          </thead>
          <tbody>${retardRows}</tbody>
        </table>
      </div>` : `
      <div class="empty-state" style="padding:40px 0">
        <h3>Aucun retard</h3>
        <p>Toutes les échéances de facturation sont à jour.</p>
      </div>`}
    </div>

    <!-- Affaires avec reste à payer -->
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden">
      <div style="padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <span>Affaires avec reste à payer
          <span style="font-weight:400;color:var(--text-muted);font-size:12px;margin-left:6px">${avecReste.length} affaire${avecReste.length!==1?'s':''}</span>
        </span>
        ${avecReste.length ? `<button class="topbar-btn" style="padding:4px 10px;font-size:12px" onclick="exportResteCsv()">⬇ Export CSV</button>` : ''}
      </div>
      ${avecReste.length ? `
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead>
            <tr style="background:var(--gray-bg);border-bottom:2px solid var(--border)">
              ${thSortFact('reste','num_affaire','N°')}
              ${thSortFact('reste','nom_projet','Projet')}
              ${thSortFact('reste','client_nom','Client')}
              ${thSortFact('reste','totalHT','Total HT','right')}
              ${thSortFact('reste','payeHT','Encaissé HT','right')}
              ${thSortFact('reste','resteHT','Reste HT','right')}
              ${thSortFact('reste','statut','Statut')}
            </tr>
          </thead>
          <tbody>${resteRows}</tbody>
        </table>
      </div>` : `
      <div class="empty-state" style="padding:40px 0">
        <h3>Tout est soldé !</h3>
        <p>Aucune affaire avec un solde impayé.</p>
      </div>`}
    </div>

    <!-- Entrée estimée -->
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden">
      <div style="padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <span>Entrée estimée
          <span style="font-weight:400;color:var(--text-muted);font-size:12px;margin-left:6px">${pendingStages.length} stade${pendingStages.length!==1?'s':''} en attente</span>
        </span>
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:13px;color:#0891b2;font-weight:700">${fmtEur(totalEntreeEstimeeHT)} <span style="font-size:10px;font-weight:400;color:var(--text-muted)">HT</span></span>
          ${pendingStages.length ? `<button class="topbar-btn" style="padding:4px 10px;font-size:12px" onclick="exportEntreeCsv()">⬇ Export CSV</button>` : ''}
        </div>
      </div>
      ${pendingStages.length ? `
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead>
            <tr style="background:var(--gray-bg);border-bottom:2px solid var(--border)">
              ${thSortFact('entree','num_affaire','N°')}
              ${thSortFact('entree','nom_projet','Projet')}
              ${thSortFact('entree','client_nom','Client')}
              ${thSortFact('entree','stade','Stade')}
              ${thSortFact('entree','montantHT','Montant restant HT','right')}
              ${thSortFact('entree','dateObj','Date prévisionnelle')}
            </tr>
          </thead>
          <tbody>${entreeRows}</tbody>
        </table>
      </div>` : `
      <div class="empty-state" style="padding:40px 0">
        <h3>Rien en attente</h3>
        <p>Aucun stade de facturation restant à encaisser.</p>
      </div>`}
    </div>`;

  // ── Onglet Commandes : statistiques sur les bons de commande (Achats) ──
  const bons = state.facturationBons || [];
  const nbBons        = bons.length;
  const bonsTotalHT    = bons.reduce((s, b) => s + (b.total_ht  || 0), 0);
  const bonsTotalTTC   = bons.reduce((s, b) => s + (b.total_ttc || 0), 0);
  const bonsMoyenneHT  = nbBons ? bonsTotalHT / nbBons : 0;
  const bcStatutColors = { 'Brouillon':'#6b7280', 'Envoyé':'#2563eb', 'Confirmé':'#7c3aed', 'Reçu partiellement':'#d97706', 'Reçu':'#059669', 'Annulé':'#dc2626' };
  const bonsByStatut = BC_STATUTS.map(s => {
    const grp = bons.filter(b => b.statut === s);
    return { statut: s, nb: grp.length, ht: grp.reduce((x, b) => x + (b.total_ht || 0), 0) };
  }).filter(s => s.nb > 0);
  const maxBonsStatutHT = Math.max(...bonsByStatut.map(s => s.ht), 1);

  // ── Graphiques commandes : montant HT par période (même forme que l'onglet Graphiques) ──
  const buildBcHtHisto = (dateField, unit, fromD, toD, barColor) => {
    const buckets = {};
    bons.forEach(b => {
      const d = parseFrDate(b[dateField]);
      if (!d) return;
      if (fromD && d < fromD) return;
      if (toD   && d > toD)   return;
      const { key, label } = bucketOf(d, unit);
      if (!buckets[key]) buckets[key] = { label, ht: 0 };
      buckets[key].ht += b.total_ht || 0;
    });
    const keys = Object.keys(buckets).sort();
    return buildBarChart(keys, buckets, [{ get: d => d.ht, color: barColor }], {
      tooltip: d => `${d.label} — ${fmtEur(d.ht)}`,
    });
  };

  const buildBcLivraisonHisto = (unit, fromD, toD) => {
    const buckets = {};
    bons.forEach(b => {
      const d = parseFrDate(b.date_livraison_prevue);
      if (!d) return;
      if (fromD && d < fromD) return;
      if (toD   && d > toD)   return;
      const { key, label } = bucketOf(d, unit);
      if (!buckets[key]) buckets[key] = { label, ht: 0, livreHT: 0 };
      buckets[key].ht += b.total_ht || 0;
      if (b.date_livraison_reelle) buckets[key].livreHT += b.total_ht || 0;
    });
    const keys = Object.keys(buckets).sort();
    return buildBarChart(keys, buckets, [
      { get: d => d.ht,      color: '#fde68a' },
      { get: d => d.livreHT, color: '#d97706' },
    ], {
      tooltip: d => `${d.label} — Prévu HT : ${fmtEur(d.ht)} | Livré HT : ${fmtEur(d.livreHT)}`,
    });
  };

  const bcCommandeUnit  = state.histoBcCommandeUnit || 'annee';
  const bcCommandeFromD = state.histoBcCommandeFrom ? new Date(state.histoBcCommandeFrom + 'T00:00:00') : null;
  const bcCommandeToD   = state.histoBcCommandeTo   ? new Date(state.histoBcCommandeTo   + 'T23:59:59') : null;
  const histoBcCommande = buildBcHtHisto('date_commande', bcCommandeUnit, bcCommandeFromD, bcCommandeToD, '#2563eb');

  const bcLivraisonHUnit  = state.histoBcLivraisonUnit || 'annee';
  const bcLivraisonHFromD = state.histoBcLivraisonFrom ? new Date(state.histoBcLivraisonFrom + 'T00:00:00') : null;
  const bcLivraisonHToD   = state.histoBcLivraisonTo   ? new Date(state.histoBcLivraisonTo   + 'T23:59:59') : null;
  const histoBcLivraison = buildBcLivraisonHisto(bcLivraisonHUnit, bcLivraisonHFromD, bcLivraisonHToD);

  const bcReglementUnit  = state.histoBcReglementUnit || 'annee';
  const bcReglementFromD = state.histoBcReglementFrom ? new Date(state.histoBcReglementFrom + 'T00:00:00') : null;
  const bcReglementToD   = state.histoBcReglementTo   ? new Date(state.histoBcReglementTo   + 'T23:59:59') : null;
  const histoBcReglement = buildBcHtHisto('date_reglement', bcReglementUnit, bcReglementFromD, bcReglementToD, '#059669');

  const chartsCommandesSection = `
    <!-- Commandes passées par période -->
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px">
        <div style="font-size:13px;font-weight:600">Commandes passées par ${unitLabel(bcCommandeUnit)}
          <span style="font-weight:400;font-size:11px;color:var(--text-muted)">(montant HT, basé sur la date de commande)</span>
        </div>
        ${filterToolbar('bcCommande', bcCommandeUnit, state.histoBcCommandeFrom, state.histoBcCommandeTo)}
      </div>
      ${histoBcCommande.keys.length > 0 ? `
      <div style="overflow-x:auto">${histoBcCommande.svg}</div>` : `<p style="color:var(--text-muted);font-size:13px">Aucune donnée sur la période.</p>`}
      <div style="font-size:11px;color:var(--text-muted);margin-top:6px">
        <span style="display:inline-flex;align-items:center;gap:4px"><span style="width:12px;height:8px;background:#2563eb;border-radius:2px;display:inline-block"></span>Montant HT commandé</span>
      </div>
    </div>

    <!-- Livraisons prévues / réalisées par période -->
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px">
        <div style="font-size:13px;font-weight:600">Livraisons par ${unitLabel(bcLivraisonHUnit)}
          <span style="font-weight:400;font-size:11px;color:var(--text-muted)">(montant HT, basé sur la date de livraison prévue)</span>
        </div>
        ${filterToolbar('bcLivraison', bcLivraisonHUnit, state.histoBcLivraisonFrom, state.histoBcLivraisonTo)}
      </div>
      ${histoBcLivraison.keys.length > 0 ? `
      <div style="overflow-x:auto">${histoBcLivraison.svg}</div>` : `<p style="color:var(--text-muted);font-size:13px">Aucune donnée sur la période.</p>`}
      <div style="font-size:11px;color:var(--text-muted);margin-top:6px">
        <span style="display:inline-flex;align-items:center;gap:4px;margin-right:10px"><span style="width:12px;height:8px;background:#fde68a;border-radius:2px;display:inline-block"></span>Prévu HT</span>
        <span style="display:inline-flex;align-items:center;gap:4px"><span style="width:12px;height:8px;background:#d97706;border-radius:2px;display:inline-block"></span>Livré HT</span>
      </div>
    </div>

    <!-- Règlements par période -->
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px">
        <div style="font-size:13px;font-weight:600">Règlements par ${unitLabel(bcReglementUnit)}
          <span style="font-weight:400;font-size:11px;color:var(--text-muted)">(montant HT, basé sur la date de règlement)</span>
        </div>
        ${filterToolbar('bcReglement', bcReglementUnit, state.histoBcReglementFrom, state.histoBcReglementTo)}
      </div>
      ${histoBcReglement.keys.length > 0 ? `
      <div style="overflow-x:auto">${histoBcReglement.svg}</div>` : `<p style="color:var(--text-muted);font-size:13px">Aucune donnée sur la période.</p>`}
      <div style="font-size:11px;color:var(--text-muted);margin-top:6px">
        <span style="display:inline-flex;align-items:center;gap:4px"><span style="width:12px;height:8px;background:#059669;border-radius:2px;display:inline-block"></span>Montant HT réglé</span>
      </div>
    </div>`;

  const kpiCommandes = [
    { label: 'Commandes total',    value: String(nbBons),         col:'#1e3a5f', bg:'#eff6ff' },
    { label: 'Montant total HT',   value: fmtEur(bonsTotalHT),    col:'#b45309', bg:'#fffbeb' },
    { label: 'Montant total TTC',  value: fmtEur(bonsTotalTTC),   col:'#b45309', bg:'#fffbeb' },
    { label: 'Montant moyen HT',   value: fmtEur(bonsMoyenneHT),  col:'#1e3a5f', bg:'#eff6ff' },
  ].map(k => `
    <div style="background:${k.bg};border:1px solid ${k.col}22;border-radius:10px;padding:16px 18px;flex:1;min-width:130px">
      <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">${k.label}</div>
      <div style="font-size:18px;font-weight:700;color:${k.col}">${k.value}</div>
    </div>`).join('');

  const commandesStatutBars = bonsByStatut.map(s => {
    const col  = bcStatutColors[s.statut] || '#6b7280';
    const wHT  = (s.ht / maxBonsStatutHT * 100).toFixed(1);
    return `
      <div style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
          <span style="font-size:12px;font-weight:600;color:${col}">${s.statut}
            <span style="font-weight:400;color:var(--text-muted)">(${s.nb} commande${s.nb>1?'s':''})</span></span>
          <span style="font-size:12px;color:var(--text-muted)">${fmtEur(s.ht)}</span>
        </div>
        <div style="position:relative;background:#e2e8f0;border-radius:8px;height:12px;overflow:hidden">
          <div style="position:absolute;left:0;top:0;height:100%;width:${wHT}%;background:${col};border-radius:8px"></div>
        </div>
      </div>`;
  }).join('') || '<p style="color:var(--text-muted);font-size:13px">Aucune commande.</p>';

  // ── Livraisons : comparaison date prévue / réelle ──
  const bonsLivraison = bons.map(b => {
    const dPrevue = parseFrDate(b.date_livraison_prevue);
    const dReelle = parseFrDate(b.date_livraison_reelle);
    let etat = 'non_definie', retardJours = null;
    if (dReelle) {
      retardJours = dPrevue ? Math.round((dReelle - dPrevue) / 86400000) : null;
      etat = (retardJours !== null && retardJours > 0) ? 'retard' : 'a_temps';
    } else if (dPrevue) {
      etat = dPrevue < today ? 'attente_retard' : 'attente';
    }
    return { ...b, _dPrevue: dPrevue, _dReelle: dReelle, _etatLivraison: etat, _retardJours: retardJours };
  });
  const nbLivrees       = bonsLivraison.filter(b => b._dReelle).length;
  const nbLivreesATemps = bonsLivraison.filter(b => b._etatLivraison === 'a_temps').length;
  const nbLivreesRetard = bonsLivraison.filter(b => b._etatLivraison === 'retard').length;
  const retardsJours    = bonsLivraison.filter(b => b._retardJours !== null && b._retardJours > 0).map(b => b._retardJours);
  const retardMoyenJours= retardsJours.length ? Math.round(retardsJours.reduce((s,d)=>s+d,0) / retardsJours.length) : 0;

  const attenteLivraison = bonsLivraison
    .filter(b => !b._dReelle && b._dPrevue && b.statut !== 'Annulé')
    .sort((a, b) => a._dPrevue - b._dPrevue);
  state._bcLivraisonRows = attenteLivraison;

  const kpiLivraison = [
    { label: 'Livrées',           value: String(nbLivrees),                    col:'#1e3a5f', bg:'#eff6ff' },
    { label: 'Livrées à temps',   value: String(nbLivreesATemps),              col:'#059669', bg:'#d1fae5' },
    { label: 'Livrées en retard', value: String(nbLivreesRetard),              col:'#dc2626', bg:'#fee2e2' },
    { label: 'Retard moyen',      value: retardsJours.length ? `${retardMoyenJours} j` : '—', col:'#b45309', bg:'#fffbeb' },
  ].map(k => `
    <div style="background:${k.bg};border:1px solid ${k.col}22;border-radius:10px;padding:16px 18px;flex:1;min-width:130px">
      <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">${k.label}</div>
      <div style="font-size:18px;font-weight:700;color:${k.col}">${k.value}</div>
    </div>`).join('');

  const livraisonRows = attenteLivraison.map(b => {
    const late = b._etatLivraison === 'attente_retard';
    return `
    <tr style="border-bottom:1px solid var(--border);cursor:pointer" onclick="openBcModal('${b.id}')"
        onmouseover="this.style.background='var(--gray-bg)'" onmouseout="this.style.background=''">
      <td style="padding:9px 10px;font-size:12px;color:var(--text-muted)">${escHtml(b.num_bc||'—')}</td>
      <td style="padding:9px 10px;font-weight:500">${escHtml(b.fournisseur_nom||'—')}</td>
      <td style="padding:9px 10px;font-size:12px;color:var(--text-muted)">${b.affaire_id ? escHtml(b.affaire_num||'') : '—'}</td>
      <td style="padding:9px 10px">${late ? `<span style="color:#dc2626;font-weight:600">${escHtml(b.date_livraison_prevue)} ⚠️</span>` : escHtml(b.date_livraison_prevue)}</td>
      <td style="padding:9px 10px">${bcStatutBadge(b.statut)}</td>
    </tr>`;

/* ═══════════════════════════════════════════════
   LOAD AFFAIRE
═══════════════════════════════════════════════ */
async function loadAffaire(id) {
  state.view = 'detail';
  state.currentId = id;
  renderNav();
  _pushNavState();
  document.getElementById('topbar-title').textContent = 'Chargement…';
  document.getElementById('content').innerHTML = '<div style="padding:40px;text-align:center"><div class="spinner spinner-dark"></div></div>';
  try {
    const [aff, items, couts] = await Promise.all([
      GET(`/affaires/${id}`),
      GET(`/affaires/${id}/items`),
      GET(`/affaires/${id}/couts`),
    ]);
    state.currentAffaire = aff;
    state.currentItems = items;
    state.currentCouts = couts;
    // Filter moteurs linked to this affaire via code_affaire field (code court AAAANNNN)
    const affCode = codeAffaireFromNum(aff.num_affaire);
    const allMoteurs = await GET(`/moteurs?search=${encodeURIComponent(affCode)}`);
    state.currentMoteurs = allMoteurs.filter(m => m.code_affaire === affCode);
    // Compléter avec les moteurs référencés dans les chapitres mais absents de state.currentMoteurs
    // (cas d'un num_serie saisi manuellement ou d'un moteur délié depuis)
    const numSeriesChapitres = [...new Set(items.filter(it => it.num_serie).map(it => it.num_serie))];
    for (const ns of numSeriesChapitres) {
      if (!state.currentMoteurs.find(m => m.num_serie === ns)) {
        const mFound = await GET(`/moteurs/by-serie/${encodeURIComponent(ns)}`).catch(() => null);
        if (mFound && mFound.id) state.currentMoteurs.push(mFound);
      }
    }
    // Load interventions for each linked moteur (filtre exact par moteur_id, pas une recherche floue)
    const seenIntervIds = new Set();
    state.currentIntervs = [];
    for (const m of state.currentMoteurs) {
      if (!m.id) continue;
      const intrvs = await GET(`/interventions/by-moteur/${encodeURIComponent(m.id)}`).catch(() => []);
      for (const iv of intrvs) {
        if (seenIntervIds.has(iv.id)) continue;
        seenIntervIds.add(iv.id);
        state.currentIntervs.push(iv);
      }
    }
    renderAffaireDetail();
  } catch(e) {
    toast('Erreur chargement affaire: ' + e.message, 'error');
    document.getElementById('content').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><h3>Erreur de chargement</h3><p>'+escHtml(e.message)+'</p></div>';
  }
}
