   ONGLET DOCUMENTS – ARBORESCENCE
═══════════════════════════════════════════════ */
let _docExpanded = new Set();

async function renderDocumentsTab() {
  const el = document.getElementById('tab-content');
  if (!el) return;
  const dossierPath = _toClientPath(state.currentAffaire?.dossier_path || '');
  el.innerHTML = `
    <div id="doc-zone">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">
        <span style="font-size:11px;color:var(--text-muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:monospace;min-width:0"
              title="${escHtml(dossierPath)}">${escHtml(dossierPath || '—')}</span>
        <button class="btn btn-secondary btn-xs no-print" onclick="openDossier()" title="Ouvrir dans l'explorateur Windows">Explorateur</button>
      </div>
      <div id="doc-tree-container" style="display:flex;flex-direction:column;gap:4px">
        <div style="color:var(--text-muted);font-size:13px;padding:20px;text-align:center">Chargement…</div>
      </div>
    </div>`;
  await docLoadTree();
}

async function docLoadTree(afterInit = false) {
  const id = state.currentId;
  const ct = document.getElementById('doc-tree-container');
  if (!ct || !id) return;
  try {
    const tree = await GET(`/affaires/${id}/folder-tree`);
    const isEmpty = !tree.folders.length && !tree.files.length;
    // Dossier absent côté serveur → une seule tentative de création côté client
    if (isEmpty && !afterInit && LOCAL_PORT) {
      ct.innerHTML = '<div style="color:var(--text-muted);font-size:13px;padding:20px;text-align:center">Initialisation du dossier…</div>';
      try {
        const info = await GET(`/affaires/${id}/ensure-dossier`);
        const clientPath = _toClientPath(info.path);
        if (clientPath) {
          await fetch('http://127.0.0.1:' + LOCAL_PORT + '/ensure-arborescence?path=' + encodeURIComponent(clientPath), {mode:'no-cors'});
        }
      } catch(_) {}
      setTimeout(() => docLoadTree(true), 600);
      return;
    }
    // Serveur ne lit pas O:\ même après création côté client
    if (isEmpty && afterInit) {
      ct.innerHTML = '<div style="font-size:13px;color:var(--text-muted);font-style:italic;padding:20px;text-align:center">Dossier initialisé — utilisez Explorateur pour y accéder.</div>';
      return;
    }
    // Seul le sous-dossier COMMERCIAL est affiché dans l'onglet Dossier
    // (les autres dossiers de l'arborescence standard restent créés sur le
    // disque mais ne sont pas montrés ici).
    tree.folders = (tree.folders || []).filter(f => f.name === 'COMMERCIAL');
    if (_docExpanded.size === 0) {
      for (const f of tree.folders) {
        _docExpanded.add(f.rel);
        for (const sub of f.folders) _docExpanded.add(sub.rel);
      }
    }
    ct.innerHTML = _docRenderChildren(tree, id, true);
  } catch(e) {
    ct.innerHTML = `<div style="color:var(--danger);font-size:13px;padding:12px">Erreur chargement: ${escHtml(e.message)}</div>`;
  }
}

function _docRenderChildren(node, id, isRoot) {
  const folders = (node.folders || []).map(f => _docFolderNode(f, id)).join('');
  const files = (node.files || []).map(f => _docFileRow(f, id)).join('');
  const content = folders + files;
  if (!content && isRoot) {
    return '<div style="font-size:13px;color:var(--text-muted);font-style:italic;padding:20px;text-align:center">Aucun document dans ce dossier</div>';
  }
  return content;
}

function _docFolderNode(folder, id) {
  const open = _docExpanded.has(folder.rel);
  const total = _docCountFiles(folder);
  const badge = total ? `<span style="font-size:11px;background:var(--gray-bg);padding:1px 7px;border-radius:10px;color:var(--text-muted);flex-shrink:0">${total}</span>` : '';
  const content = open
    ? `<div style="padding-left:18px;margin-top:3px">${_docRenderChildren(folder, id, false)}</div>`
    : '';
  return `
    <div style="margin-bottom:4px">
      <div class="doc-folder-drop" style="display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--surface);border:1px solid var(--border);border-radius:6px;cursor:pointer;user-select:none"
           onclick="docToggleFolder(${_qs(folder.rel)})"
           ondragover="event.preventDefault();event.stopPropagation();this.classList.add('drag-over')"
           ondragleave="event.stopPropagation();this.classList.remove('drag-over')"
           ondrop="docHandleDrop(event, ${_qs(folder.rel)})">
        <span style="font-size:10px;color:var(--text-muted);width:10px;flex-shrink:0">${open ? '▼' : '►'}</span>
        <span style="flex:1;font-size:13px;font-weight:600">${escHtml(folder.name)}</span>
        ${badge}
        <label class="btn btn-secondary btn-xs no-print" style="cursor:pointer;margin:0;flex-shrink:0" title="Ajouter des fichiers" onclick="event.stopPropagation()">
          Ajouter
          <input type="file" multiple style="display:none" onchange="docUploadToFolder(${_qs(folder.rel)}, this)">
        </label>
      </div>
      ${content}
    </div>`;
}

function _docFileRow(file, id) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const size = file.size > 1048576 ? (file.size/1048576).toFixed(1)+' Mo'
             : file.size > 1024 ? Math.round(file.size/1024)+' Ko'
             : file.size+' o';
  const d = new Date(file.modified*1000).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});
  const canView = ['pdf','png','jpg','jpeg','gif','bmp','webp','svg'].includes(ext);
  const viewBtn = canView
    ? `<button class="btn-icon" onclick="docViewFile(${_qs(file.rel)})" title="Ouvrir" style="font-size:14px">👁</button>`
    : '';
  return `
    <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);margin-bottom:3px">
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escHtml(file.name)}">${escHtml(file.name)}</div>
        <div style="font-size:11px;color:var(--text-muted)">${size} · ${d}</div>
      </div>
      ${viewBtn}
      <a href="${API_BASE}/affaires/${id}/file?rel=${encodeURIComponent(file.rel)}&dl=1"
         download="${escHtml(file.name)}" class="btn-icon" title="Télécharger" style="text-decoration:none;font-size:14px">⬇</a>
      <button class="btn-icon red no-print" style="font-size:12px"
              onclick="docDeleteFolderFile(${_qs(file.rel)},${_qs(file.name)})"
              title="Supprimer">✕</button>
    </div>`;
}

function _docCountFiles(folder) {
  let n = folder.files.length;
  for (const f of folder.folders) n += _docCountFiles(f);
  return n;
}

async function docToggleFolder(rel) {
  if (_docExpanded.has(rel)) _docExpanded.delete(rel);
  else _docExpanded.add(rel);
  await docLoadTree();
}

async function docUploadToFolder(folder, input) {
  const files = [...input.files];
  input.value = '';
  await _docUploadFiles(folder, files);
}

async function docHandleDrop(ev, folder) {
  ev.preventDefault();
  ev.stopPropagation();
  ev.currentTarget.classList.remove('drag-over');
  const files = [...(ev.dataTransfer?.files || [])];
  await _docUploadFiles(folder, files);
}

async function _docUploadFiles(folder, files) {
  if (!files.length) return;
  const id = state.currentId;
  let done = 0;
  for (const file of files) {
    try {
      const fd = new FormData();
      fd.append('file', file);
      fd.append('folder', folder);
      const r = await fetch(`${API_BASE}/affaires/${id}/folder-upload`, {method:'POST', body:fd});
      if (!r.ok) throw new Error(await r.text());
      done++;
    } catch(e) { toast('Erreur : ' + file.name + ' – ' + e.message, 'error'); }
  }
  if (done) {
    toast(done + ' fichier' + (done>1?'s':'') + ' ajouté' + (done>1?'s':''), 'success');
    if (folder) _docExpanded.add(folder);
    await docLoadTree();
  }
}

function docViewFile(rel) {
  window.open(`${API_BASE}/affaires/${state.currentId}/file?rel=${encodeURIComponent(rel)}`, '_blank');
}

async function docDeleteFolderFile(rel, name) {
  if (!window.confirm(`Supprimer "${name}" ?`)) return;
  try {
    const r = await fetch(`${API_BASE}/affaires/${state.currentId}/folder-file?rel=${encodeURIComponent(rel)}`, {method:'DELETE'});
    if (!r.ok && r.status !== 204) throw new Error(await r.text());
    toast('Fichier supprimé', 'success');
    await docLoadTree();
  } catch(e) { toast('Erreur suppression : ' + e.message, 'error'); }
}

async function openDossier() {
  if (!state.currentId) return;
  try {
    if (!LOCAL_PORT) { toast('Serveur local non disponible', 'error'); return; }
    const result = await GET(`/affaires/${state.currentId}/ensure-dossier`);
    const clientPath = _toClientPath(result.path);
    if (!clientPath) { toast('Impossible de déterminer le chemin du dossier', 'warning'); return; }
    if (state.currentAffaire) state.currentAffaire.dossier_path = result.path;
    // Création dossier + arborescence côté client (accès O:\ garanti)
    await fetch('http://127.0.0.1:' + LOCAL_PORT + '/open-folder?path=' + encodeURIComponent(clientPath), {mode:'no-cors'});
    toast('Dossier ouvert dans l\'explorateur', 'success', 2000);
  } catch(e) { toast('Impossible d\'ouvrir le dossier : ' + e.message, 'error'); }
}

let _wbSaveTimer = null;

function renderWhiteboardTab() {
  const el = document.getElementById('tab-content');
  if (!el) return;
  const a = state.currentAffaire;
  const content = (a && a.whiteboard) ? a.whiteboard : '';

  el.innerHTML = `
<div id="wb-container">
  <div id="wb-toolbar" style="display:flex;flex-wrap:wrap;align-items:center;gap:3px;padding:6px 10px;background:var(--gray-bg);border:1px solid var(--border);border-radius:8px 8px 0 0;border-bottom:none">
    <button class="wb-btn" onclick="wbCmd('bold')" title="Gras (Ctrl+B)"><b>B</b></button>
    <button class="wb-btn" onclick="wbCmd('italic')" title="Italique (Ctrl+I)"><i>I</i></button>
    <button class="wb-btn" onclick="wbCmd('underline')" title="Souligné (Ctrl+U)"><u>U</u></button>
    <span style="width:1px;height:18px;background:var(--border);margin:0 4px;display:inline-block"></span>
    <button class="wb-btn" onclick="wbCmd('formatBlock','h2')" title="Titre">H1</button>
    <button class="wb-btn" onclick="wbCmd('formatBlock','h3')" title="Sous-titre">H2</button>
    <button class="wb-btn" onclick="wbCmd('formatBlock','p')" title="Paragraphe normal">¶</button>
    <span style="width:1px;height:18px;background:var(--border);margin:0 4px;display:inline-block"></span>
    <button class="wb-btn" onclick="wbCmd('insertUnorderedList')" title="Liste à puces">• liste</button>
    <button class="wb-btn" onclick="wbCmd('insertOrderedList')" title="Liste numérotée">1. liste</button>
    <span style="width:1px;height:18px;background:var(--border);margin:0 4px;display:inline-block"></span>
    <button class="wb-btn" onclick="wbInsertHR()" title="Trait séparateur">── ──</button>
    <button class="wb-btn" onclick="wbInsertImage()" title="Insérer une image depuis le disque">🖼 Image</button>
    <span style="flex:1"></span>
    <span id="wb-save-status" style="font-size:11px;color:var(--text-muted);padding:0 6px;white-space:nowrap"></span>
    <button class="wb-btn wb-btn-danger" onclick="wbClear()" title="Effacer tout">🗑</button>
  </div>
  <div id="wb-editor"
       contenteditable="true"
       spellcheck="true"
       style="min-height:460px;border:1px solid var(--border);border-radius:0 0 8px 8px;padding:18px 22px;font-size:14px;line-height:1.75;overflow-y:auto;background:var(--bg);outline:none;cursor:text;word-break:break-word"
  >${content || '<p><br></p>'}</div>
  <div style="font-size:11px;color:var(--text-muted);margin-top:6px;padding-left:2px">
    Coller des captures d'écran directement avec <kbd style="background:var(--gray-bg);border:1px solid var(--border);border-radius:3px;padding:0 4px">Ctrl+V</kbd> · Les modifications sont sauvegardées automatiquement.
  </div>
  <input type="file" id="wb-file-input" accept="image/*" style="display:none" onchange="wbHandleFileInput(this)">
</div>`;

  const editor = document.getElementById('wb-editor');
  if (!editor) return;
  editor.addEventListener('paste', wbHandlePaste);
  editor.addEventListener('input', wbScheduleSave);
  // Click sur image → sélectionner pour supprimer facilement
  editor.addEventListener('click', e => {
    if (e.target.tagName === 'IMG') {
      const sel = window.getSelection();
      const range = document.createRange();
      range.selectNode(e.target);
      sel.removeAllRanges();
      sel.addRange(range);
    }
  });
}

function wbCmd(cmd, val) {
  document.execCommand(cmd, false, val || null);
  document.getElementById('wb-editor')?.focus();
  wbScheduleSave();
}

function wbInsertHR() {
  document.execCommand('insertHTML', false,
    '<hr style="border:none;border-top:2px solid var(--border);margin:14px 0">');
  document.getElementById('wb-editor')?.focus();
  wbScheduleSave();
}

function wbInsertImage() {
  document.getElementById('wb-file-input')?.click();
}

function wbHandleFileInput(input) {
  const file = input.files[0];
  input.value = '';
  if (!file || !file.type.startsWith('image/')) return;
  wbEmbedBlob(file);
}

function wbHandlePaste(e) {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      wbEmbedBlob(item.getAsFile());
      return;
    }
  }
}

function wbEmbedBlob(blob) {
  if (!blob) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const editor = document.getElementById('wb-editor');
    if (!editor) return;
    editor.focus();
    document.execCommand('insertHTML', false,
      `<img src="${ev.target.result}" style="max-width:100%;border-radius:6px;margin:6px 0;display:block" alt="">`);
    wbScheduleSave();
  };
  reader.readAsDataURL(blob);
}

function wbClear() {
  if (!window.confirm('Effacer tout le contenu du tableau blanc ?')) return;
  const editor = document.getElementById('wb-editor');
  if (!editor) return;
  editor.innerHTML = '<p><br></p>';
  wbScheduleSave();
}

function wbScheduleSave() {
  const statusEl = document.getElementById('wb-save-status');
  if (statusEl) statusEl.textContent = 'Modification…';
  clearTimeout(_wbSaveTimer);
  _wbSaveTimer = setTimeout(wbSave, 1500);
}

async function wbSave() {
  if (!state.currentId) return;
  const editor = document.getElementById('wb-editor');
  if (!editor) return;
  const html = editor.innerHTML;
  const statusEl = document.getElementById('wb-save-status');
  if (statusEl) statusEl.textContent = 'Sauvegarde…';
  try {
    await PUT('/affaires/' + state.currentId, { whiteboard: html });
    if (state.currentAffaire) state.currentAffaire.whiteboard = html;
    if (statusEl) {
      statusEl.textContent = 'Enregistré ✓';
      setTimeout(() => { if (statusEl) statusEl.textContent = ''; }, 2500);
    }
  } catch(e) {
    if (statusEl) statusEl.textContent = '⚠ Erreur';
    toast('Erreur sauvegarde tableau blanc', 'error');
  }
}


</script>
</body>
</html>
